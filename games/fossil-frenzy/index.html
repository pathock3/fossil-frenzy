      ${nextBtn ? `<button class="big" data-act="next">Next: ${esc(LV[ui.levelIdx + 1].name)}</button><button class="big alt" data-act="again">Play ${esc(LV[ui.levelIdx].name)} again</button>`
                : `<button class="big" data-act="again">${campaign ? 'Try again' : 'Play again'}</button>`}
      <button class="big alt" data-act="home">Main menu</button></div></div>`;
  }

  const JUDGMENTS = [
    'The board is a hexagon of 31 spaces, one fossil on each. There are no pieces and no movement: you can peek at any fossil.',
    'Your first tap is a private peek (the board shows you the number — hold the device toward yourself); your second tap is a public flip. Fossils that do not match flip back at the end of your turn.',
    'A peek does not use up your turn: you may bank instead of flipping.',
    'Matches are pairs (a set of three for the gems). Only the fossil you peeked can be matched, against the one you flipped.',
    'Banking takes one set of your choice, worth the number on its fossil (a gem is 16), then a d6 chain adds +1 for every 6. Sets you never bank are worth nothing.',
    'Banking is your whole turn, so it ends the moment you tap the set — there is no End turn tap afterwards.',
    'Who goes first is decided at random, without a screen for it; a card names whose turn it is before they tap (in Pass & Play, every turn).',
    'After you peek a gem and flip a gem, tapping a third fossil is your consent to reveal your peeked gem too.',
    'An opponent\'s turn is shown one move at a time: a peek (the fossil lifts, the number stays hidden), then the flip, right away. Its turn stays on the board until you tap a fossil — that tap starts your turn, so there is no Continue. When it banks, a banner says what it scored and its new total.',
    'Your held sets live in the scoreboard at the top, under your score — that is also where you tap one to bank it.',
    'Ties go to the most sets popped, then whoever popped the final pair.',
    'Campaign: you beat a level by winning outright (a shared win does not count). Opponents differ in how well they remember fossils and how carefully they plan their banking.',
  ];
  function helpHTML() {
    return `<div class="screen help" style="z-index:5"><div class="sheet"><h1>How to play</h1>
      <p>Match fossils from memory, bank your matches, and finish with the most points.</p>
      <h3>Your turn</h3><ul>
        <li><b>Peek</b> at any fossil — tap it. Only you should look.</li>
        <li><b>Flip</b> another fossil — tap it. Everyone sees it.</li>
        <li>If your peek and the flipped fossil match, they are yours. Otherwise tap <b>End turn</b> to flip them back — remember them!</li>
        <li>The scores are at the top, and whose turn it is is lit up. Who goes first is decided at random.</li>
        <li><b>Gems</b> (💎, worth 16) match as a set of three: peek a gem, flip a gem, then tap a third fossil — that reveals your peeked gem too, and if the third is a gem, the set is yours.</li>
        <li><b>Bank</b> instead of flipping: tap ONE of your held sets. It scores the number on its fossil (a gem is 16), then a d6 chain: every 6 adds +1 and rolls again. Banking takes the whole turn, so your turn ends the moment you bank.</li>
      </ul>
      <h3>End</h3><p>The game ends the moment every fossil is matched. Sets you have not banked are lost. Highest score wins; ties go to the most sets popped, then whoever popped the final pair.</p>
      <h3>Judgment calls (where the rules were unclear)</h3><ul>${JUDGMENTS.map(j => `<li>${esc(j)}</li>`).join('')}</ul>
      <p class="dim">The full list is in DECISIONS.md. Version ${esc(BUILD)}.</p>
      <h3>Prompts above the board</h3><p><span class="seg">${['auto', 'on', 'off'].map(v => `<button class="${ui.hints === v ? 'on' : ''}" data-act="hints" data-v="${v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}</span></p><p class="dim">Auto shows them until you have finished one game on this device.</p>
      <button class="big" data-act="closehelp">Close</button></div></div>`;
  }

  function render() {
    if (ui.st && ui.st.over && !ui.countedOver) gameFinished();     // count the game (and record a campaign result) before drawing the end screen
    const html = { home: homeHTML, pass: passHTML, campaign: campaignHTML, play: gameHTML }[ui.screen]();
    root.innerHTML = html + (ui.help ? helpHTML() : '');
    if (ui.screen === 'home') startDemo(); else stopDemo();
    saveGame();
  }

  window.FossilFrenzyUI = { ui, render, onClick, demo: () => demo, demoStep };    // (the last two are for the tests)
  resumeGame();
  render();
})();
</script>
