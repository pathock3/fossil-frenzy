<style>
:root {
  --bg: #1b130e; --panel: #271a12; --panel2: #32231a; --line: #4a3524;
  --umber: #4a2e1c; --umber-d: #2f1c10; --bone: #f6e7b8; --ink: #2b1b10;
  --text: #f1e6d2; --dim: #a8957a; --accent: #f5a524; --good: #3ecf8e;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; width: 100%; position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Segoe UI, Roboto, sans-serif; touch-action: manipulation; }
#app { position: absolute; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }

/* ---------- game layout ---------- */
.game { height: 100%; display: grid; grid-template-rows: auto auto 1fr; gap: 6px; padding: 8px 10px 10px; }
.bar { display: flex; gap: 8px; align-items: stretch; }
.chips { display: flex; gap: 6px; flex: 1; min-width: 0; }
/* the score is the most important thing outside the board: big, always in view, the current player's lit up */
.chip { flex: 1 1 0; min-width: 0; background: var(--panel); border: 3px solid transparent; border-radius: 14px; padding: 6px 10px 7px; display: flex; flex-direction: column; gap: 0; position: relative; }
.chip.cur { border-color: var(--c); background: var(--panel2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent); }
.chip .nm { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
.chip .pts { font-size: clamp(34px, 7vw, 54px); font-weight: 800; line-height: 1.02; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.chip.cur .pts { color: #fff; }
.chip .pts.bump { animation: bump .55s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.35); color: var(--accent); } 100% { transform: scale(1); } }
.chip .sets { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 58px; margin-top: 6px; }
/* held sets are buttons: big, raised tiles. The ones you can bank right now glow green and carry a "Bank" label. */
.setbtn { min-width: 52px; height: 52px; padding: 0 8px; border-radius: 12px; background: #d8c98f; color: var(--ink); font-weight: 800; font-size: 28px; display: grid; place-items: center; border: 0; opacity: .85; }
.setbtn.act { background: var(--bone); opacity: 1; box-shadow: 0 5px 0 #a89458, 0 0 0 3px var(--good), 0 0 16px rgba(62,207,142,.45); cursor: pointer; animation: ready 1.8s ease-in-out infinite; }
.setbtn.act:active { transform: translateY(4px); box-shadow: 0 1px 0 #a89458, 0 0 0 3px var(--good); animation: none; }
@keyframes ready { 0%, 100% { box-shadow: 0 5px 0 #a89458, 0 0 0 3px var(--good), 0 0 8px rgba(62,207,142,.25); } 50% { box-shadow: 0 5px 0 #a89458, 0 0 0 3px var(--good), 0 0 20px rgba(62,207,142,.7); } }
.bankcap { font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--good); line-height: 1.1; max-width: 4.2em; }
.sys { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.q { width: 44px; height: 44px; border-radius: 12px; background: var(--panel); color: var(--dim); font-weight: 700; font-size: 22px; }
.legend { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--dim); padding: 0 4px; min-height: 18px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.legend .hint { margin-left: auto; color: var(--text); font-size: 14px; text-align: right; }
.main { min-height: 0; display: flex; position: relative; }
.boardwrap { min-height: 0; min-width: 0; display: flex; flex: 1; }
.legend .event { color: var(--accent); font-size: 14px; font-weight: 700; }
svg.board { width: 100%; height: 100%; touch-action: manipulation; }

/* whose turn it is: shown before they start tapping (a tap anywhere on it starts the turn) */
.turncard { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 20px;
  border-radius: 16px; background: rgba(27,19,14,.94); border: 4px solid var(--c); }
.turncard .tc-who { font-size: clamp(34px, 8vw, 60px); font-weight: 800; color: var(--c); line-height: 1.05; }
.turncard .tc-last { font-size: 17px; color: var(--accent); max-width: 30em; }
.turncard .tc-tap { margin-top: 6px; padding: 12px 26px; border-radius: 14px; background: var(--c); color: #14100c; font-weight: 800; font-size: 20px; }

/* menu (system chrome: small and quiet) */
.backdrop { position: absolute; inset: 0; z-index: 4; background: rgba(0,0,0,.45); }
.menu { position: absolute; z-index: 5; top: calc(env(safe-area-inset-top) + 146px); right: max(12px, env(safe-area-inset-right)); width: min(300px, calc(100% - 24px)); background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 10px;
  display: flex; flex-direction: column; gap: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.55); }
.menu button { padding: 14px 16px; border-radius: 12px; background: var(--panel2); text-align: left; font-weight: 700; font-size: 17px; }
.menu button.danger { background: #5a2a1e; }
.menu .mq { margin: 4px 6px 6px; line-height: 1.4; }

/* ---------- board ---------- */
.cell .bg { fill: #2a1d14; stroke: #3d2b1d; stroke-width: 1.5; }
.tile .face { fill: var(--umber); stroke: var(--umber-d); stroke-width: 2.5; }
.tile .spiral { fill: none; stroke: #6d4a30; stroke-width: 2; pointer-events: none; }
.tile.up .face { fill: var(--bone); stroke: #c9ae6a; }
.tile.peek .face { fill: #ead9a8; stroke: #c9ae6a; }          /* my private look: a lighter face, plain solid edge — the only dashes are the coloured peek ring */
.tile .num { fill: var(--ink); font-weight: 800; font-size: 25px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.tile .gem { font-size: 24px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.ring { fill: none; stroke-width: 4.5; pointer-events: none; }
.ring.peekring { stroke-dasharray: 9 6; }
.flipin { animation: flip .32s ease-out; transform-box: fill-box; transform-origin: center; }
/* an opponent peeks: the fossil lifts and tilts as if a corner were being peeked under; the number stays hidden */
.tile.lift { animation: lift .6s ease-in-out; transform-box: fill-box; transform-origin: center; }
@keyframes lift { 0% { transform: none; } 20% { transform: translateY(-5px) rotate(-7deg) scale(1.12); } 45% { transform: translateY(-5px) rotate(7deg) scale(1.12); } 70% { transform: translateY(-5px) rotate(-4deg) scale(1.12); } 100% { transform: none; } }
.ring.pulse { animation: pulse .6s ease-in-out; }
@keyframes pulse { 0%, 100% { opacity: 1; } 30%, 70% { opacity: .25; } }
.eye { font-size: 20px; text-anchor: middle; dominant-baseline: central; pointer-events: none; animation: eye .65s ease-in-out forwards; }
@keyframes eye { 0% { opacity: 0; } 20%, 70% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tile.lift, .ring.pulse, .eye, .chip .pts.bump, .setbtn.act { animation: none; } }
@keyframes flip { 0% { transform: scaleX(.05); } 100% { transform: scaleX(1); } }
.pop { animation: pop .4s ease-out; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }

/* small fossil chips (end screen) */
.mini { min-width: 30px; height: 30px; border-radius: 7px; background: var(--bone); color: var(--ink); font-weight: 800; display: grid; place-items: center; font-size: 15px; padding: 0 3px; }

/* ---------- the one button on the table, and the opponent's bank banner ---------- */
.end { position: absolute; right: 6px; bottom: 6px; z-index: 2; background: var(--panel2); border: 2px solid var(--line); border-radius: 14px; padding: 14px 22px; font-weight: 800; font-size: 18px; opacity: .8; }
.end.go { border-color: var(--accent); background: #4a3418; opacity: 1; box-shadow: 0 0 0 4px rgba(245,165,36,.2); }
.bankcard { position: absolute; z-index: 2; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; color: inherit; cursor: pointer; padding: 18px 30px; border-radius: 20px;
  background: rgba(27,19,14,.92); border: 4px solid var(--c); box-shadow: 0 12px 34px rgba(0,0,0,.6); animation: bankin .35s ease-out; max-width: 92%; }
@keyframes bankin { 0% { transform: translate(-50%, -50%) scale(.6); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
.bankcard .bk-who { font-size: clamp(18px, 3.6vw, 26px); font-weight: 800; color: var(--c); }
.bankcard .bk-pts { font-size: clamp(54px, 11vw, 92px); font-weight: 900; line-height: 1; color: #fff; }
.bankcard .bk-sub { font-size: 16px; color: var(--dim); margin-top: 2px; }
.bankcard .bk-tap { font-size: 13px; color: var(--dim); margin-top: 10px; }
.bankcard:active { filter: brightness(1.15); }
.bankcard .bk-score { font-size: 22px; font-weight: 800; margin-top: 8px; color: var(--accent); }

/* ---------- screens / overlays ---------- */
/* ---------- home screen: one screen, never scrolls ---------- */
.screen.home { background: radial-gradient(ellipse at 30% 25%, #5b3518 0%, #2d1a0d 42%, var(--bg) 78%); overflow: hidden; touch-action: manipulation;
  padding: max(14px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
.sheet.hero { max-width: 1040px; height: 100%; display: grid; gap: 10px; align-items: center; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
@media (min-aspect-ratio: 5/4) { .sheet.hero { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 28px; } }
.hero-art { position: relative; min-height: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.hero-art::before { content: ""; position: absolute; inset: 8% 6%; background: radial-gradient(circle, rgba(245,165,36,.42), rgba(245,165,36,0) 68%); filter: blur(24px); }
.hero-board { position: relative; flex: 1 1 0; min-height: 0; width: 100%; max-width: 620px; filter: drop-shadow(0 18px 24px rgba(0,0,0,.55)); }
.hero-score { position: relative; display: flex; gap: 12px; }
.hero-score .hs { display: flex; align-items: center; gap: 8px; padding: 4px 14px; border-radius: 99px; background: var(--panel); border: 2px solid transparent; font-weight: 800; font-size: 20px; transition: border-color .2s; }
.hero-score .hs.cur { border-color: var(--c); background: var(--panel2); }
.hero-score .hs i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
/* the demo game: tiles flip, rings mark who peeked/flipped, collected tiles vanish — exactly as in a real game */
.h-cell { transform-box: fill-box; transform-origin: center; animation: hin .55s ease-out backwards; animation-delay: calc(var(--i) * 22ms); }
@keyframes hin { 0% { transform: scale(.2) rotate(-25deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.h-cell .bg { fill: #2a1d14; stroke: #3d2b1d; stroke-width: 1.5; }
.h-tile, .h-back, .h-front { transform-box: fill-box; transform-origin: center; }
.h-tile { transition: opacity .55s ease, transform .55s ease; }
.h-cell.gone .h-tile { opacity: 0; transform: scale(.25); }
.h-back { transition: transform .22s ease-in; }
.h-front { transform: scaleX(0); transition: transform .22s ease-out; }
.h-cell.up .h-back { transform: scaleX(0); }
.h-cell.up .h-front { transform: scaleX(1); transition-delay: .22s; }
.h-cell.lift .h-tile { animation: lift .6s ease-in-out; }
.h-back .face { fill: var(--umber); stroke: var(--umber-d); stroke-width: 2.5; }
.h-back .spiral { fill: none; stroke: #6d4a30; stroke-width: 2; }
.h-front .face { fill: var(--bone); stroke: #c9ae6a; stroke-width: 2.5; }
.h-front .num { fill: var(--ink); font-weight: 800; font-size: 25px; text-anchor: middle; dominant-baseline: central; }
.h-front .gem { font-size: 24px; text-anchor: middle; dominant-baseline: central; }
.h-ring { fill: none; stroke-width: 4.5; opacity: 0; pointer-events: none; transition: opacity .15s; }
.h-cell.ringed .h-ring { opacity: 1; }
.h-cell.dash .h-ring { stroke-dasharray: 9 6; }
.h-cell.gone .h-ring { opacity: 0; }
.hero-menu { position: relative; display: flex; flex-direction: column; align-items: stretch; min-height: 0; }
.logo { margin: 0 0 6px; font-size: clamp(40px, min(11vw, 10.5vh), 96px); line-height: .9; font-weight: 900; letter-spacing: -2px; text-align: left;
  background: linear-gradient(180deg, #ffe3a0 10%, #f5a524 55%, #c8650f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 rgba(0,0,0,.4)); animation: logoin .7s ease-out .2s backwards; }
@keyframes logoin { 0% { transform: translateY(14px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.hero-menu .sub { font-size: clamp(14px, 2.2vh, 17px); margin-bottom: 0; }
.hero-menu .mode { margin-top: clamp(8px, 1.6vh, 14px); padding: clamp(10px, 2vh, 18px) 20px; }
.hero-menu .ghost { margin-top: clamp(6px, 1.2vh, 10px); }
.hero-menu .ver { margin: clamp(4px, 1vh, 12px) 0 0; font-size: 12px; }
.hero-menu .back { margin: 0 0 4px; padding: 2px 0; }
.mode.primary { background: linear-gradient(180deg, #f7b13a, #d9791a); border-color: #ffd37e; color: #2b1b10; box-shadow: 0 6px 0 #8a4a0e, 0 14px 24px rgba(0,0,0,.4); }
.mode.primary span { color: #4a2a10; }
.mode.primary:active { box-shadow: 0 2px 0 #8a4a0e; }
.mode .pips { display: flex; gap: 6px; margin-top: 4px; }
.mode .pips i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(43,27,16,.55); }
.mode .pips i.on { background: #2b1b10; border-color: #2b1b10; }
@media (max-height: 520px) { .hero-menu .sub, .hero-menu .mode span:not(.pips) { display: none; } .hero-menu .ver { display: none; } .hero-score { display: none; } }
@media (prefers-reduced-motion: reduce) { .h-cell, .logo { animation: none; } .h-tile, .h-back, .h-front { transition: none; } }

.screen { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 22px 18px 30px; background: radial-gradient(ellipse at 50% 0%, #3a2616, var(--bg) 70%); }
.sheet { max-width: 640px; margin: 0 auto; }
h1 { margin: 0 0 4px; font-size: 38px; letter-spacing: .5px; }
h2 { margin: 18px 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); }
.sub { color: var(--dim); margin: 0 0 14px; }
.back { display: inline-block; margin: -6px 0 8px; padding: 6px 0; color: var(--dim); font-size: 14px; text-decoration: none; background: none; }
.seg { display: inline-flex; background: var(--panel); border-radius: 12px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { padding: 10px 16px; border-radius: 9px; font-weight: 700; color: var(--dim); }
.seg button.on { background: var(--accent); color: #2b1b10; }
.seatrow { display: flex; gap: 10px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
.seatrow .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
.seatrow input { flex: 1 1 130px; min-width: 0; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); color: var(--text); user-select: text; -webkit-user-select: text; }
.big { display: block; width: 100%; margin-top: 22px; padding: 16px; border-radius: 14px; background: var(--accent); color: #2b1b10; font-weight: 800; font-size: 20px; }
.big.alt { background: var(--panel2); color: var(--text); border: 2px solid var(--line); margin-top: 12px; }
.ghost { margin-top: 10px; padding: 12px 16px; border-radius: 12px; background: var(--panel); font-weight: 700; }
.mode { display: flex; flex-direction: column; gap: 4px; width: 100%; margin-top: 14px; padding: 18px 20px; text-align: left; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); box-shadow: 0 5px 0 rgba(0,0,0,.35); }
.mode:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.mode b { font-size: 22px; }
.mode span { color: var(--dim); font-size: 15px; }
.levels { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.lvl { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 18px; text-align: left; border-radius: 14px; background: var(--panel); border: 2px solid var(--line); box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.lvl b { font-size: 21px; }
.lvl .n { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #2b1b10; font-weight: 800; display: grid; place-items: center; flex: none; }
.lvl .state { margin-left: auto; color: var(--dim); font-size: 14px; white-space: nowrap; }
.lvl.done .state { color: var(--good); font-weight: 700; }
.lvl.locked { opacity: .42; box-shadow: none; filter: grayscale(.8); cursor: default; }
.lvl.locked .n { background: var(--line); color: var(--dim); }
.lvl.locked .state { font-size: 22px; }
.help p, .help li { line-height: 1.45; font-size: 15px; }
.help li { margin: 4px 0; }
.help h3 { margin: 18px 0 4px; color: var(--accent); font-size: 16px; }
.table { width: 100%; border-collapse: collapse; margin: 6px 0; }
.table td, .table th { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); font-size: 16px; }
.results { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 6px 0 4px; }
.place { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.place.win { border-color: var(--good); box-shadow: 0 0 0 3px rgba(62,207,142,.22); }
.place .pn { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.place .pn .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
.place .score { font-size: 44px; font-weight: 800; line-height: 1; }
.place .tiles { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.place .bonus { font-size: 13px; font-weight: 800; color: var(--accent); padding: 0 4px; }
.mini.lost { opacity: .35; text-decoration: line-through; }
.dim { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>

<!-- =====================================================================
     DATA BLOCK — every rule, point value, board-setup number and campaign level lives here.
     The logic below (engine / bots / campaign / ui) reads this object and nothing else.
     ===================================================================== -->
<script id="data">
const GAME_DATA = {
  // Where the Tabletop Library's front page is (relative to this file). Shown only when hosted over http(s).
  library: { name: 'Tabletop Library', href: '../../index.html' },

  // Pass & Play: 2-4 people on one device.
  players: { min: 2, max: 4 },
  die: { sides: 6 },            // who goes first (highest roll), and the bank bonus die

  // ---- BOARD ---------------------------------------------------------
  // A hexagon of hex spaces in axial (q, r) coordinates (radius 3 = 37 spaces) with the six corners removed:
  // 31 spaces, one fossil on each. No pieces, no movement.
  board: {
    shape: 'hex',
    radius: 3,
    removed: [[0, -3], [3, -3], [3, 0], [0, 3], [-3, 3], [-3, 0]],
  },

  // ---- FOSSILS (31) ----------------------------------------------------
  tokens: [
    { value: 2,  count: 6 },
    { value: 3,  count: 6 },
    { value: 5,  count: 4 },
    { value: 6,  count: 4 },
    { value: 7,  count: 4 },
    { value: 10, count: 2 },
    { value: 11, count: 2 },
    { value: 16, count: 3, gem: true },   // gems: worth 16, matched as a set of three
  ],
  matching: { pairSize: 2, gemSetSize: 3 },

  // ---- RULES -----------------------------------------------------------
  // A turn is "peek and flip" (first tap = private peek, second tap = public flip) or "bank".
  rules: {
    scoring: {
      setPoints: 'tile-number',   // banking ONE held set scores the number on its fossil (gem 16); a number here = flat points instead
      bonusDieSides: 6,           // then roll a d6: every 6 scores +1 and rolls again (0 = no bonus roll)
      bonusFace: 6,
      bonusPoints: 1,
    },
    tiebreaks: ['score', 'sets', 'finalPair'],   // highest score, then most sets popped, then who popped the final pair
  },

  // ---- CAMPAIGN --------------------------------------------------------
  // You against one opponent per level. Beat a level (win outright) to unlock the next; only the first starts open.
  // memory = chance the opponent remembers each revealed fossil. bankAt / endgameTiles = when it banks: once it holds
  // this many sets, or once this few fossils remain (0 = never plans for the end).
  campaign: {
    levels: [
      { id: 'beginner',    name: 'Beginner',    memory: 0.80,  bankAt: 3, endgameTiles: 0 },
      { id: 'novice',      name: 'Novice',      memory: 0.85,  bankAt: 3, endgameTiles: 2 },
      { id: 'normal',      name: 'Normal',      memory: 0.90,  bankAt: 3, endgameTiles: 6 },
      { id: 'challenging', name: 'Challenging', memory: 0.965, bankAt: 3, endgameTiles: 4 },
      { id: 'master',      name: 'Master',      memory: 0.99,  bankAt: 3, endgameTiles: 4 },
    ],
  },

  // Bot behaviour shared by every opponent: with this few fossils left (and always when only gems remain) a bot
  // will gamble on a third gem even if it has not seen one.
  bots: { gambleTiles: 6 },

  // ---- PACING (presentation only, in milliseconds) ---------------------------------------------------------
  // An opponent's turn is shown one move at a time: its peek appears at once, and the next move follows after this
  // long (each move stays on screen that many ms before the next appears). A tap on the board skips ahead.
  pace: { peek: 650, flip: 600, bank: 0 },

  // The home screen plays a whole demo game by itself (two opponents, over and over). Milliseconds between moves, and
  // how long the empty board waits before the next game starts.
  homeDemo: { peek: 800, flip: 900, bank: 900, endTurn: 1100, restart: 4000 },
};
</script>

<!-- =====================================================================
     ENGINE — pure rules, no DOM.  Reads GAME_DATA (or a copy passed in).
     ===================================================================== -->
<script id="engine">
const Engine = (() => {
  const clone = o => JSON.parse(JSON.stringify(o));

  // Seeded RNG whose position can be saved and restored (so a saved game continues exactly where it stopped).
  function mulberry32(seed) {
    let a = seed >>> 0;
    const next = function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    next.getState = () => a;
    next.setState = v => { a = v >>> 0; };
    return next;
  }

  const rint = (s, n) => Math.floor(s.rng() * n);
  const rollDie = (s, sides) => 1 + rint(s, sides || s.data.die.sides);
  const cur = s => s.players[s.current];
  const fail = msg => { throw new Error('Illegal: ' + msg); };
  const emit = (s, ev) => { for (const o of s.observers) o.onEvent(ev, s); };

  // ---------------- board ----------------
  function buildBoard(data) {
    const R = data.board.radius, removed = new Set(data.board.removed.map(c => c.join(',')));
    const cells = [];
    for (let r = -R; r <= R; r++) {
      for (let q = -R; q <= R; q++) {
        if (Math.abs(q + r) > R || removed.has(q + ',' + r)) continue;
        cells.push({ id: cells.length, q, r });
      }
    }
    return cells;
  }

  // ---------------- creation ----------------
  function createGame(opts = {}) {
    const data = clone(opts.data || GAME_DATA);
    const n = opts.players || 2;
    if (n < data.players.min || n > data.players.max) fail('player count ' + n);
    const rng = opts.rng || (opts.seed !== undefined ? mulberry32(opts.seed) : Math.random);
    const s = { data, rules: data.rules, rng, n, observers: [], over: false, result: null,
                matchedCount: 0, turnNo: 0, lastPopper: -1, lastBank: null };

    s.cells = buildBoard(data);

    // fossils
    let values = [];
    for (const t of data.tokens) {
      const size = t.gem ? data.matching.gemSetSize : data.matching.pairSize;
      if (t.count % size) fail('token count of ' + t.value + ' is not a multiple of its set size');
      for (let i = 0; i < t.count; i++) values.push({ value: t.value, gem: !!t.gem });
    }
    if (values.length !== s.cells.length) fail(values.length + ' tiles for ' + s.cells.length + ' spaces');
    if (opts.layout) {           // deterministic layout for tests: values in cell order
      const pool = values.slice();
      values = opts.layout.map(v => {
        const i = pool.findIndex(p => p.value === v.value && p.gem === !!v.gem);
        if (i < 0) fail('layout does not match tile set');
        return pool.splice(i, 1)[0];
      });
    } else {
      for (let i = values.length - 1; i > 0; i--) {
        const j = rint(s, i + 1); [values[i], values[j]] = [values[j], values[i]];
      }
    }
    s.tokens = values.map((v, i) => ({ id: i, value: v.value, gem: v.gem, cell: s.cells[i].id, matched: false }));
    s.tokenAt = new Array(s.cells.length).fill(-1);
    for (const t of s.tokens) s.tokenAt[t.cell] = t.id;

    s.players = [];
    for (let i = 0; i < n; i++) s.players.push({ idx: i, roll: 0, sets: [], banked: [], points: 0, poppedSets: 0 });

    // who starts: everyone rolls; a duplicate roll is re-rolled by whoever rolled it second; highest goes first
    const used = new Set();
    for (const p of s.players) {
      let r, guard = 0;
      do { r = rollDie(s); } while (used.has(r) && ++guard < 1000);
      used.add(r); p.roll = r;
    }
    s.firstPlayer = s.players.reduce((b, p) => (p.roll > s.players[b].roll ? p.idx : b), 0);
    s.current = s.firstPlayer;
    beginTurn(s);
    return s;
  }

  function beginTurn(s) {
    s.turn = { T: null, F: null, F2: null, revealed: [], peeked: null };
    s.phase = 'action';
    emit(s, { type: 'turn', actor: s.current });
  }

  // ---------------- peek / flip / match ----------------
  const unmatched = (s, id) => id >= 0 && id < s.tokens.length && !s.tokens[id].matched;
  const hiddenOthers = s => s.tokens.filter(t => !t.matched && !s.turn.revealed.includes(t.id) && t.id !== s.turn.T);

  function reveal(s, tid, step) {
    const t = s.tokens[tid];
    s.turn.revealed.push(tid);
    emit(s, { type: 'reveal', actor: s.current, tid, cell: t.cell, value: t.value, gem: t.gem, step });
  }

  // First tap: a private peek at any fossil. It does not use up the turn (you may still bank instead).
  function peek(s, tid) {
    if (s.phase !== 'action') fail('cannot peek now');
    if (!unmatched(s, tid)) fail('cannot peek at ' + tid);
    s.turn.T = tid; s.turn.peeked = tid; s.phase = 'peeked';
    const t = s.tokens[tid];
    emit(s, { type: 'peek', actor: s.current, tid, cell: t.cell, value: t.value, gem: t.gem });
    return t.value;
  }

  // Second tap: a public flip of a different fossil.
  function flipOther(s, tid) {
    if (s.phase !== 'peeked') fail('flip only after peeking');
    if (tid === s.turn.T || !unmatched(s, tid)) fail('cannot flip ' + tid);
    s.turn.F = tid; reveal(s, tid, 'other');
    s.phase = 'flipped';
  }

  function popSet(s, tids) {
    const p = cur(s), toks = tids.map(i => s.tokens[i]);
    for (const t of toks) { t.matched = true; s.tokenAt[t.cell] = -1; }
    p.sets.push({ value: toks[0].value, gem: toks[0].gem, size: toks.length, ids: tids.slice() });
    p.poppedSets++; s.lastPopper = p.idx; s.matchedCount += toks.length;
    s.turn.matched = tids.slice();
    emit(s, { type: 'match', actor: p.idx, tids: tids.slice(), value: toks[0].value, gem: toks[0].gem });
    s.phase = 'resolved';
    if (s.matchedCount === s.tokens.length) finish(s);
  }

  // Reveal the fossil you peeked at. A matching pair is yours. If it and the flipped one are both gems you may
  // go on and flip a third fossil; three gems make a set. Anything else flips back at the end of the turn.
  function flipOwn(s) {
    if (s.phase !== 'flipped') fail('cannot flip the peeked fossil now');
    const T = s.tokens[s.turn.T], F = s.tokens[s.turn.F];
    reveal(s, T.id, 'own');
    if (!T.gem && !F.gem && T.value === F.value) return popSet(s, [T.id, F.id]);
    if (T.gem && F.gem && hiddenOthers(s).length > 0) { s.phase = 'gemThird'; return; }
    s.phase = 'resolved';
  }

  const canFlipOwn = s => s.phase === 'flipped';
  const canFlipSecond = s => s.phase === 'gemThird' && hiddenOthers(s).length > 0;

  function flipSecond(s, tid) {
    if (!canFlipSecond(s)) fail('no third flip available');
    if (!hiddenOthers(s).some(t => t.id === tid)) fail('cannot flip ' + tid);
    s.turn.F2 = tid; reveal(s, tid, 'second');
    if (s.tokens[tid].gem) popSet(s, [s.turn.T, s.turn.F, tid]); else s.phase = 'resolved';
  }

  // ---------------- banking ----------------
  const canBank = s => (s.phase === 'action' || s.phase === 'peeked') && cur(s).sets.length > 0;

  // Bank ONE held set (the player's choice). It scores the number on its fossil, then the bonus d6 chain.
  function bank(s, setIndex = 0) {
    if (!canBank(s)) fail('cannot bank');
    const sc = s.rules.scoring, p = cur(s), set = p.sets[setIndex];
    if (!set) fail('no such set');
    const base = sc.setPoints === 'tile-number' ? set.value : sc.setPoints;
    const rolls = []; let bonus = 0, r;
    if (sc.bonusDieSides) do { r = rollDie(s, sc.bonusDieSides); rolls.push(r); if (r === sc.bonusFace) bonus += sc.bonusPoints; } while (r === sc.bonusFace);
    s.lastBank = { player: p.idx, value: set.value, gem: set.gem, base, rolls, bonus, total: base + bonus, setsLeft: p.sets.length - 1 };
    p.points += base + bonus; p.sets.splice(setIndex, 1);
    p.banked.push({ value: set.value, gem: set.gem, base, bonus });
    s.turn.T = null; s.turn.peeked = null; s.turn.banked = true;
    s.phase = 'resolved';
    emit(s, { type: 'bank', actor: p.idx, info: s.lastBank });
  }

  // ---------------- turn end / game end ----------------
  function endTurn(s) {
    if (s.over) return;
    s.turn.revealed = [];
    s.turnNo++;
    s.current = (s.current + 1) % s.n;
    beginTurn(s);
  }

  function standings(s) {
    return s.players.map(p => ({
      idx: p.idx, score: p.points, sets: p.poppedSets, finalPair: s.lastPopper === p.idx ? 1 : 0, stranded: p.sets.length,
    }));
  }

  function computeResult(s) {
    const keys = s.rules.tiebreaks, st = standings(s);
    const cmp = (a, b) => { for (const k of keys) if (a[k] !== b[k]) return b[k] - a[k]; return 0; };
    const ranking = st.slice().sort(cmp);
    const winners = ranking.filter(r => cmp(r, ranking[0]) === 0).map(r => r.idx);
    return { ranking, winners, standings: st };
  }

  function finish(s) {
    s.over = true; s.phase = 'over';
    s.result = computeResult(s);
    emit(s, { type: 'over', result: s.result });
  }

  // ---------------- save / resume ----------------
  const SAVE_SCHEMA = 2;
  // Identifies the rules a save was made under; a save from different rules (an updated data block) is not resumed.
  function fingerprint(s) {
    const str = JSON.stringify([s.data.board, s.data.tokens, s.data.matching, s.data.die, s.rules]);
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  // A plain-JSON snapshot of a game in progress (works at any moment, including mid-turn).
  function serialize(s) {
    if (!s.rng.getState) throw new Error('this game uses an RNG that cannot be saved');
    if (s.over) throw new Error('a finished game is not saved');
    return JSON.parse(JSON.stringify({
      schema: SAVE_SCHEMA, fingerprint: fingerprint(s), n: s.n,
      tokens: s.tokens, tokenAt: s.tokenAt, players: s.players, current: s.current, phase: s.phase, turn: s.turn,
      turnNo: s.turnNo, matchedCount: s.matchedCount, lastPopper: s.lastPopper, lastBank: s.lastBank,
      firstPlayer: s.firstPlayer, rngState: s.rng.getState(),
    }));
  }

  // Rebuilds a game from serialize(); throws if the save is from another schema or other rules.
  function restore(saved, opts = {}) {
    if (!saved || saved.schema !== SAVE_SCHEMA) throw new Error('unknown save format');
    const s = createGame({ data: opts.data, players: saved.n, seed: 1 });
    if (fingerprint(s) !== saved.fingerprint) throw new Error('the rules changed since this game was saved');
    if (saved.tokens.length !== s.tokens.length || saved.players.length !== s.n) throw new Error('save does not match the game');
    for (const k of ['tokens', 'tokenAt', 'players', 'current', 'phase', 'turn', 'turnNo', 'matchedCount', 'lastPopper', 'lastBank', 'firstPlayer']) s[k] = saved[k];
    s.rng.setState(saved.rngState);
    return s;
  }

  // ---------------- views / dispatch ----------------
  function status(s) {
    return {
      phase: s.phase,
      canPeek: s.phase === 'action' && s.tokens.some(t => !t.matched),
      canBank: canBank(s),
      canFlipOwn: canFlipOwn(s),
      canFlipSecond: canFlipSecond(s),
      canEnd: !s.over,
    };
  }

  // What a player at the table may legitimately know: no face-down fossil values.
  function publicView(s, idx) {
    const seen = new Map();
    for (const tid of s.turn.revealed) seen.set(tid, s.tokens[tid].value);
    return {
      n: s.n, me: idx, current: s.current, phase: s.phase, over: s.over, rules: s.rules, die: s.data.die, turnNo: s.turnNo,
      setPair: s.data.matching.pairSize, setGem: s.data.matching.gemSetSize,
      cells: s.cells,
      tokens: s.tokens.map(t => ({ id: t.id, cell: t.cell, matched: t.matched })),
      tokensLeft: s.tokens.length - s.matchedCount,
      revealed: s.turn.revealed.map(tid => ({ tid, value: seen.get(tid), gem: s.tokens[tid].gem })),
      T: s.turn.T,
      F: s.turn.F,
      peeked: idx === s.current && s.turn.peeked !== null ? { tid: s.turn.peeked, value: s.tokens[s.turn.peeked].value, gem: s.tokens[s.turn.peeked].gem } : null,
      players: s.players.map(p => ({ idx: p.idx, sets: p.sets.map(x => ({ value: x.value, gem: x.gem, size: x.size })), points: p.points })),
      status: idx === s.current ? status(s) : null,
    };
  }

  function apply(s, a) {
    switch (a.type) {
      case 'peek': return peek(s, a.tid);
      case 'flipOther': return flipOther(s, a.tid);
      case 'flipSecond': return flipSecond(s, a.tid);
      case 'flipOwn': return flipOwn(s);
      case 'bank': return bank(s, a.set);
      case 'endTurn': return endTurn(s);
      default: fail('unknown action ' + a.type);
    }
  }

  return { createGame, buildBoard, peek, flipOther, flipSecond, flipOwn, canFlipSecond, canFlipOwn, bank, canBank, endTurn,
           status, standings, computeResult, publicView, apply, serialize, restore, mulberry32 };
})();
</script>

<script id="bots">
/* =====================================================================
   BOTS — adjustable memory.  A bot remembers each revealed fossil (a public flip by
   anybody, or its own peek) with probability `memory`, independently per fossil, and
   never forgets it afterwards.  A bot never sees a hidden fossil: it decides from
   Engine.publicView() plus what it remembers.
   ===================================================================== */
const Bots = (() => {
  function create(opts) {
    const bot = {
      seat: opts.seat,
      memory: opts.memory === undefined ? 0.9 : opts.memory,
      rng: opts.rng || Math.random,
      bankAt: opts.bankAt === undefined ? 1 : opts.bankAt,                      // bank (one set per turn) once holding this many sets...
      endgameTiles: opts.endgameTiles === undefined ? 6 : opts.endgameTiles,   // ...or once this few fossils remain (0 = never plans for the end)
      gambleTiles: opts.gambleTiles === undefined ? GAME_DATA.bots.gambleTiles : opts.gambleTiles,
      mem: new Map(),          // tid -> {value, gem}: long-term memory
      turnKnown: new Map(),    // tid -> {value, gem}: what it saw this turn (always exact)
    };
    const pick = arr => arr[Math.floor(bot.rng() * arr.length)];
    const remember = (tid, value, gem) => { if (bot.rng() < bot.memory) bot.mem.set(tid, { value, gem }); };

    bot.onEvent = ev => {
      if (ev.type === 'turn') {
        if (ev.actor === bot.seat) bot.turnKnown.clear();
      } else if (ev.type === 'reveal') {            // public flip by anybody
        remember(ev.tid, ev.value, ev.gem);
        if (ev.actor === bot.seat) bot.turnKnown.set(ev.tid, { value: ev.value, gem: ev.gem });
      } else if (ev.type === 'peek') {
        if (ev.actor !== bot.seat) return;           // other players' peeks are private
        bot.turnKnown.set(ev.tid, { value: ev.value, gem: ev.gem });
        remember(ev.tid, ev.value, ev.gem);
      } else if (ev.type === 'match') {
        for (const t of ev.tids) { bot.mem.delete(t); bot.turnKnown.delete(t); }
      }
    };

    const known = tid => bot.turnKnown.get(tid) || bot.mem.get(tid) || null;

    // known, unmatched fossils equal to (value, gem), other than `except`
    function twins(v, value, gem, except) {
      const out = [];
      for (const t of v.tokens) {
        if (t.matched || t.id === except) continue;
        const k = known(t.id);
        if (k && k.value === value && k.gem === gem) out.push(t.id);
      }
      return out;
    }
    const others = (v, gem) => (gem ? v.setGem : v.setPair) - 1;      // how many partners a fossil needs
    const located = (v, tid) => { const k = known(tid); return !!k && twins(v, k.value, k.gem, tid).length >= others(v, k.gem); };
    const unknownTiles = (v, except) => v.tokens.filter(t => !t.matched && !known(t.id) && !except.includes(t.id)).map(t => t.id);
    const anyTiles = (v, except) => v.tokens.filter(t => !t.matched && !except.includes(t.id)).map(t => t.id);
    const revealed = (v, tid) => v.revealed.find(r => r.tid === tid);
    const bestSet = me => { let b = 0; me.sets.forEach((x, i) => { if (x.value > me.sets[b].value) b = i; }); return b; };

    function chooseAction(v) {
      const st = v.status, me = v.players[v.me];
      if (st.canBank && (me.sets.length >= bot.bankAt || v.tokensLeft <= bot.endgameTiles)) return { type: 'bank', set: bestSet(me) };
      const sure = v.tokens.find(t => !t.matched && located(v, t.id));
      if (sure) return { type: 'peek', tid: sure.id };
      const unk = unknownTiles(v, []);
      if (unk.length) return { type: 'peek', tid: pick(unk) };
      const any = anyTiles(v, []);
      return any.length ? { type: 'peek', tid: pick(any) } : { type: 'endTurn' };
    }

    function chooseFlip(v) {                              // after a peek: the public flip
      const T = v.peeked, tw = twins(v, T.value, T.gem, T.tid);
      if (tw.length) return { type: 'flipOther', tid: tw[0] };
      const unk = unknownTiles(v, [T.tid]);
      return { type: 'flipOther', tid: pick(unk.length ? unk : anyTiles(v, [T.tid])) };
    }

    const thirdGem = v => twins(v, v.peeked.value, true, v.peeked.tid).filter(t => t !== v.F);

    function afterFlip(v) {
      const T = v.peeked, F = revealed(v, v.F);
      if (!T.gem && !F.gem && T.value === F.value) return { type: 'flipOwn' };
      if (T.gem && F.gem) {
        // reveal my gem only if the third is located — or late in the game, when gambling is all that is left
        // (always when only the gems remain, so a game can never stall)
        if (thirdGem(v).length || v.tokensLeft <= Math.max(bot.gambleTiles, v.setGem)) return { type: 'flipOwn' };
      }
      return { type: 'endTurn' };
    }

    function chooseThird(v) {
      const third = thirdGem(v);
      const cand = third.length ? third : unknownTiles(v, [v.peeked.tid, v.F]);
      return cand.length ? { type: 'flipSecond', tid: third.length ? third[0] : pick(cand) } : { type: 'endTurn' };
    }

    // What a bot needs to carry on after a reload: its memory and where its random numbers stand.
    bot.save = () => ({ seat: bot.seat, memory: bot.memory, bankAt: bot.bankAt, endgameTiles: bot.endgameTiles, gambleTiles: bot.gambleTiles,
                        mem: [...bot.mem], turnKnown: [...bot.turnKnown], rngState: bot.rng.getState ? bot.rng.getState() : null });

    bot.decide = v => {
      switch (v.phase) {
        case 'action': return chooseAction(v);
        case 'peeked': return chooseFlip(v);
        case 'flipped': return afterFlip(v);
        case 'gemThird': return chooseThird(v);
        case 'resolved': return { type: 'endTurn' };
        default: return null;
      }
    };
    return bot;
  }

  // One bot per seat spec ({memory, bankAt?, endgameTiles?}); null = human seat. Subscribes them to the game.
  function attach(state, specs, seed) {
    const rng0 = Engine.mulberry32((seed || 1) * 7919 + 13);
    return specs.map((sp, seat) => {
      if (!sp) return null;
      const b = create({ seat, memory: sp.memory, bankAt: sp.bankAt, endgameTiles: sp.endgameTiles, gambleTiles: sp.gambleTiles,
                         rng: Engine.mulberry32(Math.floor(rng0() * 4294967296)) });
      state.observers.push(b);
      return b;
    });
  }

  // Rebuild the bots from their saved form and subscribe them to a restored game (null = human seat).
  function restore(state, saved) {
    return saved.map(sv => {
      if (!sv) return null;
      const b = create({ seat: sv.seat, memory: sv.memory, bankAt: sv.bankAt, endgameTiles: sv.endgameTiles, gambleTiles: sv.gambleTiles, rng: Engine.mulberry32(1) });
      b.mem = new Map(sv.mem); b.turnKnown = new Map(sv.turnKnown);
      if (sv.rngState !== null) b.rng.setState(sv.rngState);
      state.observers.push(b);
      return b;
    });
  }

  function step(state, bot) {
    const a = bot.decide(Engine.publicView(state, bot.seat));
    if (a) Engine.apply(state, a);
    return a;
  }

  // Play a bot-only game to the end; false if the safety cap was hit.
  function playGame(state, bots, maxActions = 200000) {
    for (let n = 0; !state.over; n++) {
      if (n > maxActions) return false;
      step(state, bots[state.current]);
    }
    return true;
  }

  return { create, attach, restore, step, playGame };
})();
</script>

<!-- =====================================================================
     CAMPAIGN — pure unlock logic (no DOM, no storage).  The UI keeps the list of beaten levels.
     ===================================================================== -->
<script id="campaign">
const Campaign = (() => {
  const levels = () => GAME_DATA.campaign.levels;

  // A level is open if it is the first, or the one before it has been beaten.
  const isUnlocked = (i, beaten) => i === 0 || beaten.includes(levels()[i - 1].id);
  const isBeaten = (i, beaten) => beaten.includes(levels()[i].id);

  // "Defeat" a level = win the game outright. A shared win (every tie-break level) is not a defeat.
  const humanWon = (result, seat = 0) => result.winners.length === 1 && result.winners[0] === seat;

  // The bot spec for a level (see Bots.attach).
  const botSpec = level => ({ memory: level.memory, bankAt: level.bankAt, endgameTiles: level.endgameTiles });

  // After a finished game at level i: the new list of beaten levels, and what changed.
  function recordResult(beaten, i, won) {
    const lv = levels();
    const next = won && !beaten.includes(lv[i].id) ? [...beaten, lv[i].id] : beaten.slice();
    const unlocked = won && i + 1 < lv.length && !beaten.includes(lv[i].id) && !isUnlocked(i + 1, beaten) ? lv[i + 1].name : null;
    return { beaten: next, won, newlyUnlocked: unlocked, completed: next.length === lv.length && beaten.length < lv.length };
  }

  return { levels, isUnlocked, isBeaten, humanWon, botSpec, recordResult };
})();
</script>

<script id="ui">
/* =====================================================================
   UI — a table for touch.  The table is the UI: tap fossils and sets.
   Nothing advances on a timer; an opponent's turn stays on the board until you tap.
   ===================================================================== */
(() => {
  'use strict';
  const D = GAME_DATA, LV = D.campaign.levels;
  const COLORS = ['#4f8cff', '#ff5a5f', '#3ecf8e', '#f5a524'];
  const root = document.getElementById('app');
  // Which build is this? tools/build.js stamps the commit/branch; an unbuilt file says so.
  const BUILD = (() => { const m = document.querySelector('meta[name=build]'); const v = m ? m.content : ''; return !v || v.startsWith('__') ? 'local file' : v; })();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // ?unlock opens every campaign level for this visit (for testing; nothing is saved).
  const UNLOCK_ALL = /[?&]unlock\b/.test(location.search);

  // ---------------- remembered between visits (if the browser allows) ----------------
  // Everything this game stores lives under the Tabletop Library's name, then the game's.
  const NS = 'tabletop-library-fossil-frenzy-';
  const PASS_KEY = NS + 'passplay', CAMPAIGN_KEY = NS + 'campaign', SAVE_KEY = NS + 'save';
  const HINTS_KEY = NS + 'hints', DONE_KEY = NS + 'games-finished';
  const LEGACY_KEYS = ['fossil-frenzy-setup-v1', 'fossil-frenzy-passplay-v2', 'fossil-frenzy-campaign-v1', 'fossil-frenzy-save-v1', 'fossil-frenzy-save-v2', 'fossil-frenzy-hints', 'fossil-frenzy-games-finished'];
  const pref = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) { /* storage unavailable: fine */ } },
    del: k => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
    json: k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  };
  LEGACY_KEYS.forEach(pref.del);                       // data stored under the app's earlier name is discarded

  function loadPass() {
    const cfg = { n: D.players.min, names: Array.from({ length: D.players.max }, (_, i) => 'Player ' + (i + 1)) };
    const s = pref.json(PASS_KEY);
    if (s && s.n >= D.players.min && s.n <= D.players.max) {
      cfg.n = s.n;
      (s.names || []).forEach((x, i) => { if (i < D.players.max && x) cfg.names[i] = String(x).slice(0, 14); });
    }
    return cfg;
  }
  function loadBeaten() {
    const b = pref.json(CAMPAIGN_KEY);
    const ids = new Set(LV.map(l => l.id));
    return Array.isArray(b && b.beaten) ? b.beaten.filter(id => ids.has(id)) : [];
  }

  const ui = { screen: 'home', mode: 'pass', pass: loadPass(), beaten: loadBeaten(), levelIdx: 0, names: [], st: null, bots: [],
               showPeek: true, help: false, menu: null, prevUp: new Set(), popTurn: -1, botWaiting: false, notice: '',
               countedOver: false, outcome: null, turnCard: false, lastEvent: '',
               steps: null, stage: 0, base: null, animTimer: null, liftKey: '', prevPts: null };
  ui.hints = ['auto', 'on', 'off'].includes(pref.get(HINTS_KEY)) ? pref.get(HINTS_KEY) : 'auto';
  // Prompts above the board: shown until this device has finished one game, then quiet. Help panel: Auto / On / Off.
  const hintsVisible = () => ui.hints === 'on' || (ui.hints === 'auto' && !(+pref.get(DONE_KEY) > 0));
  const seatName = i => ui.names[i] || 'Player ' + (i + 1);
  const isBot = i => !!ui.bots[i];
  const unlocked = i => UNLOCK_ALL || Campaign.isUnlocked(i, ui.beaten);

  // ---------------- game flow ----------------
  // Who goes first is simply decided at random (the engine's opening roll) — no screen for it. The turn card says whose turn it is.
  function startGame() {
    clearAnim();
    const seed = Math.floor(Math.random() * 2147483647), campaign = ui.mode === 'campaign';
    const n = campaign ? 2 : ui.pass.n;
    ui.st = Engine.createGame({ players: n, seed });
    ui.bots = Bots.attach(ui.st, campaign ? [null, Campaign.botSpec(LV[ui.levelIdx])] : Array(n).fill(null), seed);
    ui.names = campaign ? ['You', LV[ui.levelIdx].name] : ui.pass.names.slice(0, n);
    Object.assign(ui, { screen: 'play', showPeek: true, prevUp: new Set(), popTurn: -1, botWaiting: false, notice: '', countedOver: false, outcome: null,
                        menu: null, help: false, lastEvent: '', prevPts: null, liftKey: '' });
    nextTurnStarts(true);
  }
  function beginTurn() {
    ui.turnCard = false; ui.lastEvent = '';
    if (animating()) startAnim();
  }

  // Is an opponent's turn still being shown one move at a time?
  const animating = () => !!ui.steps && ui.stage < ui.steps.length;
  const reducedMotion = () => typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function clearAnim() { if (ui.animTimer) clearTimeout(ui.animTimer); ui.animTimer = null; }
  function stepMs(a) { const P = D.pace; return a.type === 'peek' ? P.peek : a.type === 'bank' ? P.bank : P.flip; }
  function startAnim() {
    clearAnim();
    if (!animating()) return;
    if (reducedMotion()) { finishAnim(false); return; }
    if (ui.stage === 0) ui.stage = 1;                          // its peek shows at once
    if (!animating()) return;
    ui.animTimer = setTimeout(() => { ui.animTimer = null; ui.stage++; render(); startAnim(); }, stepMs(ui.steps[ui.stage - 1].a));
  }
  function finishAnim(redraw = true) { clearAnim(); if (ui.steps) ui.stage = ui.steps.length; if (redraw) render(); }

  // Called whenever a turn begins. An opponent decides its whole turn at once, but it is SHOWN one move at a time
  // (peek, then flip, ...), and then waits for a tap.
  function nextTurnStarts(first = false) {
    const st = ui.st;
    clearAnim();
    Object.assign(ui, { showPeek: true, botWaiting: false, steps: null, stage: 0, base: null });
    const bot = ui.bots[st.current];
    ui.turnCard = first || (!bot && ui.mode === 'pass');          // pass & play: say whose turn it is before they tap
    if (!bot) return;
    const seat = st.current, snap = () => ({ points: st.players[seat].points, sets: st.players[seat].sets.map(x => ({ ...x })) });
    ui.base = snap(); ui.steps = [];
    for (let guard = 0; guard < 200 && !st.over; guard++) {
      const a = bot.decide(Engine.publicView(st, bot.seat));
      if (!a || a.type === 'endTurn') break;
      Engine.apply(st, a);
      ui.steps.push({ a, snap: snap() });
    }
    ui.botWaiting = !st.over;
    if (!ui.turnCard) startAnim();
  }
  const bankText = b => `${b.gem ? 'a gem' : 'a ' + b.value}: +${b.base}` + (b.rolls.length ? (b.bonus ? `, +${b.bonus} bonus (rolled ${b.rolls.join(', ')})` : `, no bonus (rolled ${b.rolls[0]})`) : '');

  function endTurn() {
    const st = ui.st;
    if (st.over) return;
    Engine.endTurn(st);
    nextTurnStarts();
  }

  // When a game ends: count it, and in the campaign record whether the level was beaten.
  function gameFinished() {
    ui.countedOver = true;
    pref.set(DONE_KEY, (+pref.get(DONE_KEY) || 0) + 1);
    if (ui.mode !== 'campaign') return;
    const won = Campaign.humanWon(ui.st.result, 0);
    ui.outcome = Campaign.recordResult(ui.beaten, ui.levelIdx, won);
    ui.beaten = ui.outcome.beaten;
    pref.set(CAMPAIGN_KEY, JSON.stringify({ beaten: ui.beaten }));
  }

  // ---------------- save / resume: a game in progress survives a reload (or iPad Safari discarding the tab) ----------------
  function saveGame() {
    try {
      if (!ui.st || ui.screen !== 'play' || ui.st.over) { pref.del(SAVE_KEY); return; }
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        schema: 2, build: BUILD, screen: ui.screen, turnCard: ui.turnCard, botWaiting: ui.botWaiting, mode: ui.mode, levelIdx: ui.levelIdx, names: ui.names,
        game: Engine.serialize(ui.st), bots: ui.bots.map(b => (b ? b.save() : null)),
      }));
    } catch (e) { /* storage unavailable or full: the game still plays, it just cannot be resumed */ }
  }
  function resumeGame() {
    const sv = pref.json(SAVE_KEY);
    if (!sv) { if (pref.get(SAVE_KEY) !== null) { pref.del(SAVE_KEY); ui.notice = 'Your saved game could not be resumed, so it was cleared.'; } return; }
    try {
      const st = Engine.restore(sv.game);
      if (sv.mode === 'campaign' && !LV[sv.levelIdx]) throw new Error('unknown level');
      ui.st = st; ui.bots = Bots.restore(st, sv.bots); ui.names = sv.names; ui.mode = sv.mode === 'campaign' ? 'campaign' : 'pass'; ui.levelIdx = sv.levelIdx | 0;
      Object.assign(ui, { screen: 'play', turnCard: !!sv.turnCard || sv.screen === 'roll', botWaiting: !!sv.botWaiting,
                          showPeek: true, prevUp: new Set(), popTurn: st.turn.matched ? st.turnNo : -1, steps: null, stage: 0, base: null, lastEvent: '', menu: null });
    } catch (e) {
      pref.del(SAVE_KEY);
      ui.notice = /rules changed/.test(e.message) ? 'A new version changed the rules, so your saved game was cleared.' : 'Your saved game could not be resumed, so it was cleared.';
    }
  }

  // ---------------- taps ----------------
  // An opponent's finished turn stays on the board until I act. My first tap on a fossil (or a set) ends it and is the
  // start of my own turn — there is no Continue.
  function takeOverFromOpponent() {
    if (!ui.botWaiting) return;
    endTurn();
  }

  function cellTap(id) {
    const st = ui.st;
    if (animating()) { finishAnim(); return; }                                      // a tap skips ahead through an opponent's moves
    if (st.over || ui.turnCard) return;
    takeOverFromOpponent();
    if (st.over || ui.botWaiting || isBot(st.current)) { render(); return; }
    ui.lastEvent = '';
    const tid = st.tokenAt[id];
    try {
      if (st.phase === 'action') {
        if (tid >= 0) { Engine.peek(st, tid); ui.showPeek = true; }                 // first tap: a private peek
      } else if (st.phase === 'peeked') {
        if (tid === st.turn.T) ui.showPeek = !ui.showPeek;
        else if (tid >= 0) {
          Engine.flipOther(st, tid);                                                // second tap: a public flip
          const T = st.tokens[st.turn.T], F = st.tokens[st.turn.F];
          if (!T.gem && !F.gem && T.value === F.value) Engine.flipOwn(st);          // a pair: you always take it
        }
      } else if (st.phase === 'flipped') {
        const T = st.tokens[st.turn.T], F = st.tokens[st.turn.F];
        if (tid === st.turn.T) ui.showPeek = !ui.showPeek;
        else if (tid >= 0 && tid !== st.turn.F && T.gem && F.gem) {                 // two gems: tapping a third IS the consent to reveal mine
          Engine.flipOwn(st);
          if (Engine.canFlipSecond(st)) Engine.flipSecond(st, tid);
        }
      } else if (st.phase === 'gemThird') {
        if (tid >= 0 && tid !== st.turn.T && tid !== st.turn.F) Engine.flipSecond(st, tid);
      } else if (st.phase === 'resolved') {
        if (tid === st.turn.T) ui.showPeek = !ui.showPeek;
      }
    } catch (e) { console.warn(e.message); }
    render();
  }

  // Tapping a held set banks it — and banking is the whole turn, so the turn ends at once.
  function setTap(i) {
    const st = ui.st;
    if (animating()) { finishAnim(); return; }
    if (st.over || ui.turnCard) return;
    takeOverFromOpponent();
    if (st.over || ui.botWaiting || isBot(st.current)) { render(); return; }
    try {
      if (Engine.canBank(st)) { Engine.bank(st, i); ui.lastEvent = `${seatName(st.current)} banked ${bankText(st.lastBank)}`; endTurn(); }
    } catch (e) { console.warn(e.message); }
    render();
  }

  // While the opponent's bank banner is up, a tap anywhere (not just on the banner) sends it away and starts my turn.
  const bankBannerUp = () => ui.screen === 'play' && !!ui.st && ui.botWaiting && !animating() && !ui.turnCard && !ui.st.over && !!ui.st.turn.banked && !!ui.st.lastBank;
  function onClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el) { if (bankBannerUp() && !ui.menu && !ui.help) { takeOverFromOpponent(); render(); } return; }
    const d = el.dataset, st = ui.st;
    switch (d.act) {
      case 'mode': ui.screen = d.v; ui.mode = d.v === 'campaign' ? 'campaign' : 'pass'; break;
      case 'home': ui.screen = 'home'; break;
      case 'n': ui.pass.n = +d.v; pref.set(PASS_KEY, JSON.stringify(ui.pass)); break;
      case 'deal': ui.mode = 'pass'; startGame(); break;
      case 'level': if (unlocked(+d.i)) { ui.mode = 'campaign'; ui.levelIdx = +d.i; startGame(); } break;
      case 'next': ui.levelIdx = Math.min(ui.levelIdx + 1, LV.length - 1); startGame(); break;
      case 'begin': beginTurn(); break;
      case 'dismissbank': takeOverFromOpponent(); break;
      case 'cell': return cellTap(+d.id);
      case 'set': return setTap(+d.i);
      case 'end':
        if (animating()) { finishAnim(); return; }
        if (st.over || ui.turnCard) break;
        if (ui.botWaiting || Engine.status(st).canEnd) endTurn();
        break;
      case 'hints': ui.hints = d.v; pref.set(HINTS_KEY, d.v); break;
      case 'help': ui.help = true; ui.menu = null; break;
      case 'closehelp': ui.help = false; break;
      // the in-game menu: rules, retry, back to the start. Retry and quit ask first; retry deals a fresh game at once, same setup.
      case 'menu': ui.menu = ui.menu ? null : 'open'; break;
      case 'menu-close': ui.menu = null; break;
      case 'menu-ask': ui.menu = d.v; break;
      case 'retry': startGame(); break;
      case 'quit': clearAnim(); ui.menu = null; ui.help = false; ui.screen = 'home'; break;
      case 'again': startGame(); break;
      default: return;
    }
    render();
  }
  root.addEventListener('click', onClick);
  root.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset && el.dataset.act === 'name') { ui.pass.names[+el.dataset.i] = el.value.slice(0, 14); pref.set(PASS_KEY, JSON.stringify(ui.pass)); }
  });

  // ---------------- rendering ----------------
  const hexPts = (cx, cy, r) => Array.from({ length: 6 }, (_, i) => { const a = (Math.PI / 180) * (60 * i - 30); return (cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1); }).join(' ');
  const setLabel = s => (s.gem ? '💎' : s.value);

  function boardSVG() {
    const st = ui.st, S = 34, W = Math.sqrt(3) * S, color = COLORS[st.current];
    const pos = c => ({ x: W * (c.q + c.r / 2), y: 1.5 * S * c.r });
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const c of st.cells) { const p = pos(c); x0 = Math.min(x0, p.x - W / 2); x1 = Math.max(x1, p.x + W / 2); y0 = Math.min(y0, p.y - S); y1 = Math.max(y1, p.y + S); }
    const human = !isBot(st.current) && !ui.botWaiting;
    let revealed = new Set(st.turn.revealed), peekTid = st.turn.peeked, lift = false;
    if (animating()) {                       // an opponent's turn, shown one move at a time: rebuild what is on the table so far
      revealed = new Set(); peekTid = null;
      for (let k = 0; k < ui.stage; k++) {
        const a = ui.steps[k].a;
        if (a.type === 'peek') peekTid = a.tid;
        else if (a.type === 'flipOwn') revealed.add(peekTid);
        else if (a.type === 'flipOther' || a.type === 'flipSecond') revealed.add(a.tid);
      }
      const key = st.turnNo + ':' + ui.stage;
      lift = ui.stage > 0 && ui.steps[ui.stage - 1].a.type === 'peek' && ui.liftKey !== key;
      ui.liftKey = key;
    }
    const peekShown = peekTid !== null && human && ui.showPeek;
    const nowUp = new Set([...revealed, ...(peekShown ? [peekTid] : [])]);
    const flipped = tid => nowUp.has(tid) !== ui.prevUp.has(tid);
    let out = '';
    for (const c of st.cells) {
      const { x, y } = pos(c);
      let tid = st.tokenAt[c.id];
      if (tid < 0) { const m = (st.turn.matched || []).find(i => st.tokens[i].cell === c.id); if (m !== undefined) tid = m; }   // a match stays face up until the turn ends
      let g = `<g class="cell" data-act="cell" data-id="${c.id}"><polygon class="bg" points="${hexPts(x, y, S)}"/>`;
      if (tid >= 0) {
        const t = st.tokens[tid], up = revealed.has(tid), peeking = peekShown && tid === peekTid;
        const shown = up || peeking;
        const lifting = lift && tid === peekTid;
        g += `<g class="tile${up ? ' up' : ''}${peeking ? ' peek' : ''}${flipped(tid) ? ' flipin' : ''}${lifting ? ' lift' : ''}">`;
        g += `<polygon class="face" points="${hexPts(x, y, S * 0.8)}"/>`;
        if (shown) g += t.gem ? `<text class="gem" x="${x}" y="${y + 1}">💎</text>` : `<text class="num" x="${x}" y="${y + 1}">${t.value}</text>`;
        else g += `<circle class="spiral" cx="${x}" cy="${y}" r="${S * 0.3}"/><circle class="spiral" cx="${x}" cy="${y}" r="${S * 0.13}"/>`;
        g += '</g>';
        if (up) g += `<polygon class="ring" style="stroke:${color}" points="${hexPts(x, y, S * 0.9)}"/>`;
        else if (tid === peekTid) g += `<polygon class="ring peekring${lifting ? ' pulse' : ''}" style="stroke:${color}" points="${hexPts(x, y, S * 0.9)}"/>` + (lifting ? `<text class="eye" x="${x}" y="${y - S * 0.95}">👁</text>` : '');   // peeked: dashed, number hidden
      }
      out += g + '</g>';
    }
    ui.prevUp = nowUp;
    const pad = 4;
    return `<svg class="board" viewBox="${(x0 - pad).toFixed(1)} ${(y0 - pad).toFixed(1)} ${(x1 - x0 + 2 * pad).toFixed(1)} ${(y1 - y0 + 2 * pad).toFixed(1)}" preserveAspectRatio="xMidYMid meet">${out}</svg>`;
  }

  // What a player has so far. While an opponent's turn is being shown move by move, its points and sets lag behind the engine.
  const shownOf = p => (animating() && p.idx === ui.st.current ? (ui.stage > 0 ? ui.steps[ui.stage - 1].snap : ui.base) : p);

  // Who acts next: whoever's turn it is — or, while an opponent's finished turn is still on the board, the player after it.
  const actor = () => (ui.botWaiting ? (ui.st.current + 1) % ui.st.n : ui.st.current);

  // The scoreboard: everyone's points, big, and everyone's held sets under them. The sets of the player about to act are the
  // ones you tap to bank — the only place sets are shown.
  function chipsHTML() {
    const st = ui.st, was = ui.prevPts, now = {};
    const who = actor();
    const tappable = !animating() && !ui.turnCard && !st.over && !isBot(who) && (ui.botWaiting || Engine.canBank(st));
    const html = st.players.map(p => {
      const v = shownOf(p);
      now[p.idx] = v.points;
      const bump = was && was[p.idx] !== undefined && was[p.idx] !== v.points;
      const matchedShown = p.idx === st.current && !!st.turn.matched && (!animating() || v.sets.length > ui.base.sets.length);
      const bankable = tappable && p.idx === who && v.sets.length > 0;
      const sets = (bankable ? '<span class="bankcap">Tap to bank</span>' : '') + v.sets.map((x, i) => {
        const pop = ui.popTurn !== st.turnNo && matchedShown && i === v.sets.length - 1 ? ' pop' : '';
        return tappable && p.idx === who ? `<button class="setbtn act${pop}" data-act="set" data-i="${i}" aria-label="Bank this set">${setLabel(x)}</button>` : `<span class="setbtn${pop}">${setLabel(x)}</span>`;
      }).join('');
      if (p.idx === st.current && matchedShown) ui.popTurn = st.turnNo;
      return `<div class="chip${p.idx === st.current ? ' cur' : ''}" style="--c:${COLORS[p.idx]}"><div class="nm"><span class="dot"></span>${esc(seatName(p.idx))}${isBot(p.idx) ? ' 🤖' : ''}</div><div class="pts${bump ? ' bump' : ''}" aria-label="${v.points} points">${v.points}</div><div class="sets">${sets}</div></div>`;
    }).join('');
    ui.prevPts = now;
    return html;
  }

  function hint() {
    const st = ui.st;
    if (st.over && !animating()) return '';
    if (animating()) {
      const name = seatName(st.current), k = ui.stage > 0 ? ui.steps[ui.stage - 1].a.type : null;
      return { null: '', peek: `${name} peeks at a fossil (the number stays hidden).`, flipOther: `${name} flips another fossil.`,
               flipOwn: `${name} flips the fossil it peeked at.`, flipSecond: `${name} flips a third fossil.`, bank: `${name} banks a set.` }[k] || '';
    }
    if (ui.botWaiting) {
      const t = st.turn;
      if (t.banked) return 'Tap a fossil to start your turn.';
      return t.peeked !== null ? 'It peeked at the dashed ring and flipped the other. Tap a fossil to start your turn.' : 'Tap a fossil to start your turn.';
    }
    if (ui.turnCard) return '';
    const s = Engine.status(st);
    switch (st.phase) {
      case 'action': return s.canBank ? 'Tap a fossil to peek — or tap one of your sets at the top to bank it (that ends your turn).' : 'Tap a fossil to peek.';
      case 'peeked': return 'Tap another fossil to flip it — or tap a set to bank it instead.';
      case 'flipped': return st.tokens[st.turn.F].gem ? 'A gem! If yours is one too, tap a third fossil to go for the set — or end your turn.' : 'No match — end your turn to flip them back.';
      case 'gemThird': return 'Flip a third fossil.';
      case 'resolved': return st.turn.matched ? 'Match! Your set is at the top.' : 'End your turn to flip them back.';
      default: return '';
    }
  }

  // The one button on the table: end my turn (so I can flip the fossils back). Only while it is my turn.
  function endButtonHTML() {
    const st = ui.st;
    if (st.over || ui.turnCard || ui.botWaiting || animating() || isBot(st.current)) return '';
    return `<button class="end${['flipped', 'resolved'].includes(st.phase) ? ' go' : ''}" data-act="end">End turn</button>`;
  }

  // The opponent banked: say so plainly, with what it scored and its new total. It sits on the board but taps pass through it.
  function bankBannerHTML() {
    const st = ui.st, b = st.lastBank;
    if (!ui.botWaiting || animating() || !st.turn.banked || !b) return '';
    const what = b.rolls.length ? (b.bonus ? ` + ${b.bonus} bonus (rolled ${b.rolls.join(', ')})` : ` (rolled ${b.rolls[0]}, no bonus)`) : '';
    return `<button class="bankcard" data-act="dismissbank" style="--c:${COLORS[b.player]}"><div class="bk-who">${esc(seatName(b.player))} banked ${b.gem ? 'a gem' : 'a ' + b.value}</div>
      <div class="bk-pts">+${b.total}</div><div class="bk-sub">${b.base}${what}</div><div class="bk-score">Score now ${st.players[b.player].points}</div><div class="bk-tap">Tap anywhere to go on</div></button>`;
  }

  const swatches = '<span><i style="background:var(--umber)"></i>concealed</span><span><i style="background:var(--bone)"></i>public</span>';

  function gameHTML() {
    const st = ui.st;
    return `<div class="game">
      <div class="bar"><div class="chips">${chipsHTML()}</div><div class="sys"><button class="q" data-act="menu" aria-label="Menu">☰</button></div></div>
      <div class="legend">${ui.lastEvent && !ui.turnCard ? `<span class="event">${esc(ui.lastEvent)}</span>` : swatches}<span class="hint">${esc(hintsVisible() ? hint() : '')}</span></div>
      <div class="main"><div class="boardwrap">${boardSVG()}</div>${bankBannerHTML()}${endButtonHTML()}${ui.turnCard && !st.over ? turnCardHTML() : ''}</div>
    </div>${st.over && !animating() ? overHTML() : ''}${ui.menu ? menuHTML() : ''}`;
  }

  // Whose turn it is, said before they start tapping. (In pass & play it also stands in for handing the device over.)
  function turnCardHTML() {
    const st = ui.st, i = st.current, name = seatName(i), you = name === 'You';
    const title = st.turnNo === 0 ? `${name} ${you ? 'go' : 'goes'} first` : you ? 'Your turn' : `${name}'s turn`;
    return `<button class="turncard" data-act="begin" style="--c:${COLORS[i]}"><span class="tc-who">${esc(title)}</span>
      ${ui.lastEvent ? `<span class="tc-last">${esc(ui.lastEvent)}</span>` : ''}<span class="tc-tap">${isBot(i) ? 'Tap to watch' : 'Tap to start'}</span></button>`;
  }

  function menuHTML() {
    const m = ui.menu, sure = (q, yes, act) => `<p class="mq">${q}</p><button class="danger" data-act="${act}">${yes}</button><button data-act="menu-close">No, keep playing</button>`;
    const body = m === 'retry' ? sure('Start this game over with a fresh deal? The current game will be lost.', 'Yes, start over', 'retry')
      : m === 'quit' ? sure('Leave this game and go back to the start? The current game will be lost.', 'Yes, leave', 'quit')
      : `<button data-act="help">How to play</button><button data-act="menu-ask" data-v="retry">Retry</button><button data-act="menu-ask" data-v="quit">Back to the start</button><button data-act="menu-close">Resume</button>`;
    return `<div class="backdrop" data-act="menu-close"></div><div class="menu" role="menu">${body}</div>`;
  }

  const libraryLink = () => (D.library && /^https?:$/.test(location.protocol) ? `<a class="back" href="${esc(D.library.href)}">‹ ${esc(D.library.name)}</a>` : '');
  const footer = () => `${ui.notice ? `<p class="dim" style="margin-top:14px">${esc(ui.notice)}</p>` : ''}<p class="dim" style="margin-top:18px">Version ${esc(BUILD)}</p>`;

  // ---------------- the home screen's demo game ----------------
  // Two opponents play a whole real game on the real board, over and over: peeks (dashed ring), flips (solid ring),
  // matches that vanish when collected, misses that flip back — then a pause on the empty board and a fresh game.
  // Decoration only; it never touches the game you play.
  let demo = null;
  const stopDemo = () => { if (demo && demo.timer) clearTimeout(demo.timer); demo = null; };

  function demoNew() {
    const seed = Math.floor(Math.random() * 2147483647);
    const st = Engine.createGame({ players: 2, seed });
    const spec = Campaign.botSpec(LV[Math.min(2, LV.length - 1)]);
    return { st, bots: Bots.attach(st, [spec, spec], seed), seed, timer: null, moves: 0, el: null, cells: [], pts: [] };
  }

  function demoSVG(st) {
    const S = 34, W = Math.sqrt(3) * S;
    const pos = c => ({ x: W * (c.q + c.r / 2), y: 1.5 * S * c.r });
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    st.cells.forEach(c => { const q = pos(c); x0 = Math.min(x0, q.x - W / 2); x1 = Math.max(x1, q.x + W / 2); y0 = Math.min(y0, q.y - S); y1 = Math.max(y1, q.y + S); });
    const out = st.cells.map((c, k) => {
      const { x, y } = pos(c);
      return `<g class="h-cell" data-c="${c.id}" style="--i:${k}"><polygon class="bg" points="${hexPts(x, y, S)}"/>
        <g class="h-tile"><g class="h-back"><polygon class="face" points="${hexPts(x, y, S * 0.8)}"/><circle class="spiral" cx="${x}" cy="${y}" r="${S * 0.3}"/><circle class="spiral" cx="${x}" cy="${y}" r="${S * 0.13}"/></g>
        <g class="h-front"><polygon class="face" points="${hexPts(x, y, S * 0.8)}"/><text class="num" x="${x}" y="${y + 1}"></text></g></g>
        <polygon class="h-ring" points="${hexPts(x, y, S * 0.9)}"/></g>`;
    }).join('');
    const pad = 6;
    return `<svg class="hero-board" viewBox="${(x0 - pad).toFixed(1)} ${(y0 - pad).toFixed(1)} ${(x1 - x0 + 2 * pad).toFixed(1)} ${(y1 - y0 + 2 * pad).toFixed(1)}" aria-hidden="true">${out}</svg>`;
  }

  // Wire a fresh demo game to the SVG now on the page.
  function demoBind(d) {
    const art = document.querySelector('.hero-art');
    if (!art) return false;
    d.el = art;
    d.cells = []; art.querySelectorAll('.h-cell').forEach(el => { d.cells[+el.dataset.c] = el; });
    d.pts = [...art.querySelectorAll('.hs b')];
    return true;
  }
  const demoScores = d => { d.pts.forEach((b, i) => { b.textContent = d.st.players[i].points; }); d.el.querySelectorAll('.hs').forEach((el, i) => el.classList.toggle('cur', i === d.st.current && !d.st.over)); };
  const demoCell = (d, tid) => d.cells[d.st.tokens[tid].cell];
  function demoShow(d, tid, solid) {
    const el = demoCell(d, tid), t = d.st.tokens[tid], seat = d.st.current;
    const txt = el.querySelector('.h-front text');
    txt.textContent = t.gem ? '💎' : t.value; txt.setAttribute('class', t.gem ? 'gem' : 'num');
    el.querySelector('.h-ring').style.stroke = COLORS[seat];
    el.classList.add('ringed'); el.classList.toggle('dash', !solid); el.classList.toggle('up', solid);
  }

  // One move of the demo; returns how long to wait before the next one.
  function demoStep(d) {
    const st = d.st, P = D.homeDemo;
    if (st.over) {                                    // everything collected: the last set vanishes, then the empty board waits
      d.cells.forEach(el => { el.classList.add('gone'); el.classList.remove('ringed', 'up'); });
      demoScores(d);
      return P.restart;
    }
    const bot = d.bots[st.current], a = bot.decide(Engine.publicView(st, st.current));
    d.moves++;
    if (!a || a.type === 'endTurn' || d.moves > 4000) {            // the turn is over: collected fossils vanish, the rest flip back
      const matched = new Set(st.turn.matched || []);
      d.cells.forEach((el, c) => {
        const tid = st.tokens.findIndex(t => t.cell === c);
        el.classList.remove('ringed', 'dash', 'lift');
        if (matched.has(tid)) el.classList.add('gone');
        else el.classList.remove('up');
      });
      Engine.endTurn(st);
      demoScores(d);
      return P.endTurn;
    }
    Engine.apply(st, a);
    if (a.type === 'peek') { const el = demoCell(d, a.tid); demoShow(d, a.tid, false); el.classList.remove('lift'); void el.getBoundingClientRect(); el.classList.add('lift'); return P.peek; }
    if (a.type === 'flipOther' || a.type === 'flipSecond') { demoShow(d, a.tid, true); return P.flip; }
    if (a.type === 'flipOwn') { demoShow(d, st.turn.T, true); return P.flip; }
    if (a.type === 'bank') { demoScores(d); return P.bank; }
    return P.flip;
  }

  function demoRun(d) {
    if (demo !== d) return;
    if (!d.el.isConnected) { stopDemo(); return; }
    let wait;
    try { wait = demoStep(d); } catch (e) { wait = 0; }
    if (d.st.over && d.cells.every(el => el.classList.contains('gone')) && wait === D.homeDemo.restart) {
      d.timer = setTimeout(() => {
        const n = demoNew(); n.timer = null; demo = n;
        d.el.querySelector('.hero-board').outerHTML = demoSVG(n.st);
        demoBind(n); demoScores(n);
        n.timer = setTimeout(() => demoRun(n), 900);
      }, wait);
      return;
    }
    d.timer = setTimeout(() => demoRun(d), wait);
  }

  function startDemo() {
    stopDemo();
    if (ui.screen !== 'home' || reducedMotion()) return;
    const d = demoNew();
    if (!demoBind(d)) return;
    demo = d; demoScores(d);
    d.timer = setTimeout(() => demoRun(d), 1400);
  }

  function homeHTML() {
    stopDemo();
    const beaten = LV.filter((l, i) => Campaign.isBeaten(i, ui.beaten)).length;
    const pips = LV.map((l, i) => `<i class="${Campaign.isBeaten(i, ui.beaten) ? 'on' : ''}"></i>`).join('');
    const st0 = Engine.createGame({ players: 2, seed: 1 });          // only for the board's shape; the demo game itself starts once the page is drawn
    return `<div class="screen home"><div class="sheet hero">
      <div class="hero-art">${demoSVG(st0)}<div class="hero-score">${[0, 1].map(i => `<div class="hs" style="--c:${COLORS[i]}"><i></i><b>0</b></div>`).join('')}</div></div>
      <div class="hero-menu">
        ${libraryLink()}
        <h1 class="logo">Fossil<br>Frenzy</h1>
        <p class="sub">Peek. Flip. Match. Bank. A memory game of fossils and rivals.</p>
        <button class="mode primary" data-act="mode" data-v="campaign"><b>Campaign</b><span>${LV.length} opponents, easiest to hardest</span><span class="pips" aria-label="${beaten} of ${LV.length} beaten">${pips}</span></button>
        <button class="mode" data-act="mode" data-v="pass"><b>Pass &amp; Play</b><span>${D.players.min}–${D.players.max} people, one device</span></button>
        <button class="ghost" data-act="help">How to play</button>
        ${ui.notice ? `<p class="dim" style="margin:8px 0 0">${esc(ui.notice)}</p>` : ''}<p class="dim ver">Version ${esc(BUILD)}</p>
      </div>
    </div></div>`;
  }

  function passHTML() {
    const p = ui.pass;
    const seats = Array.from({ length: p.n }, (_, i) => `<div class="seatrow"><span class="dot" style="background:${COLORS[i]}"></span>
        <input value="${esc(p.names[i])}" maxlength="14" data-act="name" data-i="${i}" aria-label="Name of player ${i + 1}"></div>`).join('');
    return `<div class="screen"><div class="sheet">
      <button class="back" data-act="home">‹ Fossil Frenzy</button>
      <h1>Pass &amp; Play</h1><p class="sub">Pass the device around the table.</p>
      <h2>Players</h2><span class="seg">${Array.from({ length: D.players.max - D.players.min + 1 }, (_, k) => k + D.players.min).map(n => `<button class="${p.n === n ? 'on' : ''}" data-act="n" data-v="${n}">${n}</button>`).join('')}</span>
      ${seats}
      <button class="big" data-act="deal">Deal the fossils</button>
    </div></div>`;
  }

  function campaignHTML() {
    const rows = LV.map((l, i) => {
      const open = unlocked(i), done = Campaign.isBeaten(i, ui.beaten);
      return `<button class="lvl${open ? '' : ' locked'}${done ? ' done' : ''}" data-act="level" data-i="${i}"${open ? '' : ' aria-disabled="true"'}>
        <span class="n">${i + 1}</span><b>${esc(l.name)}</b><span class="state">${open ? (done ? '✓ Beaten' : 'Ready') : '🔒'}</span></button>`;
    }).join('');
    const all = LV.every((l, i) => Campaign.isBeaten(i, ui.beaten));
    return `<div class="screen"><div class="sheet">
      <button class="back" data-act="home">‹ Fossil Frenzy</button>
      <h1>Campaign</h1>
      <div class="levels">${rows}</div>
      ${all ? '<p class="sub" style="margin-top:16px">🏆 You have beaten every opponent.</p>' : ''}
    </div></div>`;
  }

  const WHY = { score: 'highest score', sets: 'most sets popped', finalPair: 'popped the final pair' };
  function overHTML() {
    const st = ui.st, r = st.result, keys = st.rules.tiebreaks, campaign = ui.mode === 'campaign', o = ui.outcome;
    let why = '';
    if (r.winners.length > 1) why = r.winners.length === st.n ? 'Dead heat.' : 'Shared win — every tie-break is level.';
    else if (r.ranking.length > 1) { const a = r.ranking[0], b = r.ranking[1]; const k = keys.find(k => a[k] !== b[k]); why = k === 'score' ? '' : `Tied on score — won on ${WHY[k]}.`; }
    let title = r.winners.length > 1 ? 'Shared win!' : esc(seatName(r.winners[0])) + ' wins!';
    if (campaign && o) title = o.won ? `You beat ${esc(LV[ui.levelIdx].name)}!` : r.winners.length > 1 ? 'A draw — not a win.' : `${esc(LV[ui.levelIdx].name)} wins`;
    const extra = campaign && o ? (o.completed ? '🏆 Campaign complete — every opponent beaten!' : o.newlyUnlocked ? `🔓 ${esc(o.newlyUnlocked)} unlocked.` : o.won ? '' : 'Win outright to unlock the next level.') : '';
    const tileHTML = (v, cls = '') => `<span class="mini ${cls}">${v === 16 ? '💎' : v}</span>`;
    const places = r.ranking.map(x => {
      const p = st.players[x.idx], win = r.winners.includes(x.idx);
      const bonus = p.banked.reduce((n, b) => n + b.bonus, 0);
      return `<div class="place${win ? ' win' : ''}" style="--c:${COLORS[x.idx]}">
        <div class="pn"><span class="dot"></span>${win ? '🏆 ' : ''}${esc(seatName(x.idx))}</div>
        <div class="score">${x.score}</div>
        <div class="tiles">${p.banked.map(b => tileHTML(b.value)).join('') || '<span class="dim">nothing banked</span>'}${bonus ? `<span class="bonus">+${bonus}</span>` : ''}</div>
        ${p.sets.length ? `<div class="tiles lostrow" title="not banked">${p.sets.map(s => tileHTML(s.value, 'lost')).join('')}</div>` : ''}
      </div>`;
    }).join('');
    const nextBtn = campaign && o && o.won && ui.levelIdx + 1 < LV.length && unlocked(ui.levelIdx + 1);
    return `<div class="screen"><div class="sheet"><h1>${title}</h1>
      <p class="sub">${[why, extra].filter(Boolean).join(' ')}</p><div class="results">${places}</div>
