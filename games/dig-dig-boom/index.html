<!doctype html>
<html lang="en">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dig Dig BOOM!">

<title>Dig Dig BOOM!</title>
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<style>
:root { --bg: #1c1410; --panel: #2a1f18; --line: #4b3a2c; --text: #f4ead8; --dim: #ac9a82; --accent: #ffb13b; --good: #52d28a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
body { padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 40px max(14px, env(safe-area-inset-left)); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
a { color: var(--accent); }
h1 { margin: 6px 0 2px; font-size: clamp(26px, 5vw, 40px); }
h2 { margin: 0 0 4px; font-size: 22px; }
.sub { color: var(--dim); margin: 0 0 12px; font-size: 15px; line-height: 1.4; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 18px; }
.chip { min-height: 44px; padding: 8px 14px; border-radius: 99px; background: var(--panel); border: 2px solid var(--line); font-weight: 700; font-size: 15px; }
.chip.on { border-color: var(--accent); background: #4a3418; }
.status { font-size: 13px; color: var(--dim); }
.status b { color: var(--good); }
.status.bad b { color: #ff7a6b; }
.back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 16px 8px 12px; border-radius: 99px; background: var(--panel); border: 2px solid var(--accent); font-weight: 800; text-decoration: none; color: var(--text); }
.back span { color: var(--accent); font-size: 22px; line-height: 1; }
.dir { margin: 0 0 34px; padding: 16px; border-radius: 18px; background: var(--panel); border: 2px solid var(--line); }
.dir .why { margin: 0 0 12px; padding-left: 20px; font-size: 15px; line-height: 1.45; }
.dir .why li { margin: 3px 0; }
.h3 { margin: 18px 0 6px; font-size: 17px; }
.dir .tag { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.cell { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.cap { font-size: 12px; color: var(--dim); }
.fan { position: relative; margin: 6px 0 4px; }
.fan .card { position: absolute; }
.qs { font-size: 14px; line-height: 1.45; }
.qs li { margin: 4px 0; }
details { margin: 10px 0; }
summary { cursor: pointer; font-weight: 700; padding: 8px 0; }

/* ---------- the cards ----------
   Every card is drawn on a grid of hundredths of an inch (275 x 375 portrait, 375 x 275 landscape: 2.5 x 3.5 in poker size plus
   0.125 in bleed all round). --u is how many screen pixels one unit is. Positions are computed in the script. */
.card { position: relative; overflow: hidden; border-radius: 0; background: var(--ink-bg, #fff); color: #1d1712; font-family: "Avenir Next", "Helvetica Neue", Arial, system-ui, sans-serif; flex: none; }
.card.round { border-radius: calc(var(--u) * 12.5); }
.card .abs { position: absolute; }
.card .paper { background: #fffaf0; }
.card .band { color: var(--on, #fff); }
.card .name { font-weight: 800; line-height: 1; white-space: nowrap; letter-spacing: -.01em; }
.card .typeword { font-weight: 800; letter-spacing: .12em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
.card .text { font-weight: 600; line-height: 1.13; color: #1d1712; overflow: hidden; }
.card .text .ic, .meas .ic { display: inline-block; width: 1.12em; height: 1.12em; vertical-align: -.2em; margin: 0 .04em; }
.card .stat { font-weight: 900; line-height: 1.05; }
.card .art { border-radius: calc(var(--u) * 7); background: repeating-linear-gradient(135deg, #e9dfc9 0 calc(var(--u)*6), #f6efdf calc(var(--u)*6) calc(var(--u)*12)); border: calc(var(--u) * 1.5) solid rgba(0,0,0,.28); display: flex; align-items: center; justify-content: center; color: rgba(0,0,0,.35); font-weight: 800; letter-spacing: .2em; }
.card .art svg { width: 62%; height: 62%; opacity: .55; }
.card .num { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #fffaf0; color: #1d1712; font-weight: 900; border-style: solid; }
.card .disc { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #fffaf0; }
.card .disc svg { width: 72%; height: 72%; }
.guides { position: absolute; inset: 0; pointer-events: none; }
.guides i { position: absolute; display: block; }
.guides .trim { border: 1.5px dashed #ff2d55; }
.guides .safe { border: 1.5px dashed #00b86b; }
.guides .bleed { border: 1px solid rgba(255,255,255,.7); mix-blend-mode: difference; }
table.cmp { width: 100%; border-collapse: collapse; margin: 0 0 22px; font-size: 14px; }
table.cmp th, table.cmp td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
table.cmp th { background: var(--panel); color: var(--accent); }
.view-gray .card { filter: grayscale(1); }
.view-deut .card { filter: url(#deut); }
.view-prot .card { filter: url(#prot); }
.meas { position: absolute; left: -9999px; top: 0; visibility: hidden; font-weight: 600; line-height: 1.13; font-family: "Avenir Next", "Helvetica Neue", Arial, system-ui, sans-serif; }
@media print { body { background: #fff; } .bar, .dir h2, .dir .why, .sub, h1, .status, .back, details, .cap { display: none; } .dir { border: 0; padding: 0; background: none; } }
</style>
</head>

<!-- =====================================================================
     DATA — where the cards and rules come from, the card types, the icon codes, the card geometry.
     The card list is NEVER copied into this file: it is fetched from the owner's Google Sheet every time the page opens.
     (The one exception is the `sample` block at the bottom, used ONLY when the sheet cannot be reached, so the design pages can
     still be looked at. It is labelled on screen whenever it is in use.)
     ===================================================================== -->
<script id="data">
const DDB = {
  title: 'Dig Dig BOOM!',
  library: { name: 'Tabletop Library', href: '../../index.html' },
  sheet: {
    id: '1cKcNNs38CydvvhW7rUJIc4DWHgEvT-deluLdhrIpk04',
    tabs: { cards: 2, rules: 3 },                      // gid of "v2.7 Draft" (the cards) and "v2.7 Rules"
    published: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT9Dj7h1xNJd67s2p8OoqN2pHYIuj4rNi5TmivT6gtkgdR8Sl_igL_icc9uYsxwwgA92IraLkDpHmi3/pub',   // "Publish to web" link (browsers may read it)
    urls: [                                            // tried in order; the first that answers wins
      (id, gid) => `${DDB.sheet.published}?gid=${gid}&single=true&output=csv`,
      (id, gid) => `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&gid=${gid}`,
      (id, gid) => `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`,
    ],
    timeoutMs: 12000,
  },
  // Columns of the card tab. Print = shown on the card. Hint = used by game logic. Note = design notes, never printed.
  columns: { id: 'ID', name: 'Name', type: 'Type', number: 'Number', deck: 'Deck', count: 'Count', text: 'Card Text', trigger: 'Trigger', notes: 'Notes' },
  // Card types (v2.7 Rules, "Card types"): colour, icon, and a second cue (pattern) so no type depends on colour alone.
  types: {
    Treasure:  { icon: 't-treasure',  color: '#2b86d1', on: '#ffffff', pattern: 'p-treasure',  role: 'Geodes' },
    Immediate: { icon: 't-immediate', color: '#f2c21b', on: '#1d1712', pattern: 'p-immediate', role: 'Do it when dug, then discard' },
    Power:     { icon: 't-power',     color: '#7a3fb8', on: '#ffffff', pattern: 'p-power',     role: 'Sits on the Power line at its number' },
    Ongoing:   { icon: 't-ongoing',   color: '#aab3bd', on: '#1d1712', pattern: 'p-ongoing',   role: 'Stays in play' },
    Monster:   { icon: 't-monster',   color: '#cf2f2f', on: '#ffffff', pattern: 'p-monster',   role: 'Roll, resolve, take damage' },
  },
  // {code} in Card Text -> icon
  iconCodes: { heart: 'i-heart', grit: 'i-grit', reroll: 'i-reroll', damage: 'i-damage', gem: 'i-gem' },
  // Poker-size card, in hundredths of an inch (1 unit = 0.01 in).
  card: { trimW: 250, trimH: 350, bleed: 12.5, safe: 12.5 },
  // The cards used on the design pages (by ID), one or more of each type, including the card with the longest text.
  labIds: ['PW-18', 'PW-21', 'ON-22', 'IM-24', 'TR-01', 'MO-01'],
  round2: { textIds: ['PW-18', 'PW-21', 'ON-22', 'IM-24'], statIds: ['TR-01', 'MO-01', 'MO-02'] },
  texts: { longestHint: 'IM-24' },
  // ---- The rules of a Dig (v2.7 Rules tab). Numbers here are the rules; the engine (script "dig") only does what they say. ----
  rules: {
    die: 6,                                              // sides of the die (QUESTIONS #11: not stated in the Rules tab)
    caps: { heart: 12, grit: 6, reroll: 3 },             // Drill tracks: Health 0-12, Grit 0-6, Rerolls 0-3
    start: { heart: 6, grit: 0, reroll: 0 },             // each track's starred reset space (QUESTIONS #12: not stated)
    gritBefore: 1,                                       // Grit spent before the roll: +1 each
    gritAfter: { cost: 3, bonus: 1 },                    // Grit spent after seeing the roll: 3 for +1
    rerollCost: 1,
    pet: { at: 10 },                                     // the Pet (the Starting Power card) sits on the Power line at 10
    line: { min: 1, max: 10 },
    startingDeck: 'Starting',                            // the Deck column value for the Mine's cards and the Pet
    survivedGems: 1, geodeGems: 1,
    beyond: { firstDamage: 8, gems: 2 },                 // Monsters after the Mine runs out: 8, 9, ... and worth 2 gems
    kitSizes: [1, 2, 2, 3],                              // Round tracker: Starter Kit cards per round (testing)
    maxChain: 6,                                         // safety limit on effects that trigger effects
    rulings: {                                           // each one is a question in QUESTIONS.md; change the value to change the rule
      transformOrder: ['double', 'becomes', 'floor'],    // #9  what happens to the result, in order, after bonuses are added
      damageOrder: 'halveThenBlock',                     // #2
      gritCarriesToReroll: true,                         // #4  grit already spent stays on a rerolled die
      bankWhen: 'anytime',                               // #6  between cards (not mid-fight); there is no Pledge in a solo Dig
      gainAtCapFires: false,                             // #13 "Whenever you gain" needs the track to actually move
      panicRetriggers: true,                             // #10 a free reroll triggers the line again
      falconIncludesGrit: false,                         // sheet question on Falcon Finisher
      kitImmediates: 'mine',                             // #14 Immediate Starter Kit cards are shuffled into the Mine
    },
  },
  // ---- The phrase book: card text -> effect. [op, regular expression]. Unmatched text is shown as "not implemented yet" ----
  phrases: {
    whole: [                                             // matched against the entire card text first
      ['falcon',  "^Roll again\\. If it's (\\d+) or more, defeat this Monster$"],
      ['clover',  "^Don't roll for your next Monster\\. Your result is (\\d+)$"],
      ['crystal', "^Look at the top (\\d+) cards of your Mine\\. Play any Power or Ongoing cards you see; put the rest back$"],
      ['radar',   "^Look at the top (\\d+) cards of your Mine\\. \\+(\\d+) \\{heart\\} per Monster, then shuffle them back on top$"],
      ['stink',   "^Look at the top (\\d+) cards of your Mine\\. Move any Monsters to the bottom$"],
      ['oldmap',  "^Look at the top card of your Mine\\. If it's a Monster, move it to the bottom$"],
      ['cave',    "^Keep digging until you dig a Monster\\. Put it back on top of your Mine, face up$"],
      ['sneak',   "^Dig a card\\. If it's a Monster, defeat it$"],
      ['reveal',  "^Reveal cards from your Mine until you find (?:a|an) (Power or Ongoing|Immediate) card\\. (?:Play it and|Do it, then) shuffle the rest back$"],
      ['clone',   "^Place under one of your Power cards\\. That card triggers twice$"],

    sentence: [                                          // one sentence of an Immediate or Power card (also the part after "When dug,")

      ['gainHalf',  "^Gain \\{heart\\} equal to half your result, rounded down$"],
      ['gainDmg',   "^Gain \\{heart\\} equal to this Monster's \\{damage\\}$"],
      ['gainPer',   "^\\+(\\d+) \\{(heart|grit|reroll)\\} (?:for each|per) (.+)$"],
      ['ifNoOther', "^If no other card triggers, (.+)$"],
      ['ifHeart',   "^If you have (\\d+) \\{heart\\} or less, (.+)$"],
      ['block',     "^Block (\\d+) \\{damage\\}$"],
      ['survive1',  "^If this Monster would make you BOOM, survive with (\\d+) \\{heart\\}$"],
      ['halve',     "^This Monster deals half \\{damage\\}, rounded down$"],
      ['defeat',    "^Defeat the Monster$"],
      ['noDamage',  "^You take no \\{damage\\}$"],
      ['echo',      "^Do the effect of the top Immediate card in your discard pile$"],
      ['thenMove',  "^(.+), then move this card down (\\d+)$"],
      ['moveHigh',  "^Move your highest Power card \\(not your Pet\\) down (\\d+)$"],
      ['slide',     "^Slide this card back into the middle of your Mine$"],
      ['petTreat',  "^Your Pet triggers (\\d+) lower until Prep$"],
      ['look',      "^Look at the top (\\d+) cards of your Mine$"],
      ['setHeart',  "^Set your \\{heart\\} to (\\d+)$"],
      ['fill',      "^Fill up your \\{reroll\\}$"],
      ['rewind',    "^Put the top Immediate card of your discard pile on top of your Mine$"],
      ['shoo',      "^Move the top card of your Mine to the bottom without looking$"],
      ['wishing',   "^Shuffle the top (\\d+) Immediate cards of your discard pile back into your Mine$"],
      ['whenKept',  "^When kept from a Booster Pack, .*$"],
    ],
    per: [                                               // what "for each ..." counts
      ['otherTriggers', "^other card that triggers$"],
      ['ongoing',       "^Ongoing card you have$"],
      ['immediateInDiscardThis', "^Immediate card in your discard pile, including this one$"],
      ['immediateInDiscard',     "^Immediate card in your discard pile$"],
      ['defeatedDig',   "^Monster you've defeated this Dig$"],
      ['survivedDig',   "^Monster you've survived this Dig$"],
    ],
    ongoing: [                                           // Ongoing cards: the whole text
      ['whenever',   "^Whenever (.+?), (.+)$"],
      ['startDig',   "^At the start of each Dig, (.+)$"],
      ['modPlain',   "^\\+(\\d+) to your rolls$"],
      ['modPer',     "^\\+(\\d+) to your rolls for every (\\d+) Monsters you've survived this Dig$"],
      ['modImm',     "^\\+(\\d+) to your rolls for each Immediate card in your discard pile, up to \\+(\\d+)$"],
      ['modVs',      "^\\+(\\d+) to your rolls against Monsters with (\\d+)\\+ \\{damage\\}$"],
      ['modLow',     "^While you have (\\d+) \\{heart\\} or less, \\+(\\d+) to your rolls$"],
      ['becomes',    "^If your result is (\\d+), it becomes a (\\d+)$"],
      ['floor',      "^If your result is less than (\\d+), it becomes (\\d+)$"],
      ['sparkLow',   "^If your result is (\\d+) or less, reroll for free$"],
      ['double',     "^Double your result against your first Monster each Dig$"],
      ['bounty',     "^Monsters you defeat are worth (\\d+) \\{gem\\}$"],
      ['bumper',     "^Block (\\d+) \\{damage\\} from every Monster$"],
      ['cowcatcher', "^Your first Monster each Dig deals no \\{damage\\}$"],
      ['panic',      "^The first time each Dig a roll would make you BOOM, reroll it for free$"],

<script id="engine">
/* =====================================================================
   ENGINE — no DOM. Sheet text -> rows -> cards; card text -> tokens; fitting arithmetic.
   ===================================================================== */
const Engine = (() => {
  // RFC-4180 CSV: quoted fields, doubled quotes, newlines inside quotes. (\u0001 stands for a comma inside the design-time sample.)
  function parseCSV(text) {
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f.length || row.length) { row.push(f); rows.push(row); }
    return rows.filter(r => r.some(x => x !== ''));
  }
  // rows -> objects keyed by header, then -> cards
  function table(rows) {
    const head = rows[0].map(h => h.trim());
    return rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] === undefined ? '' : r[i]).replace(/\u0001/g, ',')])));
  }
  function cards(rows, cols) {
    return table(rows).filter(r => r[cols.id] && r[cols.name]).map(r => ({
      id: r[cols.id].trim(), name: r[cols.name].trim(), type: r[cols.type].trim(),
      number: r[cols.number] === '' || r[cols.number] === undefined ? null : Number(r[cols.number]),
      deck: r[cols.deck].trim(), count: Number(r[cols.count]) || 1, text: r[cols.text].trim(),
      trigger: (r[cols.trigger] || '').trim(), note: (r[cols.notes] || '').trim(), raw: r,
    }));
  }
  const questions = list => list.filter(c => /^question:/i.test(c.note)).map(c => ({ id: c.id, name: c.name, q: c.note.replace(/^question:\s*/i, '') }));
  // "+1 {reroll}. When dug, +2 {grit}" -> [{t:'text',v:'+1 '},{t:'icon',v:'reroll'},...]
  function tokens(text, iconCodes) {
    const out = []; const re = /\{(\w+)\}/g; let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) out.push({ t: 'text', v: text.slice(last, m.index) });
      out.push(iconCodes[m[1]] ? { t: 'icon', v: m[1] } : { t: 'text', v: m[0] });
      last = m.index + m[0].length;
    }
    if (last < text.length) out.push({ t: 'text', v: text.slice(last) });
    return out;
  }
  // Largest value in [lo, hi] (steps of `step`) for which fits(v) is true. fits must be monotone: true for small values.
  function largestFitting(fits, lo, hi, step = 0.25) {
    let a = Math.round(lo / step), b = Math.round(hi / step);
    if (!fits(a * step)) return a * step;
    while (a < b) { const mid = Math.ceil((a + b) / 2); if (fits(mid * step)) a = mid; else b = mid - 1; }
    return a * step;
  }
  // "{damage} 1 → 3 → 5 → 7" -> [1, 3, 5, 7]   (null when the text is not a damage ladder)
  function damageSteps(text) {
    const m = /^\s*\{damage\}\s*([\d\s→>,\-]+)$/.exec(text);
    if (!m) return null;
    const nums = m[1].split(/[^\d]+/).filter(Boolean).map(Number);
    return nums.length ? nums : null;
  }
  // "1 {gem}" -> 1   (how many gems a Treasure card is worth)
  const gemWorth = text => { const m = /^\s*(\d+)\s*\{gem\}\s*$/.exec(text); return m ? Number(m[1]) : null; };
  const formatSize = u => (u / 100).toFixed(2) + ' in (' + (u * 0.01 * 72).toFixed(1) + ' pt)';
  return { parseCSV, table, cards, questions, tokens, largestFitting, damageSteps, gemWorth, formatSize };
})();
</script>

<script id="dig">
/* =====================================================================

    const h = match(PH.sentence, s); if (!h) return null; const m = h.m;
    switch (h.op) {
      case 'list': return { op: 'list', items: listItems(s) };
      case 'gainHalf': case 'gainDmg': case 'block': case 'survive1': case 'halve': case 'defeat': case 'noDamage': case 'echo': case 'slide': case 'fill': case 'rewind': case 'shoo': case 'whenKept':
        return { op: h.op, n: m[1] ? Number(m[1]) : undefined };
      case 'gainPer': { const per = match(PH.per, m[3]); return per ? { op: 'gainPer', n: Number(m[1]), res: m[2], per: per.op } : null; }
      case 'ifNoOther': { const t = parseSentence(m[1]); return t ? { op: 'if', cond: { noOther: true }, then: t } : null; }
      case 'ifHeart': { const t = parseSentence(m[2]); return t ? { op: 'if', cond: { heartAtMost: Number(m[1]) }, then: t } : null; }
      case 'thenMove': { const t = parseSentence(m[1]); return t ? { op: 'seq', list: [t, { op: 'moveSelf', n: Number(m[2]) }] } : null; }
      case 'moveHigh': return { op: 'moveHigh', n: Number(m[1]) };
      case 'petTreat': return { op: 'petTreat', n: Number(m[1]) };
      case 'look': return { op: 'look', n: Number(m[1]) };
      case 'setHeart': return { op: 'setHeart', n: Number(m[1]) };

      case 'modPlain': o.mods.push({ plus: n(1) }); break;
      case 'modPer': o.mods.push({ plus: n(1), perSurvived: n(2) }); break;
      case 'modImm': o.mods.push({ plus: n(1), perImmediate: true, cap: n(2) }); break;
      case 'modVs': o.mods.push({ plus: n(1), vsDamage: n(2) }); break;
      case 'modLow': o.mods.push({ plus: n(2), heartAtMost: n(1) }); break;
      case 'becomes': o.transforms.push({ kind: 'becomes', from: n(1), to: n(2) }); break;
      case 'floor': o.transforms.push({ kind: 'floor', below: n(1), to: n(2) }); break;
      case 'sparkLow': o.flags.sparkLow = n(1); break;
      case 'double': o.transforms.push({ kind: 'double' }); break;
      case 'bounty': o.flags.bounty = n(1); break;
      case 'bumper': o.flags.bumper = n(1); break;
      case 'cowcatcher': o.flags.cowcatcher = true; break;
      case 'panic': o.flags.panic = true; break;
      case 'whistle': o.flags.whistle = n(1); break;
      case 'drone': o.flags.drone = n(1); break;
      case 'thorned': o.flags.thorned = n(1); break;

  const copies = card => Array.from({ length: card.count || 1 }, () => copy(card));
  // allCards: every card of the sheet. kit: Booster cards chosen for the Starter Kit. opts: { seed, start, dice }
  function start(allCards, kit = [], opts = {}) {
    const seed = opts.seed === undefined ? (Math.random() * 4294967296) >>> 0 : opts.seed;
    const st = { seed, rng: makeRng(seed), dice: opts.dice ? opts.dice.slice() : null, log: [], over: null, fight: null, pending: null, flags: {}, known: 0,
      mine: [], discard: [], line: [], ongoing: [], petLower: 0, setCount: {}, beyond: 0,
      digs: 0, monstersDug: 0, survived: 0, defeated: 0, geodeGems: 0, monsterGems: 0, panicUsed: false,
      heart: 0, grit: 0, reroll: 0, rules: { ...R.start, ...(opts.start || {}) }, kit: [] };

    if (st.kit.length) log(st, 'sys', `Starter Kit: ${st.kit.map(k => k.name).join(', ')}.`);

  }
  function log(st, kind, text, extra) { st.log.push({ kind, text, ...(extra || {}) }); }

  function amplifier(st, res) { let n = 0; for (const o of st.ongoing) n += compile(o).ongoing.flags['amp_' + res] || 0; return n; }

      case 'halve': if (f) { f.halve = true; log(st, 'effect', `${src}: this Monster deals half {damage}`); } break;

      }
      case 'slide': {
        const at = Math.floor(st.mine.length / 2); st.mine.splice(at, 0, ctx.src); ctx.moved = true; st.known = Math.min(st.known, at);
        log(st, 'effect', `${src} slides into the middle of your Mine`); break;
      }
      case 'look': { st.known = Math.max(st.known, Math.min(e.n, st.mine.length)); log(st, 'effect', `${src}: look at the top ${e.n}: ${peekNames(st, e.n)}`); break; }
      case 'setHeart': st.heart = clamp(e.n, 0, R.caps.heart); log(st, 'effect', `${src}: {heart} set to ${st.heart}`); break;
      case 'fill': st.reroll = R.caps.reroll; log(st, 'effect', `${src}: {reroll} filled to ${st.reroll}`); break;
      case 'rewind': {
        const i = lastIndex(st.discard, c => c.type === 'Immediate');
        if (i < 0) log(st, 'effect', `${src}: no Immediate card in your discard pile`);
        else { const [c] = st.discard.splice(i, 1); st.mine.unshift(c); st.known = Math.min(st.mine.length, st.known + 1); log(st, 'effect', `${src}: ${c.name} goes on top of your Mine`); }
        break;
      }
      case 'shoo': if (st.mine.length) { st.mine.push(st.mine.shift()); st.known = Math.max(0, st.known - 1); log(st, 'effect', `${src}: the top card of your Mine goes to the bottom, unseen`); } break;
      case 'wishing': {
        const moved = []; for (let k = 0; k < e.n; k++) { const i = lastIndex(st.discard, c => c.type === 'Immediate'); if (i < 0) break; moved.push(st.discard.splice(i, 1)[0]); }
        st.mine.push(...moved); shuffle(st, st.mine); st.known = 0; log(st, 'effect', `${src}: ${moved.length ? moved.map(c => c.name).join(', ') + ' shuffled back into your Mine' : 'no Immediate cards in your discard pile'}`); break;
      }
      case 'clover': st.flags.clover = e.a; log(st, 'effect', `${src}: your next Monster is a ${e.a} without rolling`); break;
      case 'oldmap': {
        const top = st.mine[0];
        if (!top) break;
        if (top.type === 'Monster') { st.mine.push(st.mine.shift()); st.known = 0; log(st, 'effect', `${src}: top card is ${top.name} — moved to the bottom`); } else { st.known = Math.max(st.known, 1); log(st, 'effect', `${src}: top card is ${top.name} — it stays`); }
        break;
      }
      case 'stink': {
        const n = Math.min(e.a, st.mine.length), top = st.mine.splice(0, n), keep = top.filter(c => c.type !== 'Monster'), gone = top.filter(c => c.type === 'Monster');
        st.mine = [...keep, ...st.mine, ...gone]; st.known = keep.length; log(st, 'effect', `${src}: top ${n}: ${top.map(c => c.name).join(', ')} — ${gone.length} Monster(s) to the bottom`); break;
      }
      case 'radar': {
        const n = Math.min(e.a, st.mine.length), top = st.mine.splice(0, n), mons = top.filter(c => c.type === 'Monster').length;
        shuffle(st, top); st.mine.unshift(...top); st.known = 0;
        log(st, 'effect', `${src}: top ${n} had ${mons} Monster(s); shuffled back on top`); gain(st, 'heart', e.b * mons, src, depth); break;
      }
      case 'crystal': {
        const n = Math.min(e.a, st.mine.length), top = st.mine.splice(0, n);
        const play = top.filter(c => c.type === 'Power' || c.type === 'Ongoing'), back = top.filter(c => !(c.type === 'Power' || c.type === 'Ongoing'));
        st.mine.unshift(...back); st.known = back.length; log(st, 'effect', `${src}: top ${n}: ${top.map(c => c.name).join(', ')}`);
        for (const c of play) { if (over(st)) break; place(st, c, depth + 1); }
        break;
      }
      case 'reveal': {
        const want = e.a === 'Immediate' ? ['Immediate'] : ['Power', 'Ongoing'], seen = [];
        let hit = null;
        while (st.mine.length) { const c = st.mine.shift(); if (want.includes(c.type)) { hit = c; break; } seen.push(c); }
        st.mine.push(...seen); shuffle(st, st.mine); st.known = 0;
        if (!hit) log(st, 'effect', `${src}: no ${e.a} card in your Mine`);
        else { log(st, 'effect', `${src}: found ${hit.name} (revealed ${seen.length} others, shuffled back)`); if (hit.type === 'Immediate') playImmediate(st, hit, depth + 1); else place(st, hit, depth + 1); }
        break;
      }
      case 'cave': {
        let n = 0;
        while (st.mine.length && !over(st)) {
          const c = st.mine.shift(); st.known = Math.max(0, st.known - 1);
          if (c.type === 'Monster') { st.mine.unshift(c); st.known = 1; log(st, 'effect', `${src}: found ${c.name} — it goes back on top, face up`); return; }
          n++; log(st, 'dig', `${src}: digs ${c.name}`); resolveDug(st, c, depth + 1);
        }
        log(st, 'effect', `${src}: dug ${n} cards and found no Monster`); break;
      }
      case 'sneak': {
        const c = st.mine.shift(); st.known = Math.max(0, st.known - 1);
        if (!c) { log(st, 'effect', `${src}: your Mine is empty`); break; }
        log(st, 'dig', `${src}: digs ${c.name}`); resolveDug(st, c, depth + 1, { autoDefeat: true }); break;
      }
      case 'clone': break;                                // an Ongoing card; handled when placed
      case 'whenKept': break;                             // only matters in Prep (Booster Pack)
    }
  }
  const lastIndex = (arr, fn) => { for (let i = arr.length - 1; i >= 0; i--) if (fn(arr[i])) return i; return -1; };
  const peekNames = (st, n) => st.mine.slice(0, n).map(c => c.name).join(', ') || 'nothing';

  // ---------------- digging ----------------
  function place(st, c, depth) {                           // a Power or Ongoing card comes into play
    if (c.type === 'Power') { st.line.push({ card: c, at: c.number, base: c.number }); log(st, 'dig', `${c.name} goes on the Power line at ${c.number}`); }
    else { st.ongoing.push(c); log(st, 'dig', `${c.name} goes in your Ongoing area`); if (compile(c).ongoing.flags.clone) st.pending = { kind: 'clone', card: c }; }
    const b = compile(c);
    if (c.type === 'Power' && b.dug.length) run(st, b.dug, { src: c, depth });
    if (c.type === 'Ongoing') { refreshPet(st); }
  }
  function playImmediate(st, c, depth) {
    const ctx = { src: c, depth };
    log(st, 'dig', `${c.name} (Immediate)`);
    run(st, compile(c).effects, ctx);
    if (!ctx.moved) st.discard.push(c);
    fire(st, 'digImmediate', {}, depth + 1);
  }
  function bonusMonster(st) {
    const dmg = R.beyond.firstDamage + st.beyond++;
    return { id: 'BONUS', name: 'Bonus Monster', type: 'Monster', number: null, deck: '', count: 1, text: `{damage} ${dmg}`, bonus: true, uid: uid++, damageNow: dmg };
  }
  function resolveDug(st, c, depth = 0, opt = {}) {
    if (over(st)) return;
    const b = compile(c);
    if (c.type === 'Treasure') { st.discard.push(c); st.geodeGems += b.worth || 0; log(st, 'dig', `${c.name}: +${b.worth} {gem}`); }
    else if (c.type === 'Immediate') playImmediate(st, c, depth);
    else if (c.type === 'Power' || c.type === 'Ongoing') place(st, c, depth);
    else if (c.type === 'Monster') startFight(st, c, opt);
    refreshPet(st);
  }
  function dig(st) {
    if (!can(st).dig) return false;
    st.digs++;
    let c = st.mine.shift(); st.known = Math.max(0, st.known - 1);
    if (!c) { c = bonusMonster(st); log(st, 'dig', `Your Mine is empty — a ${c.name} appears`); }
    else log(st, 'dig', `You dig ${c.name}`);
    resolveDug(st, c);
    return true;
  }

  // ---------------- the Monster roll ----------------
  function rollDie(st) { if (st.dice && st.dice.length) return st.dice.shift(); return 1 + Math.floor(st.rng() * R.die); }
  function startFight(st, m, opt = {}) {
    st.monstersDug++;
    const set = m.id, n = st.setCount[set] = (st.setCount[set] || 0) + 1, b = compile(m);
    const dmg = m.bonus ? m.damageNow : b.ladder[Math.min(n, b.ladder.length) - 1];
    const f = st.fight = { monster: m, damage: dmg, phase: 'before', die: null, grit: 0, gritSteps: [], bought: 0, gritSpent: 0, first: st.monstersDug === 1, fixed: null,
      block: 0, halve: false, noDamage: false, defeat: false, surviveAt: null, sparkUsed: false, rolls: 0, trig: [], gritFired: false };
    log(st, 'dig', `${m.name}${m.bonus ? '' : ' #' + n} — deals ${dmg} {damage}`);
    if (opt.autoDefeat) { f.defeat = true; log(st, 'effect', `The Monster is defeated without a roll`); finishFight(st, true); return; }
    fire(st, 'digMonster', { damage: dmg }, 1);
    if (over(st)) return;
    if (st.flags.clover !== undefined) { f.fixed = st.flags.clover; delete st.flags.clover; f.phase = 'after'; log(st, 'roll', `No roll: your result is ${f.fixed}`); }
  }
  function modsTotal(st, f) {
    let t = 0;
    for (const o of st.ongoing) for (const m of compile(o).ongoing.mods) {
      if (m.vsDamage !== undefined && !(f.damage >= m.vsDamage)) continue;
      if (m.heartAtMost !== undefined && !(st.heart <= m.heartAtMost)) continue;
      let v = m.plus;
      if (m.perSurvived) v = m.plus * Math.floor(st.survived / m.perSurvived);
      if (m.perImmediate) v = Math.min(m.cap, m.plus * st.discard.filter(c => c.type === 'Immediate').length);
      t += v;
    }
    return t;
  }
  function transform(st, f, r) {
    const ts = []; for (const o of st.ongoing) ts.push(...compile(o).ongoing.transforms);
    for (const kind of RL.transformOrder) for (const t of ts) {
      if (t.kind !== kind) continue;
      if (kind === 'double' && f.first) r *= 2;
      else if (kind === 'becomes' && r === t.from) r = t.to;
      else if (kind === 'floor' && r < t.below) r = t.to;
    }
    return r;
  }
  // The result now, with the pieces that make it up (for the table to show).
  function result(st) {
    const f = st.fight; if (!f) return null;
    if (f.fixed !== null) return { total: f.fixed, parts: [{ label: 'Fixed', v: f.fixed }] };
    if (f.die === null) return { total: 0, parts: [] };
    const parts = [{ label: 'Die', v: f.die }]; let r = f.die;
    if (f.grit) { parts.push({ label: 'Grit', v: f.grit }); r += f.grit; }
    if (f.bought) { parts.push({ label: 'Grit (after)', v: f.bought * R.gritAfter.bonus }); r += f.bought * R.gritAfter.bonus; }
    const mt = modsTotal(st, f); if (mt) { parts.push({ label: 'Cards', v: mt }); r += mt; }
    const t = transform(st, f, r); if (t !== r) parts.push({ label: 'Cards change it to', v: t, set: true });
    return { total: t, parts, raw: r };
  }
  const resultTotal = st => { const r = result(st); return r ? r.total : 0; };
  function afterDie(st) {                                   // a die was just rolled: free rerolls from Ongoing cards
    const f = st.fight, lim = flag(st, 'sparkLow');
    if (lim !== undefined && !f.sparkUsed) { const r = result(st); if ((r.raw === undefined ? r.total : r.raw) <= lim) { f.sparkUsed = true; log(st, 'roll', `Your result is ${lim} or less — a free reroll`); f.die = rollDie(st); f.rolls++; log(st, 'roll', `Rerolled: ${f.die} → ${resultTotal(st)}`); } }
  }
  function spendGrit(st) {                                  // before the roll: +1 each (the Drone Booster makes the first worth more)
    if (!can(st).grit) return false;
    const f = st.fight, drone = flag(st, 'drone'), v = f.gritSteps.length === 0 && drone ? drone : R.gritBefore;
    st.grit--; f.grit += v; f.gritSteps.push(v); f.gritSpent++; log(st, 'effect', `Grit spent: +${v} to the roll`); return true;
  }
  function refundGrit(st) {
    if (!can(st).refund) return false;
    const f = st.fight, v = f.gritSteps.pop(); st.grit++; f.grit -= v; f.gritSpent--; return true;
  }
  function roll(st) {
    if (!can(st).roll) return false;
    const f = st.fight; f.die = rollDie(st); f.rolls++; f.phase = 'after';
    log(st, 'roll', `You roll ${f.die}` + (f.grit ? ` +${f.grit} Grit` : '') + ` → ${resultTotal(st)}`);
    afterDie(st); checkGritWatch(st); return true;
  }
  function buyBonus(st) {
    if (!can(st).bonus) return false;
    const f = st.fight; st.grit -= R.gritAfter.cost; f.bought++; f.gritSpent += R.gritAfter.cost;
    log(st, 'effect', `${R.gritAfter.cost} Grit spent: +${R.gritAfter.bonus} → ${resultTotal(st)}`); checkGritWatch(st); return true;
  }
  function checkGritWatch(st) { const f = st.fight; if (f && !f.gritFired && f.gritSpent > 0) { fire(st, 'spendGrit', { n: f.gritSpent }, 1); if (f.gritSpent >= 1 && st.ongoing.some(o => compile(o).ongoing.watchers.some(w => w.ev === 'spendGrit' && f.gritSpent >= w.min))) f.gritFired = true; } }
  function reroll(st, opt = {}) {
    const c = can(st); if (!c.reroll) return false;
    const f = st.fight, th = flag(st, 'thorned'), useHealth = opt.withHealth || (st.reroll <= 0 && th);
    if (useHealth) { lose(st, th, 'Thorned Gadget'); if (over(st)) return true; } else st.reroll -= R.rerollCost;
    const old = f.die, nd = rollDie(st);
    f.die = flag(st, 'twinDrill') ? Math.max(old, nd) : nd; f.rolls++;
    if (!RL.gritCarriesToReroll) { st.grit += f.grit; f.grit = 0; }
    log(st, 'roll', `Reroll: ${nd}${f.die !== nd ? ' (keeps the higher, ' + f.die + ')' : ''} → ${resultTotal(st)}`);
    if (!useHealth) fire(st, 'spendReroll', {}, 1);
    afterDie(st); return true;
  }

  // ---------------- facing the Monster: trigger the line, then take damage ----------------
  function collectTriggers(st, r) {
    const list = [];
    for (const e of st.line) if (e.at <= r) { list.push(e); if (e.cloned) list.push(e); }
    return list.sort((a, b) => b.at - a.at);
  }
  function triggerPass(st) {
    const f = st.fight, r = resultTotal(st), trig = collectTriggers(st, r);
    f.trig = trig; f.block = 0; f.halve = false; f.noDamage = false; f.defeat = false; f.surviveAt = null;
    log(st, 'roll', `Result ${r}: ${trig.length ? trig.map(e => e.card.name).join(', ') + ' trigger' + (trig.length === 1 ? 's' : '') : 'no cards trigger'}`);
    for (const e of trig) { if (over(st)) return; run(st, compile(e.card).effects, { src: e.card, result: r, trig, depth: 0 }); }
    fire(st, 'triggers', { n: trig.length }, 1);
  }
  function previewDamage(st) {
    const f = st.fight; if (f.defeat || f.noDamage) return 0;
    if (f.first && anyFlag(st, 'cowcatcher')) return 0;
    const bump = flag(st, 'bumper') || 0;
    let d = f.damage;
    if (RL.damageOrder === 'halveThenBlock') { if (f.halve) d = Math.floor(d / 2); d = Math.max(0, d - f.block - bump); }
    else { d = Math.max(0, d - f.block - bump); if (f.halve) d = Math.floor(d / 2); }
    return d;
  }
  function face(st) {
    if (!can(st).face) return false;
    const f = st.fight;
    triggerPass(st); if (over(st)) return true;
    let dmg = previewDamage(st);
    if (!f.defeat && dmg >= st.heart && f.surviveAt === null && flag(st, 'panic') && !st.panicUsed && f.fixed === null) {
      st.panicUsed = true; log(st, 'effect', `${st.ongoing.find(o => compile(o).ongoing.flags.panic).name}: this would BOOM you — a free reroll`);
      f.die = rollDie(st); f.rolls++;
      log(st, 'roll', `Rerolled: ${f.die} → ${resultTotal(st)}`);
      if (RL.panicRetriggers) { triggerPass(st); if (over(st)) return true; }
      dmg = previewDamage(st);
    }
    finishFight(st, false, dmg); return true;
  }
  function finishFight(st, auto, dmg = 0) {
    const f = st.fight, m = f.monster;
    if (f.defeat) {
      st.defeated++; st.survived++;
      const bounty = flag(st, 'bounty') || 0, base = m.bonus ? R.beyond.gems : R.survivedGems, g = Math.max(bounty, base);
      st.monsterGems += g; log(st, 'effect', `${m.name} is defeated — worth ${g} {gem}`);
      st.fight = null; fire(st, 'defeat', {}, 1); return;
    }
    if (dmg > 0) {
      let take = dmg;
      if (take >= st.heart && f.surviveAt !== null) { take = st.heart - f.surviveAt; log(st, 'effect', `Lucky save: you survive with ${f.surviveAt} {heart}`); }
      st.heart -= take; log(st, 'damage', `You take ${take} {damage} (${f.damage}${f.halve ? ', halved' : ''}${f.block || flag(st, 'bumper') ? ', blocked ' + (f.block + (flag(st, 'bumper') || 0)) : ''})`);
      if (st.heart <= 0) { st.heart = 0; st.fight = null; boom(st, `${m.name} took your last {heart}`); return; }
    } else log(st, 'damage', `You take no {damage}`);
    st.survived++; st.monsterGems += m.bonus ? R.beyond.gems : R.survivedGems;
    st.fight = null; log(st, 'effect', `You survive ${m.name}. Monsters survived: ${st.survived}`);
    if (dmg > 0) fire(st, 'takeDamage', { n: dmg }, 1);
  }

  // ---------------- other actions ----------------
  function chooseClone(st, entry) {
    if (!st.pending || st.pending.kind !== 'clone') return false;
    const e = st.line.find(x => x === entry); if (!e) return false;
    e.cloned = true; log(st, 'effect', `${st.pending.card.name} is placed under ${e.card.name}: it triggers twice`); st.pending = null; return true;
  }
  function trade(st, dir) {                                  // Workbench
    const w = flag(st, 'workbench'); if (!w || st.fight && st.fight.phase === 'before' && false) return false;
    if (dir === 'grit' && st.grit >= w.gritCost && st.reroll < R.caps.reroll) { st.grit -= w.gritCost; st.reroll = Math.min(R.caps.reroll, st.reroll + w.rerollGain); log(st, 'effect', `Workbench: ${w.gritCost} {grit} → ${w.rerollGain} {reroll}`); return true; }
    if (dir === 'reroll' && st.reroll >= w.rerollCost && st.grit < R.caps.grit) { st.reroll -= w.rerollCost; st.grit = Math.min(R.caps.grit, st.grit + w.gritGain); log(st, 'effect', `Workbench: ${w.rerollCost} {reroll} → ${w.gritGain} {grit}`); return true; }
    return false;
  }
  function score(st) { return { geodes: st.geodeGems, monsters: st.monsterGems, total: st.geodeGems + st.monsterGems, survived: st.survived }; }
  function bank(st) {
    if (!can(st).bank) return false;
    const s = score(st); st.over = { kind: 'bank', ...s }; log(st, 'sys', `You bank: ${s.total} {gem}, ${s.survived} Monster${s.survived === 1 ? '' : 's'} survived.`); return true;
  }
  function can(st) {
    const f = st.fight, idle = !st.over && !f && !st.pending;
    return {
      dig: idle,
      bank: idle && (RL.bankWhen === 'anytime' || st.survived >= 1),
      grit: !!f && !st.over && f.phase === 'before' && st.grit >= 1,
      refund: !!f && !st.over && f.phase === 'before' && f.gritSteps.length > 0,
      roll: !!f && !st.over && f.phase === 'before',
      bonus: !!f && !st.over && f.phase === 'after' && f.fixed === null && st.grit >= R.gritAfter.cost,
      reroll: !!f && !st.over && f.phase === 'after' && f.fixed === null && (st.reroll >= R.rerollCost || (!!flag(st, 'thorned') && st.heart > flag(st, 'thorned'))),
      face: !!f && !st.over && f.phase === 'after',
      choose: !!st.pending && !st.over,
    };
  }
  return { compile, supported, parseEffects, parseOngoing, start, can, dig, spendGrit, refundGrit, roll, buyBonus, reroll, face, bank, chooseClone, trade, score, result, makeRng, shuffle, flag, previewDamage };
})();
</script>

<script id="ui">
(() => {
  'use strict';
  const D = DDB, E = Engine, C = D.card;
  const $app = document.getElementById('app');
  // Which build is this? tools/build.js stamps the commit/branch; an unbuilt file says so.
  const BUILD = (() => { const m = document.querySelector('meta[name=build]'); const v = m ? m.content : ''; return !v || v.startsWith('__') ? 'local file' : v; })();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const u = n => `calc(var(--u) * ${n})`;
  const state = { all: [], source: '', status: 'loading', error: '', view: 'color', guides: true, overlap: true, dir: 'all', round: true };

  // ---------------- the sheet ----------------
  async function fetchTab(gid) {
    let lastErr = '';
    for (const mk of D.sheet.urls) {
      const url = mk(D.sheet.id, gid), ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), D.sheet.timeoutMs);
      try {
        const res = await fetch(url, { signal: ctl.signal, cache: 'no-store', credentials: 'omit' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        if (/^\s*<(!doctype|html)/i.test(text)) throw new Error('got a web page, not CSV (is the sheet shared as "anyone with the link"?)');
        return text;
      } catch (e) { lastErr = (e && e.message) || String(e); } finally { clearTimeout(timer); }
    }
    throw new Error(lastErr);
  }
  async function load() {
    state.status = 'loading'; render();
    try {
      const text = await fetchTab(D.sheet.tabs.cards);
      state.all = E.cards(E.parseCSV(text), D.columns); state.source = 'sheet'; state.status = 'ok'; state.error = '';
    } catch (e) {
      state.all = E.cards(E.parseCSV(DDB_SAMPLE_CSV), D.columns); state.source = 'sample'; state.status = 'offline'; state.error = e.message;
    }
    render();
  }
  window.DigDigBoomUI = { state, load, render: () => render() };

  // ---------------- icons ----------------
  const ic = (code, extra = '') => `<svg class="ic" viewBox="0 0 24 24" aria-label="${code}"${extra}><use href="#i-${code}"/></svg>`;
  const textHTML = (text) => E.tokens(text, D.iconCodes).map(t => t.t === 'icon' ? ic(t.v) : esc(t.v)).join('');
  const typeIcon = (type, size, color) => `<svg viewBox="0 0 24 24" style="width:${size};height:${size};color:${color}" aria-hidden="true"><use href="#${D.types[type].icon}"/></svg>`;

  // ---------------- text fitting (measured in the browser, at 1 px per unit) ----------------
  const meas = document.createElement('div'); meas.className = 'meas'; document.body.appendChild(meas);

  const fitFont = (html, w, h, lo = 10, hi = 44) => E.largestFitting(s => fitsBox(html, w, h, s), lo, hi, 0.25);
  function fitWidth(text, weight, maxSize, boxW, minSize = 12) {
    meas.style.width = 'auto'; meas.style.whiteSpace = 'nowrap'; meas.style.fontWeight = weight;

    for (; s > minSize; s -= 0.5) { meas.style.fontSize = s + 'px'; meas.textContent = text; if (meas.scrollWidth <= boxW) break; }

  // A card name in a box: one line when it fits at a good size, otherwise two lines split near the middle.
  function nameBlock(name, x, y, w, h, maxSize, minOne, onBand = true) {
    const cls = onBand ? 'name band' : 'name';
    const one = fitWidth(name, 800, maxSize, w, 11);
    if (one >= minOne || !/ /.test(name)) return box(x, y, w, h, cls, `font-size:${u(one)};display:flex;align-items:center`, `<span>${esc(name)}</span>`);
    const words = name.split(' '); let best = 1, bd = 1e9;
    for (let i = 1; i < words.length; i++) { const d = Math.abs(words.slice(0, i).join(' ').length - words.slice(i).join(' ').length); if (d < bd) { bd = d; best = i; } }
    const l1 = words.slice(0, best).join(' '), l2 = words.slice(best).join(' ');
    const sz = Math.min(fitWidth(l1, 800, maxSize * 0.82, w, 11), fitWidth(l2, 800, maxSize * 0.82, w, 11), h / 2 / 0.98 * 0.9);

  // ---------------- round 2: Top Tab refined ----------------
  // The tab is the same as direction B, a little bigger. Art can be standard or compact (compact hands its height to the text).
  // Treasure and Monster cards put what matters — gems worth and damage — in very large type, three ways (stat 1, 2, 3).
  const R2 = {
    art: { standard: { h: 92, textY: 196, textH: 148 }, compact: { h: 62, textY: 166, textH: 178 } },
    textBox: art => ({ w: 213, h: R2.art[art].textH }),

  function tab(c, W) {
    const t = typeColors(c);

    s += box(28, 28, W - 56, 64, 'band', `background:${t.color};--on:${t.on};border-radius:${u(7)}`);
    s += `<svg class="abs" style="left:${u(28)};top:${u(28)};width:${u(W - 56)};height:${u(64)};border-radius:${u(7)}" preserveAspectRatio="none"><rect width="100%" height="100%" fill="url(#${t.pattern})"/></svg>`;
    s += box(33, 36, 46, 46, 'disc', '', typeIcon(c.type, '78%', '#1d1712'));

    s += nameBlock(c.name, 86, 34, nw, 38, 30, 17.5);
    s += box(86, 72, nw, 15, 'typeword band', `font-size:${u(13)}`, esc(c.type));

  const gemIcon = (sz, extra = '') => `<svg viewBox="0 0 24 24" style="width:${u(sz)};height:${u(sz)};flex:none;${extra}"><use href="#i-gem"/></svg>`;
  const dmgIcon = sz => `<svg viewBox="0 0 24 24" style="width:${u(sz)};height:${u(sz)};flex:none"><use href="#i-damage"/></svg>`;

  function buildR2(c, tw, art, stat) {
    const W = 275, a = R2.art[art];

      },
    },
    // E — big type: the least decoration. A thin type bar, a big name, a slim art strip and the biggest text block.
    E: {
      name: 'E · Big Type', tag: 'Portrait · stack downward (bar shows)',
      orient: 'P', W: 275, H: 375, textBox: { w: 213, h: 164 }, overlap: { dx: 0, dy: 54 },
      why: [
        'Everything is sacrificed to the words: a slim 0.35 in type bar (icon, type word, number), a big name, a thin art strip, and a rules block of about 2.1 × 1.6 in, the biggest of the five.',
        'Best for reading at arm\'s length and for long effects. Weakest at a glance when stacked: only the type bar shows, not the name, so you tell cards apart by type and number.',
        'Cards that are all about their stats (Monsters, Geodes) get big numerals and room for full-size art.',
      ],
      build(c, tw) {
        const t = typeColors(c), W = this.W, H = this.H;
        let s = box(0, 0, W, H, '', `background:${t.color}`);
        s += box(22, 22, W - 44, H - 44, 'paper', `border-radius:${u(10)}`);
        s += box(28, 28, W - 56, 36, 'band', `background:${t.color};--on:${t.on};border-radius:${u(7)}`);
        s += `<svg class="abs" style="left:${u(28)};top:${u(28)};width:${u(W - 56)};height:${u(36)};border-radius:${u(7)}" preserveAspectRatio="none"><rect width="100%" height="100%" fill="url(#${t.pattern})"/></svg>`;
        s += box(33, 32, 28, 28, 'disc', '', typeIcon(c.type, '80%', '#1d1712'));
        s += box(68, 40, 120, 14, 'typeword band', `font-size:${u(13)}`, esc(c.type));
        if (c.number !== null) s += box(W - 28 - 4 - 34, 29, 34, 34, 'num', `font-size:${u(22)};border-width:${u(3)};border-color:#1d1712`, String(c.number));
        s += nameBlock(c.name, 31, 70, W - 62, 44, 34, 24, false);
        s += artBox(28, 118, W - 56, 50, c) + (c.type === 'Treasure' || c.type === 'Monster' ? gemChip(W - 28 - 70, 126, c, 0.9) : '');
        s += box(31, 176, 213, 168, 'text', `font-size:${u(tw)}`, textHTMLFor(c));
        return s;
      },
    },
  };
  DIRS.A.textBox = { w: 192, h: 156 }; DIRS.B.textBox = { w: 213, h: 148 }; DIRS.C.textBox = { w: 149, h: 196 }; DIRS.D.textBox = { w: 213, h: 92 }; DIRS.E.textBox = { w: 213, h: 168 };

  // What you would hold: the card cut at the trim line (bleed and guides gone), corners rounded.
  function trimmedEl(dir, c, tw, scale) {
    const d = DIRS[dir], b = C.bleed;
    return `<div style="position:relative;--u:${scale}px;width:${u(d.W - 2 * b)};height:${u(d.H - 2 * b)};overflow:hidden;border-radius:${u(b)};flex:none"><div style="position:absolute;left:${u(-b)};top:${u(-b)}">${cardEl(dir, c, tw, scale, false, true)}</div></div>`;
  }
  function cardEl(dir, c, tw, scale, guides, bare) {
    const d = DIRS[dir], g = state.guides && guides;
    const inset = n => `left:${u(n)};top:${u(n)};right:${u(n)};bottom:${u(n)}`;
    const gd = g ? `<div class="guides"><i class="bleed" style="${inset(0)}"></i><i class="trim" style="${inset(C.bleed)}"></i><i class="safe" style="${inset(C.bleed + C.safe)}"></i></div>` : '';
    return `<div class="card${state.round && !bare ? ' round' : ''}" data-id="${esc(c.id)}" data-dir="${dir}" style="--u:${scale}px;width:${u(d.W)};height:${u(d.H)}" role="img" aria-label="${esc(c.name)}, ${esc(c.type)}${c.number !== null ? ', ' + c.number : ''}. ${esc(c.text)}">${d.build(c, tw)}${gd}</div>`;
  }

  // ---------------- the page ----------------
  function pickLab() {
    const by = Object.fromEntries(state.all.map(c => [c.id, c]));
    let list = D.labIds.map(id => by[id]).filter(Boolean);
    if (list.length < 6) { const have = new Set(list.map(c => c.id)); for (const c of state.all) if (list.length < 6 && !have.has(c.id)) list.push(c); }
    return list;
  }
  function uniformSize(dir) {
    const d = DIRS[dir], pool = state.all.filter(c => c.type !== 'Monster' && c.type !== 'Treasure');
    let best = 44;
    for (const c of pool) best = Math.min(best, fitFont(textHTML(c.text), d.textBox.w, d.textBox.h));
    return best;
  }
  function statusLine() {
    if (state.status === 'loading') return '<span class="status">Reading your sheet…</span>';
    if (state.source === 'sheet') return `<span class="status"><b>Live from your sheet</b> · ${state.all.length} cards read just now</span>`;
    return `<span class="status bad"><b>Could not reach the sheet</b> (${esc(state.error)}). Showing a 6-card design sample only. <button class="chip" data-act="reload">Try again</button></span>`;
  }
  function render() {
    const lab = state.all.length ? pickLab() : [];
    const libLink = /^https?:$/.test(location.protocol) ? `<a class="back" href="${esc(D.library.href)}"><span>‹</span> ${esc(D.library.name)}</a>` : '';
    const scaleFor = d => (d.orient === 'L' ? 1.0 : 1.0) * (Math.min(innerWidth - 40, 1000) < 500 ? 0.78 : 1);
    let html = `<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">${libLink}${statusLine()}</div>
      <h1>${esc(D.title)} — card design, step 1</h1>
      <p class="sub">Three directions on the same six real cards, drawn from your v2.7 sheet. Every card is poker size (2.5 × 3.5 in) with 0.125 in bleed. Type is shown by <b>icon, word, pattern and colour</b>. The rules text is set at one size on every card: the largest that still fits the card with the longest text.</p>
      <div class="bar">
        <button class="chip ${state.guides ? 'on' : ''}" data-act="guides">Print guides</button>
        <button class="chip ${state.overlap ? 'on' : ''}" data-act="overlap">Overlapped row</button>
        <button class="chip ${state.round ? 'on' : ''}" data-act="round">Rounded corners</button>
        ${[['color', 'Colour'], ['gray', 'Greyscale'], ['deut', 'Red-green (deuteranopia)'], ['prot', 'Red-green (protanopia)']].map(([v, t]) => `<button class="chip ${state.view === v ? 'on' : ''}" data-act="view" data-v="${v}">${t}</button>`).join('')}
      </div>`;
    if (!state.all.length) { $app.innerHTML = html; return; }
    const sizes = Object.fromEntries(Object.keys(DIRS).map(k => [k, uniformSize(k)]));
    html += `<table class="cmp"><tr><th></th>${Object.keys(DIRS).map(k => `<th>${DIRS[k].name}</th>`).join('')}</tr>
      <tr><td>Card orientation</td>${Object.keys(DIRS).map(k => `<td>${DIRS[k].orient === 'L' ? 'Landscape' : 'Portrait'}</td>`).join('')}</tr>
      <tr><td>Rules text size (same on every card)</td>${Object.keys(DIRS).map(k => `<td><b>${(sizes[k] * 0.72).toFixed(1)} pt</b></td>`).join('')}</tr>
      <tr><td>Rules text block</td>${Object.keys(DIRS).map(k => `<td>${(DIRS[k].textBox.w / 100).toFixed(2)} × ${(DIRS[k].textBox.h / 100).toFixed(2)} in</td>`).join('')}</tr>
      <tr><td>When overlapped you see</td>${Object.keys(DIRS).map(k => `<td>${{ A: 'icon, name, type, number', B: 'icon, name, type, number', C: 'number, icon, name', D: 'index, name, type', E: 'icon, type word, number (no name)' }[k]}</td>`).join('')}</tr>
      <tr><td>Best at</td>${Object.keys(DIRS).map(k => `<td>${{ A: 'staying close to today', B: 'balance of text and overlap', C: 'sideways Power line, tall text', D: 'cards held any way up', E: 'long effects, reading at arm\'s length' }[k]}</td>`).join('')}</tr></table>`;
    const by0 = Object.fromEntries(state.all.map(c => [c.id, c]));
    html += deckHTML(scaleFor(DIRS.B));
    html += '<details class="round2d"><summary>Round 2 — the stat treatments you chose from</summary>' + round2HTML(by0, scaleFor(DIRS.B)) + '</details>';
    html += '<details class="round1"><summary>Round 1 — the five directions you chose from (A–E)</summary>';
    for (const key of Object.keys(DIRS)) {
      const d = DIRS[key], tw = uniformSize(key), s = scaleFor(d) * 1.0;
      const longest = state.all.filter(c => c.type !== 'Monster' && c.type !== 'Treasure').reduce((a, c) => (!a || c.text.length > a.text.length ? c : a), null);
      const cells = lab.map(c => `<div class="cell">${state.guides ? cardEl(key, c, tw, s, true) : trimmedEl(key, c, tw, s)}<span class="cap">${esc(c.id)} · ${esc(c.type)}</span></div>`).join('');
      const fan = state.overlap ? (() => {
        const n = lab.length, dx = d.overlap.dx * s, dy = d.overlap.dy * s, w = (d.W - 2 * C.bleed) * s, h = (d.H - 2 * C.bleed) * s;
        const inner = lab.map((c, i) => `<div style="position:absolute;left:${i * dx}px;top:${i * dy}px;box-shadow:0 2px 8px rgba(0,0,0,.5);border-radius:${12.5 * s}px">${trimmedEl(key, c, tw, s)}</div>`).join('');
        return `<h3 style="margin:16px 0 4px;font-size:16px">The same cards overlapped in a row <span class="cap">(cut to size; ${d.overlap.dy ? 'stacked downward, each card showing its top ' + (d.overlap.dy / 100).toFixed(2) + ' in' : 'fanned sideways, each card showing its left ' + (d.overlap.dx / 100).toFixed(2) + ' in'}) — can you still read type, name and number?</span></h3>
          <div class="fan" style="width:${(n - 1) * dx + w}px;height:${(n - 1) * dy + h}px">${inner}</div>`;
      })() : '';
      html += `<section class="dir" data-dir="${key}"><span class="tag">${esc(d.tag)}</span><h2>${esc(d.name)}</h2>
        <ul class="why">${d.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul>
        <p class="sub">Rules text: <b>${E.formatSize(tw)}</b> on every card — set by the longest card (${esc(state.all.filter(c => c.type !== 'Monster' && c.type !== 'Treasure').reduce((a, c) => (!a || c.text.length > a.text.length ? c : a), null).name)}).</p>
        <div class="row">${cells}</div>${fan}</section>`;
    }
    html += '</details>';
    const qs = E.questions(state.all);
    html += `<details><summary>Questions already written in your sheet (${qs.length})</summary><ul class="qs">${qs.map(q => `<li><b>${esc(q.name)}</b> (${esc(q.id)}): ${esc(q.q)}</li>`).join('')}</ul></details>
      <details><summary>Icon key</summary><p class="sub">${Object.keys(D.iconCodes).map(k => `${ic(k, ' style="width:28px;height:28px;vertical-align:middle"')} {${k}}`).join(' &nbsp; ')}</p></details>`;
    html += `<p class="status" style="margin-top:24px">Version ${esc(BUILD)}</p>`;
    $app.className = 'view-' + state.view;
    $app.innerHTML = html;
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act;
    if (a === 'guides') state.guides = !state.guides;
    else if (a === 'overlap') state.overlap = !state.overlap;
    else if (a === 'round') state.round = !state.round;
    else if (a === 'view') state.view = el.dataset.v;
    else if (a === 'reload') { load(); return; }
    render();
  });
  let lastW = innerWidth;
  window.addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 2) return; lastW = innerWidth; clearTimeout(window.__rz); window.__rz = setTimeout(render, 150); });     // (width only: a tall screenshot changes the height)
  load();
})();
</script>
</body>
</html>
