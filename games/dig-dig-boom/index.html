/* ---------- the cards ----------
   Every card is drawn on a grid of hundredths of an inch (275 x 375 portrait, 375 x 275 landscape: 2.5 x 3.5 in poker size plus
   0.125 in bleed all round). --u is how many screen pixels one unit is. Positions are computed in the script. */
.card { position: relative; overflow: hidden; border-radius: 0; background: var(--ink-bg, #fff); color: #1d1712; font-family: "Avenir Next", "Helvetica Neue", Arial, system-ui, sans-serif; flex: none; }
.card.round { border-radius: calc(var(--u) * 12.5); }
.card .abs { position: absolute; }
.card .paper { background: #fffaf0; }
.card .band { color: var(--on, #fff); }
.card .name { font-weight: 800; line-height: 1; white-space: nowrap; letter-spacing: -.01em; }
.card .typeword { font-weight: 800; letter-spacing: .12em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
.card .text { font-weight: 600; line-height: 1.13; color: #1d1712; overflow: hidden; }
.card .text .ic, .meas .ic { display: inline-block; width: 1.12em; height: 1.12em; vertical-align: -.2em; margin: 0 .04em; }
.card .stat { font-weight: 900; line-height: 1.05; }
.card .art { border-radius: calc(var(--u) * 7); background: repeating-linear-gradient(135deg, #e9dfc9 0 calc(var(--u)*6), #f6efdf calc(var(--u)*6) calc(var(--u)*12)); border: calc(var(--u) * 1.5) solid rgba(0,0,0,.28); display: flex; align-items: center; justify-content: center; color: rgba(0,0,0,.35); font-weight: 800; letter-spacing: .2em; }
.card .art svg { width: 62%; height: 62%; opacity: .55; }
.card .num { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #fffaf0; color: #1d1712; font-weight: 900; border-style: solid; }
.card .disc { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #fffaf0; }
.card .disc svg { width: 72%; height: 72%; }
.guides { position: absolute; inset: 0; pointer-events: none; }

.guides .trim { border: 1.5px dashed #ff2d55; }
.guides .safe { border: 1.5px dashed #00b86b; }

<script id="engine">
/* =====================================================================
   ENGINE — no DOM. Sheet text -> rows -> cards; card text -> tokens; fitting arithmetic.
   ===================================================================== */
const Engine = (() => {
  // RFC-4180 CSV: quoted fields, doubled quotes, newlines inside quotes. (\u0001 stands for a comma inside the design-time sample.)
  function parseCSV(text) {
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f.length || row.length) { row.push(f); rows.push(row); }
    return rows.filter(r => r.some(x => x !== ''));
  }
  // rows -> objects keyed by header, then -> cards
  function table(rows) {
    const head = rows[0].map(h => h.trim());
    return rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] === undefined ? '' : r[i]).replace(/\u0001/g, ',')])));
  }
  function cards(rows, cols) {
    return table(rows).filter(r => r[cols.id] && r[cols.name]).map(r => ({
      id: r[cols.id].trim(), name: r[cols.name].trim(), type: r[cols.type].trim(),
      number: r[cols.number] === '' || r[cols.number] === undefined ? null : Number(r[cols.number]),
      deck: r[cols.deck].trim(), count: Number(r[cols.count]) || 1, text: r[cols.text].trim(),
      trigger: (r[cols.trigger] || '').trim(), note: (r[cols.notes] || '').trim(), raw: r,
    }));
  }
  const questions = list => list.filter(c => /^question:/i.test(c.note)).map(c => ({ id: c.id, name: c.name, q: c.note.replace(/^question:\s*/i, '') }));
  // "+1 {reroll}. When dug, +2 {grit}" -> [{t:'text',v:'+1 '},{t:'icon',v:'reroll'},...]
  function tokens(text, iconCodes) {
    const out = []; const re = /\{(\w+)\}/g; let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) out.push({ t: 'text', v: text.slice(last, m.index) });
      out.push(iconCodes[m[1]] ? { t: 'icon', v: m[1] } : { t: 'text', v: m[0] });
      last = m.index + m[0].length;
    }
    if (last < text.length) out.push({ t: 'text', v: text.slice(last) });
    return out;
  }
  // Largest value in [lo, hi] (steps of `step`) for which fits(v) is true. fits must be monotone: true for small values.
  function largestFitting(fits, lo, hi, step = 0.25) {
    let a = Math.round(lo / step), b = Math.round(hi / step);
    if (!fits(a * step)) return a * step;
    while (a < b) { const mid = Math.ceil((a + b) / 2); if (fits(mid * step)) a = mid; else b = mid - 1; }
    return a * step;
  }
  // "{damage} 1 → 3 → 5 → 7" -> [1, 3, 5, 7]   (null when the text is not a damage ladder)
  function damageSteps(text) {
    const m = /^\s*\{damage\}\s*([\d\s→>,\-]+)$/.exec(text);
    if (!m) return null;
    const nums = m[1].split(/[^\d]+/).filter(Boolean).map(Number);
    return nums.length ? nums : null;
  }
  // "1 {gem}" -> 1   (how many gems a Treasure card is worth)
  const gemWorth = text => { const m = /^\s*(\d+)\s*\{gem\}\s*$/.exec(text); return m ? Number(m[1]) : null; };
  const formatSize = u => (u / 100).toFixed(2) + ' in (' + (u * 0.01 * 72).toFixed(1) + ' pt)';
  return { parseCSV, table, cards, questions, tokens, largestFitting, damageSteps, gemWorth, formatSize };
})();
</script>

          let inner = c.number !== null ? box(0, 0, 44, 44, 'num', `font-size:${u(28)};border-width:${u(4)};border-color:#1d1712`, String(c.number)) + box(2, 48, 40, 40, 'disc', `background:${t.color};color:${t.on}`, typeIcon(c.type, '78%', t.on))
            : box(0, 0, 44, 44, 'disc', `background:${t.color};border:${u(3)} solid #1d1712`, typeIcon(c.type, '80%', t.on));
          return box(x, y, 44, c.number !== null ? 88 : 44, '', `transform:rotate(${rot}deg)`, inner);
        };
        let s = box(0, 0, W, H, '', `background:${t.color}`);
        s += box(22, 22, W - 44, H - 44, 'paper', `border-radius:${u(10)}`);
        s += box(28, 28, W - 56, 3, '', `background:${t.color}`);
        s += index(32, 34, 0);
        s += nameBlock(c.name, 86, 34, W - 28 - 86, 40, 26, 17, false);
        s += box(86, 78, W - 28 - 86, 14, 'typeword', `font-size:${u(11)};color:#5b4d3e`, esc(c.type));
        s += artBox(28, 126, W - 56, 82, c) + gemChip(34, 172, c, 0.95);
        s += box(31, 214, 213, 92, 'text', `font-size:${u(tw)}`, textHTMLFor(c));
        s += index(W - 28 - 44, H - 28 - (c.number !== null ? 88 : 44), 180);
        return s;
      },
    },
    // E — big type: the least decoration. A thin type bar, a big name, a slim art strip and the biggest text block.
    E: {
      name: 'E · Big Type', tag: 'Portrait · stack downward (bar shows)',
      orient: 'P', W: 275, H: 375, textBox: { w: 213, h: 164 }, overlap: { dx: 0, dy: 54 },
      why: [
        'Everything is sacrificed to the words: a slim 0.35 in type bar (icon, type word, number), a big name, a thin art strip, and a rules block of about 2.1 × 1.6 in, the biggest of the five.',
        'Best for reading at arm\'s length and for long effects. Weakest at a glance when stacked: only the type bar shows, not the name, so you tell cards apart by type and number.',
        'Cards that are all about their stats (Monsters, Geodes) get big numerals and room for full-size art.',
      ],
      build(c, tw) {
        const t = typeColors(c), W = this.W, H = this.H;
        let s = box(0, 0, W, H, '', `background:${t.color}`);
        s += box(22, 22, W - 44, H - 44, 'paper', `border-radius:${u(10)}`);
        s += box(28, 28, W - 56, 36, 'band', `background:${t.color};--on:${t.on};border-radius:${u(7)}`);
        s += `<svg class="abs" style="left:${u(28)};top:${u(28)};width:${u(W - 56)};height:${u(36)};border-radius:${u(7)}" preserveAspectRatio="none"><rect width="100%" height="100%" fill="url(#${t.pattern})"/></svg>`;
        s += box(33, 32, 28, 28, 'disc', '', typeIcon(c.type, '80%', '#1d1712'));
        s += box(68, 40, 120, 14, 'typeword band', `font-size:${u(13)}`, esc(c.type));
        if (c.number !== null) s += box(W - 28 - 4 - 34, 29, 34, 34, 'num', `font-size:${u(22)};border-width:${u(3)};border-color:#1d1712`, String(c.number));
        s += nameBlock(c.name, 31, 70, W - 62, 44, 34, 24, false);
        s += artBox(28, 118, W - 56, 50, c) + (c.type === 'Treasure' || c.type === 'Monster' ? gemChip(W - 28 - 70, 126, c, 0.9) : '');
        s += box(31, 176, 213, 168, 'text', `font-size:${u(tw)}`, textHTMLFor(c));
        return s;
      },
    },
  };
  DIRS.A.textBox = { w: 192, h: 156 }; DIRS.B.textBox = { w: 213, h: 148 }; DIRS.C.textBox = { w: 149, h: 196 }; DIRS.D.textBox = { w: 213, h: 92 }; DIRS.E.textBox = { w: 213, h: 168 };

  // What you would hold: the card cut at the trim line (bleed and guides gone), corners rounded.
  function trimmedEl(dir, c, tw, scale) {
    const d = DIRS[dir], b = C.bleed;
    return `<div style="position:relative;--u:${scale}px;width:${u(d.W - 2 * b)};height:${u(d.H - 2 * b)};overflow:hidden;border-radius:${u(b)};flex:none"><div style="position:absolute;left:${u(-b)};top:${u(-b)}">${cardEl(dir, c, tw, scale, false, true)}</div></div>`;
  }
  function cardEl(dir, c, tw, scale, guides, bare) {
    const d = DIRS[dir], g = state.guides && guides;
    const inset = n => `left:${u(n)};top:${u(n)};right:${u(n)};bottom:${u(n)}`;
    const gd = g ? `<div class="guides"><i class="bleed" style="${inset(0)}"></i><i class="trim" style="${inset(C.bleed)}"></i><i class="safe" style="${inset(C.bleed + C.safe)}"></i></div>` : '';
    return `<div class="card${state.round && !bare ? ' round' : ''}" data-id="${esc(c.id)}" data-dir="${dir}" style="--u:${scale}px;width:${u(d.W)};height:${u(d.H)}" role="img" aria-label="${esc(c.name)}, ${esc(c.type)}${c.number !== null ? ', ' + c.number : ''}. ${esc(c.text)}">${d.build(c, tw)}${gd}</div>`;
  }

  // ---------------- the page ----------------
  function pickLab() {
    const by = Object.fromEntries(state.all.map(c => [c.id, c]));
    let list = D.labIds.map(id => by[id]).filter(Boolean);
    if (list.length < 6) { const have = new Set(list.map(c => c.id)); for (const c of state.all) if (list.length < 6 && !have.has(c.id)) list.push(c); }
    return list;
  }
  function uniformSize(dir) {
    const d = DIRS[dir], pool = state.all.filter(c => c.type !== 'Monster' && c.type !== 'Treasure');
    let best = 44;
    for (const c of pool) best = Math.min(best, fitFont(textHTML(c.text), d.textBox.w, d.textBox.h));
    return best;
  }
  function statusLine() {
    if (state.status === 'loading') return '<span class="status">Reading your sheet…</span>';
    if (state.source === 'sheet') return `<span class="status"><b>Live from your sheet</b> · ${state.all.length} cards read just now</span>`;
    return `<span class="status bad"><b>Could not reach the sheet</b> (${esc(state.error)}). Showing a 6-card design sample only. <button class="chip" data-act="reload">Try again</button></span>`;
  }
  function render() {
    const lab = state.all.length ? pickLab() : [];
    const libLink = /^https?:$/.test(location.protocol) ? `<a class="back" href="${esc(D.library.href)}"><span>‹</span> ${esc(D.library.name)}</a>` : '';
    const scaleFor = d => (d.orient === 'L' ? 1.0 : 1.0) * (Math.min(innerWidth - 40, 1000) < 500 ? 0.78 : 1);
    let html = `<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">${libLink}${statusLine()}</div>
      <h1>${esc(D.title)} — card design, step 1</h1>
      <p class="sub">Three directions on the same six real cards, drawn from your v2.7 sheet. Every card is poker size (2.5 × 3.5 in) with 0.125 in bleed. Type is shown by <b>icon, word, pattern and colour</b>. The rules text is set at one size on every card: the largest that still fits the card with the longest text.</p>
      <div class="bar">
        <button class="chip ${state.guides ? 'on' : ''}" data-act="guides">Print guides</button>
        <button class="chip ${state.overlap ? 'on' : ''}" data-act="overlap">Overlapped row</button>
        <button class="chip ${state.round ? 'on' : ''}" data-act="round">Rounded corners</button>
        ${[['color', 'Colour'], ['gray', 'Greyscale'], ['deut', 'Red-green (deuteranopia)'], ['prot', 'Red-green (protanopia)']].map(([v, t]) => `<button class="chip ${state.view === v ? 'on' : ''}" data-act="view" data-v="${v}">${t}</button>`).join('')}
      </div>`;
    if (!state.all.length) { $app.innerHTML = html; return; }
    const sizes = Object.fromEntries(Object.keys(DIRS).map(k => [k, uniformSize(k)]));
    html += `<table class="cmp"><tr><th></th>${Object.keys(DIRS).map(k => `<th>${DIRS[k].name}</th>`).join('')}</tr>
      <tr><td>Card orientation</td>${Object.keys(DIRS).map(k => `<td>${DIRS[k].orient === 'L' ? 'Landscape' : 'Portrait'}</td>`).join('')}</tr>
      <tr><td>Rules text size (same on every card)</td>${Object.keys(DIRS).map(k => `<td><b>${(sizes[k] * 0.72).toFixed(1)} pt</b></td>`).join('')}</tr>
      <tr><td>Rules text block</td>${Object.keys(DIRS).map(k => `<td>${(DIRS[k].textBox.w / 100).toFixed(2)} × ${(DIRS[k].textBox.h / 100).toFixed(2)} in</td>`).join('')}</tr>
      <tr><td>When overlapped you see</td>${Object.keys(DIRS).map(k => `<td>${{ A: 'icon, name, type, number', B: 'icon, name, type, number', C: 'number, icon, name', D: 'index, name, type', E: 'icon, type word, number (no name)' }[k]}</td>`).join('')}</tr>
      <tr><td>Best at</td>${Object.keys(DIRS).map(k => `<td>${{ A: 'staying close to today', B: 'balance of text and overlap', C: 'sideways Power line, tall text', D: 'cards held any way up', E: 'long effects, reading at arm\'s length' }[k]}</td>`).join('')}</tr></table>`;
    const by0 = Object.fromEntries(state.all.map(c => [c.id, c]));
    html += deckHTML(scaleFor(DIRS.B));
    html += '<details class="round2d"><summary>Round 2 — the stat treatments you chose from</summary>' + round2HTML(by0, scaleFor(DIRS.B)) + '</details>';
    html += '<details class="round1"><summary>Round 1 — the five directions you chose from (A–E)</summary>';
    for (const key of Object.keys(DIRS)) {
      const d = DIRS[key], tw = uniformSize(key), s = scaleFor(d) * 1.0;
      const longest = state.all.filter(c => c.type !== 'Monster' && c.type !== 'Treasure').reduce((a, c) => (!a || c.text.length > a.text.length ? c : a), null);
      const cells = lab.map(c => `<div class="cell">${state.guides ? cardEl(key, c, tw, s, true) : trimmedEl(key, c, tw, s)}<span class="cap">${esc(c.id)} · ${esc(c.type)}</span></div>`).join('');
      const fan = state.overlap ? (() => {
        const n = lab.length, dx = d.overlap.dx * s, dy = d.overlap.dy * s, w = (d.W - 2 * C.bleed) * s, h = (d.H - 2 * C.bleed) * s;
        const inner = lab.map((c, i) => `<div style="position:absolute;left:${i * dx}px;top:${i * dy}px;box-shadow:0 2px 8px rgba(0,0,0,.5);border-radius:${12.5 * s}px">${trimmedEl(key, c, tw, s)}</div>`).join('');
        return `<h3 style="margin:16px 0 4px;font-size:16px">The same cards overlapped in a row <span class="cap">(cut to size; ${d.overlap.dy ? 'stacked downward, each card showing its top ' + (d.overlap.dy / 100).toFixed(2) + ' in' : 'fanned sideways, each card showing its left ' + (d.overlap.dx / 100).toFixed(2) + ' in'}) — can you still read type, name and number?</span></h3>
          <div class="fan" style="width:${(n - 1) * dx + w}px;height:${(n - 1) * dy + h}px">${inner}</div>`;
      })() : '';
      html += `<section class="dir" data-dir="${key}"><span class="tag">${esc(d.tag)}</span><h2>${esc(d.name)}</h2>
        <ul class="why">${d.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul>
        <p class="sub">Rules text: <b>${E.formatSize(tw)}</b> on every card — set by the longest card (${esc(state.all.filter(c => c.type !== 'Monster' && c.type !== 'Treasure').reduce((a, c) => (!a || c.text.length > a.text.length ? c : a), null).name)}).</p>
        <div class="row">${cells}</div>${fan}</section>`;
    }
    html += '</details>';
    const qs = E.questions(state.all);
    html += `<details><summary>Questions already written in your sheet (${qs.length})</summary><ul class="qs">${qs.map(q => `<li><b>${esc(q.name)}</b> (${esc(q.id)}): ${esc(q.q)}</li>`).join('')}</ul></details>
      <details><summary>Icon key</summary><p class="sub">${Object.keys(D.iconCodes).map(k => `${ic(k, ' style="width:28px;height:28px;vertical-align:middle"')} {${k}}`).join(' &nbsp; ')}</p></details>`;
    html += `<p class="status" style="margin-top:24px">Version ${esc(BUILD)}</p>`;
    $app.className = 'view-' + state.view;
    $app.innerHTML = html;
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act;
    if (a === 'guides') state.guides = !state.guides;
    else if (a === 'overlap') state.overlap = !state.overlap;
    else if (a === 'round') state.round = !state.round;
    else if (a === 'view') state.view = el.dataset.v;
    else if (a === 'reload') { load(); return; }
    render();
  });
  let lastW = innerWidth;
  window.addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 2) return; lastW = innerWidth; clearTimeout(window.__rz); window.__rz = setTimeout(render, 150); });     // (width only: a tall screenshot changes the height)
  load();
})();
</script>
</body>
</html>
