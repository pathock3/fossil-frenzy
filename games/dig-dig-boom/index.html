<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dig Dig BOOM!">
<meta name="build" content="__BUILD__">
<meta name="theme-color" content="#1c1410">
<title>Dig Dig BOOM!</title>
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<style>
:root { --bg: #1c1410; --panel: #2a1f18; --line: #4b3a2c; --text: #f4ead8; --dim: #c4b49c; --accent: #ffb13b; --good: #52d28a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
body { padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 40px max(14px, env(safe-area-inset-left)); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
a { color: var(--accent); }
h1 { margin: 6px 0 2px; font-size: clamp(26px, 5vw, 40px); }
h2 { margin: 0 0 4px; font-size: 22px; }
.sub { color: var(--dim); margin: 0 0 12px; font-size: 15px; line-height: 1.4; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 18px; }
.chip { min-height: 44px; padding: 8px 14px; border-radius: 99px; background: var(--panel); border: 2px solid var(--line); font-weight: 700; font-size: 15px; }
.chip.on { border-color: var(--accent); background: #4a3418; }
.status { font-size: 13px; color: var(--dim); }
.status b { color: var(--good); }
.status.bad b { color: #ff7a6b; }
.back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 16px 8px 12px; border-radius: 99px; background: var(--panel); border: 2px solid var(--accent); font-weight: 800; text-decoration: none; color: var(--text); }
.back span { color: var(--accent); font-size: 22px; line-height: 1; }
.dir { margin: 0 0 34px; padding: 16px; border-radius: 18px; background: var(--panel); border: 2px solid var(--line); }
.dir .why { margin: 0 0 12px; padding-left: 20px; font-size: 15px; line-height: 1.45; }
.dir .why li { margin: 3px 0; }
.h3 { margin: 18px 0 6px; font-size: 17px; }
.dir .tag { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.cell { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.cap { font-size: 12px; color: var(--dim); }
.fan { position: relative; margin: 6px 0 4px; }
.fan .card { position: absolute; }
.qs { font-size: 14px; line-height: 1.45; }
.qs li { margin: 4px 0; }
details { margin: 10px 0; }
summary { cursor: pointer; font-weight: 700; padding: 8px 0; }

/* ---------- the cards ----------
   Every card is drawn on a grid of hundredths of an inch (275 x 375 portrait, 375 x 275 landscape: 2.5 x 3.5 in poker size plus
   0.125 in margin all round). --u is how many screen pixels one unit is. Positions are computed in the script. */
.card { position: relative; overflow: hidden; border-radius: 0; background: var(--ink-bg, #fff); color: #1d1712; font-family: "Avenir Next", "Helvetica Neue", Arial, system-ui, sans-serif; flex: none; }
.card.round { border-radius: calc(var(--u) * 12.5); }
.card .abs { position: absolute; }
.card .paper { background: #fffaf0; }
.card .band { color: var(--on, #fff); }
.card .name { font-weight: 800; line-height: 1; white-space: nowrap; letter-spacing: -.01em; }
.card .name, .card .typeword { text-align: left; }
.card .typeword { opacity: .9; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
.card .text { font-weight: 600; line-height: 1.13; color: #1d1712; overflow: hidden; text-wrap: balance; }
.card .text .ic, .meas .ic { display: inline-block; width: 1.12em; height: 1.12em; vertical-align: -.2em; margin: 0 .04em; }
.card .stat { font-weight: 900; line-height: 1.05; }
.card .art { border-radius: calc(var(--u) * 7); background: repeating-linear-gradient(135deg, #e9dfc9 0 calc(var(--u)*6), #f6efdf calc(var(--u)*6) calc(var(--u)*12)); border: calc(var(--u) * 1.5) solid rgba(0,0,0,.28); display: flex; align-items: center; justify-content: center; color: rgba(0,0,0,.35); font-weight: 800; letter-spacing: .2em; }
.card .art svg { width: 62%; height: 62%; opacity: .55; }
.card .art.vivid { position: absolute; overflow: hidden; }
.card .art.vivid svg { opacity: 1; }
.card .gemtile .sp { position: absolute; color: #fff; line-height: 1; letter-spacing: 0; text-shadow: 0 0 calc(var(--u) * 4) rgba(255,255,255,.9); opacity: .9; }
.card .art .sp { position: absolute; color: #fff; font-size: calc(var(--u) * 16); line-height: 1; letter-spacing: 0; text-shadow: 0 0 calc(var(--u) * 4) rgba(255,255,255,.9); opacity: .9; }
.card .num { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #fffaf0; color: #1d1712; font-weight: 900; border-style: solid; }
.card .disc { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #fffaf0; }
.card .disc svg { width: 72%; height: 72%; }
table.cmp { width: 100%; border-collapse: collapse; margin: 0 0 22px; font-size: 14px; }
table.cmp th, table.cmp td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
table.cmp th { background: var(--panel); color: var(--accent); }
.view-gray .card { filter: grayscale(1); }
.view-deut .card { filter: url(#deut); }
.view-prot .card { filter: url(#prot); }
.meas { position: absolute; left: -9999px; top: 0; visibility: hidden; font-weight: 600; line-height: 1.13; font-family: "Avenir Next", "Helvetica Neue", Arial, system-ui, sans-serif; }
/* ---------- the game screen (solo Dig) ---------- */
body[data-mode=play] #app, body[data-mode=cards] #play { display: none; }
body[data-mode=play] { padding: 0; height: 100vh; height: 100dvh; overflow: hidden; position: fixed; inset: 0; width: 100%; }
#play { height: 100%; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#play .pbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; flex: none; }
#play .pbar .chip { padding: 6px 12px; font-size: 14px; }
#play .pbar .back { min-height: 44px; padding: 6px 12px 6px 8px; font-size: 14px; }
#play .pmain { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 0 10px 10px; }
#play .ptable { min-height: 0; display: flex; flex-direction: column; gap: 8px; position: relative; }
#play .drill { display: flex; gap: 10px; flex: none; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; }
#play .tracks { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
#play .trow { display: flex; align-items: center; gap: 8px; }
#play .tlab { width: 34px; height: 34px; flex: none; display: flex; align-items: center; justify-content: center; }
#play .tlab svg { width: 30px; height: 30px; }
#play .tbody { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; --col: calc((100% - 40px) / 11); }       /* Health has 11 spaces; Rerolls use the same column width, so 0, 3, 6 line up in all three rows */
#play .track { flex: none; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); width: calc(var(--col) * var(--n) + 3px * (var(--n) - 1) + 10px); gap: 3px; border-radius: 10px; padding: 2px; border: 3px solid transparent; min-width: 0; }
#play .track.live { border-color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(255,177,59,.35); } }
#play .tc { height: 34px; border-radius: 7px; background: #fffaf0; color: #1d1712; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--tc, #888); opacity: .55; }
#play .tc.lit { opacity: 1; background: color-mix(in srgb, var(--tc) 30%, #fffaf0); }
#play .tc.now { opacity: 1; background: var(--tc); color: #fff; font-size: 20px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
#play .piece { position: relative; border-radius: 9px; border: 3px solid var(--c); background: #fffaf0; color: #1d1712; text-align: left; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; width: 100%; }
#play .piece .h { background: var(--c); color: var(--on); font-weight: 800; font-size: 13px; line-height: 1.1; padding: 3px 6px; display: flex; align-items: center; gap: 5px; }
#play .piece .h svg { width: 15px; height: 15px; flex: none; }
#play .piece .h .n { margin-left: auto; background: #fffaf0; color: #1d1712; border-radius: 99px; min-width: 22px; text-align: center; padding: 0 4px; font-size: 13px; }
#play .piece .t { display: block; font-size: 13px; font-weight: 600; line-height: 1.2; padding: 3px 6px 4px; }
#play .piece .ic { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -.2em; }
#play .piece.pick { outline: 4px solid var(--accent); animation: pulse 1.2s ease-in-out infinite; }
#play .piece.trig { box-shadow: 0 0 0 3px #fff, 0 0 12px 4px var(--accent); }
#play .piece.elig { box-shadow: 0 0 0 3px #fff, 0 0 12px 4px var(--accent); animation: pulse 1.2s ease-in-out infinite; }
#play .piece.done { opacity: .6; }
#play .piece .h .tg { margin-left: auto; font-size: 12px; font-weight: 800; background: #1d1712; color: #fff; border-radius: 6px; padding: 1px 5px; white-space: nowrap; }
#play .stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
#play .gemline { display: flex; align-items: center; gap: 4px; font-size: 24px; color: #fff; }
#play .gemline svg { width: 26px; height: 26px; }
#play .mcard { display: block; border-radius: 12px; flex: none; position: relative; }
#play .mcard.live { outline: 4px solid var(--accent); outline-offset: 3px; animation: pulse 1.2s ease-in-out infinite; }
#play .calc { text-align: center; font-size: 15px; line-height: 1.35; color: var(--dim); }
#play .calc b { color: #fff; font-size: 34px; display: block; line-height: 1; }
#play .calcparts { display: block; font-size: 13px; margin-top: 2px; }
#play .hint { font-size: 13px; color: var(--accent); text-align: center; line-height: 1.3; font-weight: 700; }
#play .over { position: absolute; inset: 0; z-index: 5; background: #1c1410; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; }
#play .over h2 { font-size: 46px; margin: 0; }
#play .over .ic, #play .calc .ic, #play .hint .ic { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -.2em; }
#play .over.boom h2 { color: #ff5b4a; }
#play .over .big { font-size: 22px; line-height: 1.5; }
#play .over .row2 { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
#play .btn { min-height: 56px; padding: 12px 22px; border-radius: 14px; background: var(--accent); color: #1c1410; font-weight: 900; font-size: 18px; }
#play .btn.alt { background: var(--panel); color: var(--text); border: 2px solid var(--line); }
#play .zoom { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
#play .zoom .closehint { color: #fff; opacity: .75; font-size: 14px; }
#play .zoom .warn { color: #ffb4a8; font-size: 14px; max-width: 340px; text-align: center; }
#play .panel { position: fixed; inset: 0; z-index: 15; background: var(--bg); display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) 14px 10px; }
#play .panel.setup { position: static; flex: 1; min-height: 0; z-index: auto; padding: 0 14px 10px; }
#play .panel h2 { margin: 4px 0; font-size: 24px; }
#play .panel .scroll { flex: 1; overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 0 12px; }
#play .tabs { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; align-items: center; }
#play .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
#play .grid .piece { min-height: 70px; }
#play .piece.off { opacity: .45; }
#play .grid .piece.sel { outline: 4px solid var(--accent); background: #fff0c8; }
#play .grid .piece .t { font-size: 14px; }
#play .grid .piece .h { font-size: 15px; }
#play .stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--panel); border: 2px solid var(--line); border-radius: 99px; padding: 2px; }
#play .stepper button { width: 44px; height: 44px; border-radius: 99px; font-size: 22px; font-weight: 900; background: #3a2b20; }
#play .stepper span { min-width: 34px; text-align: center; font-weight: 800; }
#play .foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 8px; border-top: 1px solid var(--line); }
#play .note { font-size: 13px; color: var(--dim); line-height: 1.4; }
#play .helptxt { font-size: 15px; line-height: 1.5; max-width: 760px; }
#play .helptxt li { margin: 4px 0; }
#play .btn:disabled { opacity: .4; }
#play .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin: 10px 0; max-width: 900px; }
#play .bigopt { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
#play .bigopt .btn { min-height: 64px; font-size: 22px; }
#play .lb { flex: none; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 5px 8px 6px; }
#play .lbhead { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); padding: 0 2px 3px; flex-wrap: wrap; }
#play .lbcells { display: grid; gap: 3px; }
#play .lbc { min-height: 48px; border-radius: 8px; background: rgba(255,255,255,.06); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 2px 0; color: var(--dim); min-width: 0; }
#play .lbc.free { background: rgba(255,255,255,.1); }
#play .lbc.here { border-color: #fff; background: rgba(255,255,255,.2); color: #fff; }
#play .lbc .ln { font-weight: 800; font-size: 14px; }
#play .lbc .lm { display: flex; align-items: center; justify-content: center; gap: 3px; min-height: 22px; }
#play .mk { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; font-size: 10px; font-style: normal; font-weight: 900; color: #1d1712; }
#play .mk.best { background: var(--pc, var(--accent)); border: 2px solid rgba(0,0,0,.45); }
#play .mk.here { width: 0; height: 0; border-radius: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid #fff; }
#play .mk.pledge { border: 3px solid var(--pc, #fff); background: transparent; color: #fff; }
#play .ailine { font-size: 13px; color: var(--dim); padding: 3px 2px 0; }
#play .lbc .lm { flex-wrap: wrap; }
#play .crownmk { font-size: 22px; line-height: 1; color: #c9a227; font-weight: 400; }
#play .crownmk.mine { color: #ffd54a; text-shadow: 0 0 8px #ffb13b; }
#play .pstep { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; margin: 10px 0; max-width: 900px; }
#play .pstep.live { border-color: var(--accent); }
#play .pstep h3 { margin: 0 0 4px; font-size: 17px; }
#play .pstep p { margin: 4px 0; }
#play .ladder { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--dim); margin: 6px 0; }
#play .ladder .cur { color: var(--accent); font-weight: 800; }
#play table.cmp { max-width: 700px; }
@media (max-aspect-ratio: 1/1) {                       /* iPad held upright: the log goes under the table */
  #play .ongoing { width: 180px; }
}
#play .menu .btn.alt { }
#play .menu .confirm { background: #a8201f; color: #fff; }
@media (max-height: 780px) { #play .over { gap: 5px; padding: 6px 12px; overflow-y: auto; } #play .over h2 { font-size: 30px; } #play .over .big { font-size: 16px; line-height: 1.3; } #play .over .btn { min-height: 46px; padding: 8px 18px; font-size: 16px; } }
@media (max-height: 640px) { #play .tc { height: 28px; } #play .lbc { min-height: 42px; } #play .cardback { width: 64px; height: 90px; } }

/* ---------- the look: a lively cave, bright pieces, things that pop (nothing here ever waits for or delays a tap) ---------- */
body[data-mode=play] { background: radial-gradient(130% 75% at 50% -10%, #74401e 0%, #3a2211 36%, #1b120c 80%) fixed; }
#play .drill, #play .line, #play .lb, #play .dig { position: relative; background: radial-gradient(90% 110% at 50% 0%, rgba(255,177,59,.13), rgba(255,255,255,.02) 70%); border-color: #5d4631; }
#play .pile.bankp.live { background: linear-gradient(180deg, rgba(255,177,59,.32), rgba(47,134,192,.12)); }
#play .piece:not(.elig):not(.trig) { box-shadow: 0 2px 0 rgba(0,0,0,.4), 0 5px 8px rgba(0,0,0,.25); }
#play .piece .h { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 72%, #fff), var(--c) 70%); text-shadow: 0 1px 0 rgba(0,0,0,.18); }
#play .piece .h svg[style*="--g"] { filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
#play .tc.now { box-shadow: 0 0 12px var(--tc), inset 0 1px 0 rgba(255,255,255,.35); }
#play .tc.lit { background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 22%, #fffaf0), color-mix(in srgb, var(--tc) 38%, #fffaf0)); }
#play .lbc { background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03)); }
#play .lbc.free { background: linear-gradient(180deg, rgba(255,205,110,.22), rgba(255,177,59,.08)); }
#play .lbc.here { box-shadow: 0 0 12px rgba(255,255,255,.35); }
#play .btn { background: linear-gradient(180deg, #ffd06b, #ffa526); box-shadow: 0 4px 0 #b5690d, 0 8px 14px rgba(0,0,0,.4); }
#play .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b5690d; }
#play .btn.alt { background: linear-gradient(180deg, #3d2c1f, #2a1e15); box-shadow: 0 4px 0 #120c08; }
#play .chip { background: linear-gradient(180deg, #3d2c1f, #2a1e15); }
#play .cardback::after { content: "✦"; position: absolute; top: 4px; left: 7px; font-size: 14px; color: #ffe29a; text-shadow: none; }
#play .gemline.fx-bump { animation: bump .45s ease-out; }
#play .over { overflow: hidden; background: radial-gradient(90% 90% at 50% 40%, #3a2417, #1c1410); }
#play .over.boom { background: radial-gradient(90% 90% at 50% 40%, #4a1713, #1c1410); }
#play .flipwrap { display: block; position: relative; }
#play .mcard { overflow: visible; }
#play .fx-flip { animation: flipin .5s cubic-bezier(.2,.8,.3,1) both; }
#play .fx-slam { animation: slam .55s cubic-bezier(.2,.8,.3,1) both; }
#play .fx-tumble { animation: tumble 1.3s cubic-bezier(.2,.8,.3,1) both; }
#play .burst { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
#play .burst i { position: absolute; left: 50%; top: 46%; width: 22px; height: 22px; margin: -11px 0 0 -11px; animation: burst .8s cubic-bezier(.15,.7,.3,1) both; }
#play .burst svg { width: 22px; height: 22px; }
#play .over.fx h2 { animation: boomin .55s cubic-bezier(.2,.8,.3,1) both; }
#play .over.fx.boom::before { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 70% at 50% 50%, rgba(255,60,40,.55), rgba(255,60,40,0) 70%); animation: flash .7s ease-out both; pointer-events: none; }
#play .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#play .confetti i { position: absolute; top: -26px; width: 22px; height: 22px; animation: fall 2.2s ease-in both; }
#play .confetti svg { width: 22px; height: 22px; }

/* ---------- the die (a d10), the Monster pile, Prep as a table ---------- */
#play .d10 { display: block; width: 100%; height: 100%; overflow: visible; }
#play .d10 .dbody { fill: #fffaf0; stroke: #1d1712; stroke-width: 4; stroke-linejoin: round; }
#play .d10 .dfacet { fill: none; stroke: #cdbf9f; stroke-width: 2; stroke-linejoin: round; }
#play .d10 .dnum { fill: #1d1712; font-weight: 900; font-size: 34px; font-family: inherit; }
#play .d10 .dnum.ten { font-size: 28px; }
#play .d10.idle .dbody { fill: #f5ead2; }
#play .d10.fx-tumble { animation: tumble 1.3s cubic-bezier(.2,.8,.3,1) both; }
#play .tapword { font-size: 15px; font-weight: 800; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; text-align: center; }
#play .mpile { width: 200px; flex: none; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
#play .mpile h4 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#play .mset { display: flex; align-items: center; gap: 6px; }
#play .mset .mb { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 2px solid var(--bd); background: radial-gradient(circle, var(--hot), var(--c1)); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; color: var(--ink); }

/* ---------- Settings and How to play: a header with a back button, then a list ---------- */
#play .shead { display: flex; align-items: center; gap: 14px; padding: 4px 0 8px; flex: none; }

#play .slist { display: flex; flex-direction: column; gap: 10px; max-width: 720px; margin: 8px auto 0; }
#play .srow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); }

#play .how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; max-width: 1000px; margin: 8px auto; }
@media (max-aspect-ratio: 1/1) { #play .how { grid-template-columns: 1fr; } }
#play .hcard { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }

#play .harrow { font-size: 34px; color: var(--dim); font-weight: 900; }
#play .hdie { width: 70px; height: 70px; }
#play .hbankpic, #play .hsafe { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; font-size: 30px; padding: 10px 16px; border-radius: 14px; border: 3px solid #2b6f9c; background: rgba(43,111,156,.16); }
#play .hbankpic .ic { width: 32px; height: 32px; }
#play .hsafe { border-color: var(--good); color: var(--good); }
#play .helppanel { position: fixed; inset: 0; z-index: 15; background: var(--bg); display: flex; flex-direction: column; padding: var(--top) 20px 10px; }
#play .hline { max-width: 1000px; margin: 14px auto 6px; font-size: 18px; text-align: center; }

#play .slot.stacked::before, #play .slot.stacked::after { content: ""; position: absolute; inset: 0; border-radius: calc(22px * var(--ca)); background: #e9dfc9; border: 2px solid rgba(0,0,0,.35); z-index: -1; }
#play .slot.stacked::before { transform: translate(5px, 6px); } #play .slot.stacked::after { transform: translate(10px, 12px); background: #cbbf9f; z-index: -2; }

#play .piles { width: 150px; }
#play .tableau { align-items: center; }

#play .pbar.slim { position: absolute; z-index: 12; top: calc(var(--top) + 10px); right: max(10px, env(safe-area-inset-right)); padding: 0;          /* the same spot as on the dig screen */ }
#play .pbar .pgrow { flex: 1; }
#play .keepsay { margin: 0; font-size: 22px; font-weight: 800; color: var(--text); text-align: center; }

@keyframes arrive { 0% { transform: translateY(170px) scale(.5); opacity: 0; } 100% { transform: none; opacity: 1; } }

#play .dieb { width: min(100%, calc(350px * var(--ca) * .56)); height: auto; aspect-ratio: 1; }

#play .rollp { max-width: none; width: 100%; }
#play .tapword { font-size: 22px; }

#play .deck .dcap-unused { position: absolute; z-index: 3; left: 8%; right: 8%; bottom: 12px; padding: 8px 6px; border-radius: 12px; background: rgba(20,12,8,.88); border: 2px solid var(--accent); color: #fff; font-size: 16px; font-weight: 800; line-height: 1.2; text-align: center; }

/* a Monster is in front of you: only the Monster and the die stay lit */
#play .ptable .drill, #play .ptable .tableau, #play .ptable .deck, #play .ptable .piles .bankp { transition: opacity .25s, filter .25s; }
#play .ptable.await-roll .drill, #play .ptable.await-roll .tableau, #play .ptable.await-roll .deck, #play .ptable.await-roll .piles .bankp { opacity: .3; filter: saturate(.5) brightness(.8); }
#play .ptable.await-roll .deck.live { animation: none; outline: none; }
#play .dieb.live { position: relative; animation: glowpulse 1.3s ease-in-out infinite; }
#play .dieb.live .d10 { animation: dbounce 1.3s ease-in-out infinite; }
#play .dieb.live .tapword { font-size: 20px; white-space: nowrap; background: var(--accent); color: #1c1410; padding: 6px 16px; border-radius: 99px; letter-spacing: .04em; }
@keyframes glowpulse { 0%, 100% { filter: drop-shadow(0 0 14px rgba(255,177,59,.7)) drop-shadow(0 6px 0 rgba(0,0,0,.45)); } 50% { filter: drop-shadow(0 0 34px rgba(255,200,90,1)) drop-shadow(0 6px 0 rgba(0,0,0,.45)); } }
@keyframes dbounce { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-8px) rotate(-4deg); } 55% { transform: translateY(0) rotate(3deg); } }

/* the bottom row: Mine, flip spot, Bank (all card-sized) and, to their right, the action zone */
#play .piles { flex: none; width: calc(250px * var(--ca)); height: calc(350px * var(--ca)); margin-left: 0; }
#play .pile.bankp { height: 100%; }
#play .pile.bankp .gemline { font-size: 38px; }
#play .pile.bankp .gemline svg { width: 40px; height: 40px; }
#play .dicez { flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; justify-content: center; }
#play .action { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 100%; }
#play .aprompt { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px; font-size: 21px; font-weight: 800; color: var(--text); text-align: center; line-height: 1.25; }

#play .takedmg { min-height: 64px; padding: 10px 26px; border-radius: 18px; background: linear-gradient(180deg, #ff8a4a, #e0481c); border: 3px solid #ffd2b0; color: #fff; font-size: 24px; font-weight: 900; box-shadow: 0 6px 0 #7a2a0c, 0 12px 20px rgba(0,0,0,.4); animation: pulse 1.4s ease-in-out infinite; }

#play .dieb { width: clamp(96px, calc(350px * var(--ca) * .5), 170px); }

/* where you are: only what you can do now is bright; a step line says which step you are on; a stamp says how the Monster ended */
#play .deck:disabled, #play .pile:disabled { opacity: .38; filter: saturate(.5); }
#play .stamp { position: absolute; left: 50%; top: 40%; z-index: 5; transform: translate(-50%, -50%) rotate(-14deg); padding: 4px 16px; border: 5px solid currentColor; border-radius: 10px; font-size: 32px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; background: rgba(255,255,255,.9); box-shadow: 0 6px 0 rgba(0,0,0,.35); animation: stampin .35s cubic-bezier(.2,.8,.3,1) both; pointer-events: none; }
#play .stamp.survived { color: #168a4a; }
#play .stamp.defeated { color: #7a3fb8; }
@keyframes stampin { 0% { transform: translate(-50%, -50%) rotate(-14deg) scale(2.2); opacity: 0; } 70% { transform: translate(-50%, -50%) rotate(-14deg) scale(.94); opacity: 1; } 100% { transform: translate(-50%, -50%) rotate(-14deg) scale(1); opacity: 1; } }

/* "Use all" is a real button: bright, raised, impossible to miss */
#play .aprompt .chip[data-p=triggerall] { min-height: 52px; padding: 8px 22px; border-radius: 16px; border: 3px solid #e9d4ff; background: linear-gradient(180deg, #a15be0, #6d2fb0); color: #fff; font-size: 20px; font-weight: 900; box-shadow: 0 5px 0 #3b1766, 0 10px 18px rgba(0,0,0,.4); }

/* the roll is open until you use a card, then it is locked in */
#play .dieb { position: relative; }
#play .dlock { position: absolute; right: -10px; top: -10px; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.4); }

#play .lockednote { font-size: 16px; font-weight: 800; color: var(--dim); }

/* a Mystery Box: the others fall away, the extra card is turned over */
#play .revealrow { position: relative; display: flex; justify-content: center; align-items: center; gap: 14px; min-height: 120px; }
#play .keptcard, #play .flipcard { display: block; position: relative; flex: none; }
#play .keptcard { animation: keptmove .6s ease-out 1.1s backwards; }
#play .ghostcard { position: absolute; left: 50%; top: 0; margin-left: calc(var(--gx) - 50%); display: block; pointer-events: none; animation: ghostaway .7s ease-in calc(.35s + var(--i) * .1s) forwards; }
#play .flipcard { perspective: 900px; }
#play .flipcard .fback, #play .flipcard .ffront { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: none; }
#play .flipcard .fback { display: flex; align-items: stretch; transform: rotateY(0deg); animation: revealback 1.8s ease-in-out both; }
#play .flipcard .fback .cardback { width: 100%; height: 100%; border-radius: 12px; transform: none; }
#play .flipcard .ffront { animation: revealfront 1.8s ease-in-out both; }
#play .flipcard { animation: dealin .5s cubic-bezier(.2,.8,.3,1) calc(.9s + var(--i) * .15s) backwards; }
@keyframes ghostaway { 0% { transform: none; opacity: 1; } 100% { transform: translateY(160px) rotate(10deg) scale(.6); opacity: 0; } }

#play .cardback::after { content: none; }
/* the final round, announced */
#play .fnote-back { position: fixed; inset: 0; z-index: 31; display: flex; align-items: center; justify-content: center; background: rgba(10,6,3,.78); }
#play .fnote { width: min(700px, calc(100vw - 40px)); padding: 30px 34px 28px; border-radius: 26px; background: linear-gradient(180deg, #4a2a1d, #2a1712); border: 4px solid #ffb13b; box-shadow: 0 0 0 6px rgba(255,177,59,.18), 0 24px 70px rgba(0,0,0,.7); text-align: center; }
#play .fnote .fbig { font-size: 76px; line-height: 1; font-weight: 900; letter-spacing: .04em; color: #ffd45e; text-shadow: 0 4px 0 #8a3a0c, 0 10px 24px rgba(255,140,40,.5); }
#play .fnote .fsub { margin: 10px 0 4px; font-size: 24px; font-weight: 800; color: var(--text); }
#play .fnote .fwhere { margin: 10px 0 0; font-size: 24px; font-weight: 800; color: #fff; }
#play .fnote .frules { max-height: 0; overflow: hidden; transition: max-height .3s ease; text-align: left; }
#play .fnote .frules.open { max-height: 340px; margin-top: 14px; }
#play .fnote .frules ul { margin: 0; padding: 0 0 0 26px; font-size: 20px; line-height: 1.35; color: var(--text); }
#play .fnote .frules li { margin: 6px 0; }
#play .fnote .fbtns { display: flex; gap: 14px; justify-content: center; margin-top: 22px; }
#play .piles { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
#play .piles .rollbtn { margin: 0; align-self: flex-end; width: 104px; height: auto; gap: 0; }
#play .piles { gap: 8px; }
#play .piles .rollbtn .tapword { white-space: nowrap; font-size: 17px; padding: 4px 14px; margin-top: 4px; }
#play .pile.bankp, #play .pile.bankp.live { min-height: 84px; }
/* tokens say who they are (You on blue, AI on red); the Crown Jewel sits on the leader's token */
#play .bstack .bdisc { width: 54px; height: 54px; position: relative; }
#play .bstack .bdisc b { font-size: 17px; letter-spacing: .02em; }
#play .bstack .bdisc .cjewel { position: absolute; left: 50%; top: -22px; transform: translateX(-50%); font-size: 30px; line-height: 1; color: #ffd13a; text-shadow: 0 2px 0 #8a5a00, 0 0 12px rgba(255,200,60,.9); animation: cjdrop .5s cubic-bezier(.3,1.4,.4,1) 1.2s backwards; }
@keyframes cjdrop { 0% { transform: translate(-50%, -40px) scale(.5); opacity: 0; } 100% { transform: translate(-50%, 0) scale(1); opacity: 1; } }
/* your cards, to look at while you choose */
#play .foot .ownedbtn { margin-right: auto; min-width: 0; padding-left: 22px; padding-right: 22px; }
#play .ownedback { position: fixed; inset: 0; z-index: 32; display: flex; align-items: center; justify-content: center; background: rgba(10,6,3,.82); }
#play .ownedpanel { max-width: calc(100vw - 40px); max-height: calc(100vh - 40px); overflow: auto; padding: 20px 24px 14px; border-radius: 22px; background: #241a14; border: 3px solid #e7b866; text-align: center; }
#play .ownedpanel h3 { margin: 0 0 12px; font-size: 26px; font-weight: 900; color: #ffd45e; }
#play .ownedpanel .cards { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
#play .ownedpanel .ocard { position: relative; display: block; flex: none; }
#play .ownedpanel .closehint { margin-top: 10px; color: var(--dim); font-size: 15px; }
#play .takedmg.waitroll { visibility: hidden; pointer-events: none; }          /* no "take the damage" until the die has landed */
/* Prep is one screen: it never scrolls (the pack's rays and sparks reach past the edges, which used to let it scroll) */
#play .panel.prep #setupScroll, #play .panel.prep .scroll { overflow: hidden; overscroll-behavior: none; }
#play .kitbar + .kslots, #play .kitbar + .krow { margin-top: 20px; }          /* the chosen card's outline and number badge reach above its place: keep them clear of the title */
/* the end of a run */
#play .enddone .endtitle { text-align: center; font-size: 58px; margin: 8px 0 18px; font-weight: 900; color: var(--text); }
#play .enddone .endtitle.won { color: #ffd45e; text-shadow: 0 4px 0 #8a3a0c, 0 10px 24px rgba(255,160,40,.5); }
#play .enddone .endtitle.won::before { content: "♛ "; }
#play .enddone .foot { justify-content: space-between; }
#play .enddone .foot .endbtns { display: flex; gap: 12px; }
#play .rounds .rlist { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
#play .rounds .rrow { display: grid; grid-template-columns: 150px 1fr 1fr; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 16px; background: #2a1f18; border: 2px solid #4b3a2c; }
#play .rounds .rnum { font-size: 24px; font-weight: 900; color: var(--text); display: flex; flex-direction: column; } #play .rounds .rnum small { font-size: 14px; color: #ffd45e; letter-spacing: .1em; text-transform: uppercase; }
#play .rounds .rchip { display: grid; grid-template-columns: 54px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; }
#play .rounds .rchip .bdisc { grid-row: 1 / 3; width: 50px; height: 50px; animation: none; display: flex; align-items: center; justify-content: center; }
#play .rounds .rchip .bdisc b { font-size: 16px; color: #fff; }
#play .rounds .rwhat b { font-size: 26px; font-weight: 900; color: var(--text); } #play .rounds .rwhat b.boom { color: #ff6b5b; }
#play .rounds .rsub { font-size: 17px; color: var(--dim); } #play .rounds .rsub b.took { color: #ffd45e; }
#play .ffbtn { margin-top: 6px; }
#play .zoom .zdyn { margin-top: 14px; padding: 10px 24px; border-radius: 99px; background: #2a1f18; border: 3px solid #ffb13b; font-size: 26px; font-weight: 800; color: var(--text); text-align: center; }
#play .zoom .zdyn b { color: #ffd45e; }
/* a quick warning, outside the table so a redraw does not remove it; it goes by itself */
.dangertoast { position: fixed; z-index: 40; left: 50%; top: max(70px, calc(env(safe-area-inset-top) + 62px)); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 99px; background: #b81d12; border: 3px solid #ffd9d3; color: #fff; font: 800 19px/1.2 system-ui, -apple-system, sans-serif; box-shadow: 0 8px 22px rgba(0,0,0,.5); pointer-events: none; animation: dangerpop 2.6s ease-out both; }
.dangertoast .ic { width: 1.3em; height: 1.3em; flex: none; }
@keyframes dangerpop { 0% { opacity: 0; transform: translate(-50%, -14px) scale(.92); } 10%, 80% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -6px); } }
/* the Leaderboard: poker chips for each player's best (gold trim, their colour), plain markers for their live position, the players named underneath */
#play .bstack .bhead { height: 118px; flex-direction: column; justify-content: flex-start; padding-top: 6px; overflow: visible; }
#play .bstack .bhead .bn { display: flex; align-items: center; gap: 2px; line-height: 1; }
#play .bstack .bhead .bn .bcrown { font-size: 26px; }
#play .bchips { position: absolute; left: 0; right: 0; bottom: 6px; height: 84px; }
#play .pchip { position: absolute; left: 50%; bottom: calc(var(--k, 0) * 11px); width: 46px; height: 46px; margin-left: -23px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-style: normal; background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--pc) 60%, #fff), var(--pc) 62%, color-mix(in srgb, var(--pc) 70%, #000)); border: 4px solid #e3b93b; box-shadow: 0 3px 0 rgba(60,35,5,.7), 0 5px 6px rgba(0,0,0,.35); color: #fff; }
#play .pchip::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.8); }
#play .pchip b { position: relative; font: 900 12px/1 system-ui, -apple-system, sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,.65); }
#play .pchip.me { box-shadow: 0 3px 0 rgba(60,35,5,.7), 0 0 0 3px rgba(255,255,255,.8), 0 5px 8px rgba(0,0,0,.4); }
#play .pchip.mini { position: relative; left: auto; bottom: auto; margin: 0; width: 22px; height: 22px; border-width: 3px; flex: none; box-shadow: 0 2px 0 rgba(60,35,5,.6); }
#play .pchip.mini::before { inset: 1px; border-width: 1px; }
#play .bstack .bdisc { width: 34px; height: 34px; border-width: 2px; box-shadow: 0 3px 0 color-mix(in srgb, var(--pc) 45%, #000), 0 5px 5px rgba(0,0,0,.3); animation: none; }
#play .bplayers { display: flex; justify-content: center; gap: 30px; margin: 22px 0 0; font-size: 24px; font-weight: 900; flex-wrap: wrap; }
#play .bpl { display: inline-flex; align-items: center; gap: 9px; color: var(--pc); position: relative; }
#play .bpl b { color: inherit; text-shadow: 0 2px 0 rgba(0,0,0,.45); }
#play .bpl .cjewel { position: static; transform: none; margin-left: 2px; font-size: 30px; line-height: 1; color: #ffd13a; text-shadow: 0 2px 0 #8a5a00, 0 0 12px rgba(255,200,60,.8); animation: crownpop .6s ease-out both; }
@keyframes crownpop { 0% { transform: translateY(-20px) scale(.4); opacity: 0; } 100% { transform: none; opacity: 1; } }
#play .newbest { font-style: normal; font-size: 18px; font-weight: 900; padding: 4px 12px; border-radius: 99px; background: linear-gradient(180deg, #ffe27a, #f0a81c); color: #3a2200; border: 2px solid #fff3c4; box-shadow: 0 3px 0 #8a5a00; animation: newbest .7s cubic-bezier(.3,1.6,.5,1) 1.7s both; white-space: nowrap; }
@keyframes newbest { 0% { transform: scale(.2) rotate(-12deg); opacity: 0; } 100% { transform: scale(1) rotate(-3deg); opacity: 1; } }
#play .pbar .mk.best { border: 2px solid #e3b93b; }
#play .rounds .rrow { grid-template-columns: 150px; grid-auto-flow: column; grid-auto-columns: 1fr; }
/* The Bank is a button, not a place for cards: a raised gold key at the right edge, bottom-aligned, that presses down */
#play .piles { width: auto; height: auto; align-self: flex-end; margin-left: 0; flex: none; }
#play .pile.bankp, #play .pile.bankp.live { flex: none; width: 210px; height: auto; min-height: 96px; padding: 10px 24px; flex-direction: row; gap: 14px; border-radius: 24px; border: 3px solid #fff0b8; color: #2a1700; font-size: 34px; font-weight: 900; letter-spacing: .02em; background: linear-gradient(180deg, #ffd45e, #e8920f); box-shadow: 0 8px 0 #8a4f06, 0 16px 24px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.55); overflow: visible; transition: transform .08s, box-shadow .08s; }
#play .pile.bankp .gemline { display: inline-flex; align-items: center; gap: 6px; font-size: 34px; color: inherit; }
#play .pile.bankp .gemline svg { width: 36px; height: 36px; }
#play .pile.bankp .bword { text-transform: uppercase; }
#play .pile.bankp:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 3px 0 #8a4f06, 0 6px 12px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.4); }
#play .pile.bankp.live { animation: none; }
#play .pile.bankp:disabled, #play .pile.bankp.live:disabled { opacity: 1; filter: none; color: #cdbb8e; border-color: #8f7a4c; background: linear-gradient(180deg, #6f5d3a, #4d3f26); box-shadow: 0 5px 0 #2a2012, 0 10px 16px rgba(0,0,0,.35); }

<script id="engine">
/* =====================================================================
   ENGINE — no DOM. Sheet text -> rows -> cards; card text -> tokens; fitting arithmetic.
   ===================================================================== */
const Engine = (() => {
  // RFC-4180 CSV: quoted fields, doubled quotes, newlines inside quotes. (\u0001 stands for a comma inside the design-time sample.)
  function parseCSV(text) {
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f.length || row.length) { row.push(f); rows.push(row); }
    return rows.filter(r => r.some(x => x !== ''));
  }
  // rows -> objects keyed by header, then -> cards
  function table(rows) {
    const head = rows[0].map(h => h.trim());
    return rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] === undefined ? '' : r[i]).replace(/\u0001/g, ',')])));
  }
  function cards(rows, cols) {
    const RU = DDB.rules;          // the owner's rulings come first: removed cards are not read at all, and the Pet's number is the rules' number
    return table(rows).filter(r => r[cols.id] && r[cols.name] && !RU.removedCards.includes(r[cols.id].trim())).map(r => ({
      id: r[cols.id].trim(), name: r[cols.name].trim(), type: (r[cols.type] || '').trim(),
      number: r[cols.number] === '' || r[cols.number] === undefined || !Number.isFinite(Number(r[cols.number])) ? null : Number(r[cols.number]),
      deck: (r[cols.deck] || '').trim(), count: Number(r[cols.count]) || 1, text: (r[cols.text] || '').trim(),
      trigger: (r[cols.trigger] || '').trim(), note: (r[cols.notes] || '').trim(), raw: r,
    })).map(c => (c.deck === RU.startingDeck && c.type === 'Power' ? { ...c, number: RU.pet.at } : c));
  }
  // "+1 {reroll}. When dug, +1 {heart}" -> [{t:'text',v:'+1 '},{t:'icon',v:'reroll'},...]
  function tokens(text, iconCodes) {
    const out = []; const re = /\{(\w+)\}/g; let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) out.push({ t: 'text', v: text.slice(last, m.index) });
      out.push(iconCodes[m[1]] ? { t: 'icon', v: m[1] } : { t: 'text', v: m[0] });
      last = m.index + m[0].length;
    }
    if (last < text.length) out.push({ t: 'text', v: text.slice(last) });
    return out;
  }
  // Largest value in [lo, hi] (steps of `step`) for which fits(v) is true. fits must be monotone: true for small values.
  function largestFitting(fits, lo, hi, step = 0.25) {
    let a = Math.round(lo / step), b = Math.round(hi / step);
    if (!fits(a * step)) return a * step;
    while (a < b) { const mid = Math.ceil((a + b) / 2); if (fits(mid * step)) a = mid; else b = mid - 1; }
    return a * step;
  }
  // "{damage} 1 → 3 → 5 → 7" -> [1, 3, 5, 7]   (null when the text is not a damage ladder)
  function damageSteps(text) {
    const m = /^\s*\{damage\}\s*([\d\s→>,\-]+)$/.exec(text);
    if (!m) return null;
    const nums = m[1].split(/[^\d]+/).filter(Boolean).map(Number);
    return nums.length ? nums : null;
  }
  // "1 {gem}" -> 1   (how many gems a Treasure card is worth)
  const gemWorth = text => { const m = /^\s*(\d+)\s*\{gem\}\s*$/.exec(text); return m ? Number(m[1]) : null; };
  const formatSize = u => (u / 100).toFixed(2) + ' in (' + (u * 0.01 * 72).toFixed(1) + ' pt)';
  return { parseCSV, table, cards, tokens, largestFitting, damageSteps, gemWorth, formatSize };
})();
</script>

<script id="dig">
/* =====================================================================
   DIG — the rules of one Dig (v2.7). No DOM. All numbers come from DDB.rules; card text is read through DDB.phrases.
   state = one player's Dig. Actions mutate it and write to state.log. Cards are plain objects from Engine.cards().
   ===================================================================== */
const Dig = (() => {
  const R = DDB.rules, P = DDB.phrases, RL = R.rulings;
  const RES = ['heart', 'reroll'];
  const rx = list => list.map(([op, re]) => [op, new RegExp(re)]);
  const PH = { kept: rx(P.kept), whole: rx(P.whole), sentence: rx(P.sentence), per: rx(P.per), ongoing: rx(P.ongoing), events: rx(P.events), reactions: rx(P.reactions) };
  const match = (list, s) => { for (const [op, re] of list) { const m = re.exec(s); if (m) return { op, m }; } return null; };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ---------------- random numbers ----------------
  // Real play uses the device's secure random source (crypto.getRandomValues): fair dice and shuffles, nothing to predict or replay.
  // Giving a seed (tests, or one typed into a Practice Dig) makes a replayable stream instead.
  function secureRng() {
    const c = globalThis.crypto, two = new Uint32Array(2), one = new Uint32Array(1);
    const f = () => { c.getRandomValues(two); return ((two[0] >>> 5) * 67108864 + (two[1] >>> 6)) / 9007199254740992; };       // 53 random bits in [0, 1)
    f.int = n => { const limit = Math.floor(4294967296 / n) * n; let v; do { c.getRandomValues(one); v = one[0]; } while (v >= limit); return v % n; };     // 0..n-1, no modulo bias
    f.state = () => null; f.restore = () => {};
    return f;
  }
  function makeRng(seed) {
    if (seed === undefined || seed === null) return secureRng();
    let a = seed >>> 0;
    const f = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    f.int = n => Math.floor(f() * n);
    f.state = () => a; f.restore = v => { a = v >>> 0; };      // so a saved seeded Dig carries on with the same dice and shuffles
    return f;
  }
  // Fisher–Yates with an unbiased integer for every swap.
  function shuffle(state, arr) { for (let i = arr.length - 1; i > 0; i--) { const j = state.rng.int(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

  // ---------------- card text -> behaviour ----------------
  function listItems(text) { const out = []; const re = /(Lose |\+)(\d+) \{(heart|reroll)\}/g; let m; while ((m = re.exec(text))) out.push({ lose: m[1] === 'Lose ', n: Number(m[2]), res: m[3] }); return out; }
  function parseSentence(s) {
    const h = match(PH.sentence, s); if (!h) return null; const m = h.m;

      case 'list': return { op: 'list', items: listItems(s) };
      case 'whenKept': { const k = match(PH.kept, s); return k ? { op: 'whenKept', kept: k.op } : null; }
      case 'gainHalf': case 'gainDmg': case 'block': case 'survive1': case 'halve': case 'defeat': case 'noDamage': case 'echo': case 'slide': case 'fill': case 'rewind': case 'shoo':
        return { op: h.op, n: m[1] ? Number(m[1]) : undefined };
      case 'gainPer': { const per = match(PH.per, m[3]); return per ? { op: 'gainPer', n: Number(m[1]), res: m[2], per: per.op } : null; }
      case 'ifNoOther': { const t = parseSentence(m[1]); return t ? { op: 'if', cond: { noOther: true }, then: t } : null; }
      case 'ifHeart': { const t = parseSentence(m[2]); return t ? { op: 'if', cond: { heartAtMost: Number(m[1]) }, then: t } : null; }
      case 'burnout': { const t = parseSentence(m[1]); return t ? { op: 'seq', list: [t, { op: 'burnout', n: Number(m[2]), max: Math.min(R.line.max, Number(m[3])) }] } : null; }
      case 'look': return { op: 'look', n: Number(m[1]) };
      case 'setHeart': return { op: 'setHeart', n: Number(m[1]) };
      case 'wishing': return { op: 'wishing', n: Number(m[1]) };

/* =====================================================================

/* =====================================================================

})();

      case 'stat': { const r = ds.r, v = S.start[r] + Number(ds.d); S.start[r] = Math.max(r === 'heart' ? 1 : 0, Math.min(R.caps[r], v)); break; }
      case 'random': { const pool = boosters().filter(Dig.supported); S.kit = []; const rr = Dig.makeRng(); while (S.kit.length < Math.min(S.kitSize, pool.length)) { const c = pool[Math.floor(rr() * pool.length)]; if (!S.kit.includes(c.id)) S.kit.push(c.id); } break; }
      case 'clear': S.kit = []; break;
      case 'go': S.run = null; S.match = null; newDig(); break;
      case 'again': S.seed = undefined; newDig(); break;
      case 'setup': S.run = null; S.match = null; S.panel = 'setup'; S.help = false; break;
      case 'help': S.help = true; S.gmenu = false; break;
      case 'closehelp': S.help = false; break;
      case 'cards': S.help = false; UI.setMode('cards'); return;
      case 'unzoom': S.zoom = null; break;
      case 'emptyok': S.emptySeen = S.st; break;
      case 'owned': S.showOwned = true; break;
      case 'roundlog': S.panel = 'rounds'; break;
      case 'enddone': S.panel = 'done'; break;
      case 'ownedclose': S.showOwned = false; break;
      case 'finalok': S.finalSeen = S.st; S.finalHow = false; startDelays(); break;
      case 'finalhow': S.finalHow = !S.finalHow; break;
      case 'zoom': S.zoom = findCard(ds.uid); break;
      case 'card': { const c = findCard(ds.uid), e = st && st.line.find(x => x.card === c); if (st && st.pending && (e || st.ongoing.includes(c))) Dig.chooseClone(st, e || c); else if (e && f && f.phase === 'after' && Dig.eligible(st).includes(e)) Dig.triggerFully(st, e); else S.zoom = c; break; }
      case 'triggerall': if (st) Dig.triggerAll(st); break;
      case 'dig': if (st) Dig.dig(st); break;
      case 'roll': Dig.roll(st); break;
      case 'reroll': if (f && f.phase === 'after') Dig.reroll(st); break;
      case 'face': if (st && Dig.eligible(st).length && !S.confirmFace) { S.confirmFace = true; break; } S.confirmFace = false; Dig.face(st); break;
      case 'bank': if (S.run) Run.bank(S.run); else Dig.bank(st); break;
      case 'heart': break;
    }
    if (S.run) { Run.checkOver(S.run); if (S.run.phase === 'dig') Run.refresh(S.run); if (S.match) Match.finalCheck(S.match); else Run.finalCheck([S.run]); }
    if (S.st && S.st.over && !S.st.best && !S.run) recordBest(S.st);
    persist(); render();
  }
  // Dragging in the Starter Kit: pick a card up and drop it on a place to put it there, swap with the card in it, or reorder.
  let drag = null;
  $.addEventListener('pointerdown', e => { const el = e.target.closest('.pcard[data-p=kitpick], .pcard[data-p=pick]'); if (!el || (e.pointerType === 'mouse' && e.button > 0)) return; drag = { el, uid: Number(el.dataset.uid), x0: e.clientX, y0: e.clientY, moved: false, ghost: null }; });
  window.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 12) {
      drag.moved = true; const r = drag.el.getBoundingClientRect(), g = drag.el.cloneNode(true); g.removeAttribute('data-p'); g.classList.add('dragghost'); g.style.cssText += `;position:fixed;left:0;top:0;width:${r.width}px;height:${r.height}px;z-index:40;pointer-events:none;margin:0`; document.body.appendChild(g); drag.ghost = g; drag.w = r.width; drag.h = r.height; drag.el.classList.add('dragging');
    }
    if (drag.moved) {
      drag.ghost.style.transform = `translate(${e.clientX - drag.w / 2}px, ${e.clientY - drag.h * .6}px) rotate(-3deg) scale(1.05)`;
      const t = document.elementFromPoint(e.clientX, e.clientY), slot = t && t.closest('.kslot');
      $.querySelectorAll('.kslot.over').forEach(x => { if (x !== slot) x.classList.remove('over'); }); if (slot) slot.classList.add('over');
    }
  });
  const endDrag = (e, drop) => {
    if (!drag) return; const d = drag; drag = null;
    if (!d.moved) return;
    d.ghost.remove(); d.el.classList.remove('dragging'); $.querySelectorAll('.kslot.over').forEach(x => x.classList.remove('over'));
    S.noClick = true; setTimeout(() => { S.noClick = false; }, 60);
    const t = drop ? document.elementFromPoint(e.clientX, e.clientY) : null, slot = t && t.closest('.kslot');
    const pr = S.run && S.run.prep;
    if (pr && (pr.step === 'kit' || pr.step === 'keep')) {          // the Starter Kit and the pack work the same way: drop on a place to put the card there or swap, drop anywhere else to take it out
      const kit = pr.step === 'kit', list = kit ? pr.kitPick : pr.picked;
      if (slot) { (kit ? Run.moveKit : Run.moveKeep)(S.run, d.uid, Number(slot.dataset.i)); persist(); }
      else if (drop && list.includes(d.uid)) { (kit ? Run.toggleKit : Run.toggleKeep)(S.run, d.uid); persist(); }
    }
    render();
  };
  window.addEventListener('pointerup', e => endDrag(e, true)); window.addEventListener('pointercancel', e => endDrag(e, false));
  $.addEventListener('click', e => { if (S.noClick) { e.preventDefault(); return; } const el = e.target.closest('[data-p]'); if (!el || el.disabled) return; e.preventDefault(); act(el.dataset.p, el); });
  document.addEventListener('ddb-cards', () => { restore(); render(); }); document.addEventListener('ddb-mode', render);
  let sized = innerWidth + 'x' + innerHeight, sizeTimer = null;
  window.addEventListener('resize', () => {
    if (document.body.dataset.mode !== 'play') return;
    fitHero();
    clearTimeout(sizeTimer);          // turning the iPad changes the size the table and the cards are drawn for: draw them again
    sizeTimer = setTimeout(() => { const now = innerWidth + 'x' + innerHeight; if (now !== sized) { sized = now; if (!drag) render(); } }, 150);
  });
  window.DigDigBoomPlay = { S, render, act: (a, d) => act(a, { dataset: d || {} }), tick: aiTick };
  restore(); render();          // the saved copy of your cards is already in: the real menu (Continue and all) shows on the first frame
})();
