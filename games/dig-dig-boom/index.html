<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dig Dig BOOM!">
<meta name="build" content="__BUILD__">

<title>Dig Dig BOOM!</title>
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<style>
:root { --bg: #1c1410; --panel: #2a1f18; --line: #4b3a2c; --text: #f4ead8; --dim: #ac9a82; --accent: #ffb13b; --good: #52d28a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
body { padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 40px max(14px, env(safe-area-inset-left)); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
a { color: var(--accent); }
h1 { margin: 6px 0 2px; font-size: clamp(26px, 5vw, 40px); }
h2 { margin: 0 0 4px; font-size: 22px; }
.sub { color: var(--dim); margin: 0 0 12px; font-size: 15px; line-height: 1.4; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 18px; }
.chip { min-height: 44px; padding: 8px 14px; border-radius: 99px; background: var(--panel); border: 2px solid var(--line); font-weight: 700; font-size: 15px; }
.chip.on { border-color: var(--accent); background: #4a3418; }
.status { font-size: 13px; color: var(--dim); }
.status b { color: var(--good); }
.status.bad b { color: #ff7a6b; }
.back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 16px 8px 12px; border-radius: 99px; background: var(--panel); border: 2px solid var(--accent); font-weight: 800; text-decoration: none; color: var(--text); }
.back span { color: var(--accent); font-size: 22px; line-height: 1; }
.dir { margin: 0 0 34px; padding: 16px; border-radius: 18px; background: var(--panel); border: 2px solid var(--line); }
.dir .why { margin: 0 0 12px; padding-left: 20px; font-size: 15px; line-height: 1.45; }
.dir .why li { margin: 3px 0; }
.h3 { margin: 18px 0 6px; font-size: 17px; }
.dir .tag { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.cell { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.cap { font-size: 12px; color: var(--dim); }
.fan { position: relative; margin: 6px 0 4px; }
.fan .card { position: absolute; }
.qs { font-size: 14px; line-height: 1.45; }
.qs li { margin: 4px 0; }
details { margin: 10px 0; }
summary { cursor: pointer; font-weight: 700; padding: 8px 0; }

/* ---------- the cards ----------
   Every card is drawn on a grid of hundredths of an inch (275 x 375 portrait, 375 x 275 landscape: 2.5 x 3.5 in poker size plus
   0.125 in margin all round). --u is how many screen pixels one unit is. Positions are computed in the script. */
.card { position: relative; overflow: hidden; border-radius: 0; background: var(--ink-bg, #fff); color: #1d1712; font-family: "Avenir Next", "Helvetica Neue", Arial, system-ui, sans-serif; flex: none; }
.card.round { border-radius: calc(var(--u) * 12.5); }
.card .abs { position: absolute; }
.card .paper { background: #fffaf0; }
.card .band { color: var(--on, #fff); }
.card .name { font-weight: 800; line-height: 1; white-space: nowrap; letter-spacing: -.01em; }
.card .typeword { font-weight: 800; letter-spacing: .12em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
.card .text { font-weight: 600; line-height: 1.13; color: #1d1712; overflow: hidden; }
.card .text .ic, .meas .ic { display: inline-block; width: 1.12em; height: 1.12em; vertical-align: -.2em; margin: 0 .04em; }
.card .stat { font-weight: 900; line-height: 1.05; }
.card .art { border-radius: calc(var(--u) * 7); background: repeating-linear-gradient(135deg, #e9dfc9 0 calc(var(--u)*6), #f6efdf calc(var(--u)*6) calc(var(--u)*12)); border: calc(var(--u) * 1.5) solid rgba(0,0,0,.28); display: flex; align-items: center; justify-content: center; color: rgba(0,0,0,.35); font-weight: 800; letter-spacing: .2em; }
.card .art svg { width: 62%; height: 62%; opacity: .55; }
.card .art.vivid { position: absolute; overflow: hidden; }
.card .art.vivid svg { opacity: 1; }
.card .gemtile .sp { position: absolute; color: #fff; line-height: 1; letter-spacing: 0; text-shadow: 0 0 calc(var(--u) * 4) rgba(255,255,255,.9); opacity: .9; }
.card .art .sp { position: absolute; color: #fff; font-size: calc(var(--u) * 16); line-height: 1; letter-spacing: 0; text-shadow: 0 0 calc(var(--u) * 4) rgba(255,255,255,.9); opacity: .9; }
.card .num { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #fffaf0; color: #1d1712; font-weight: 900; border-style: solid; }
.card .disc { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #fffaf0; }
.card .disc svg { width: 72%; height: 72%; }
table.cmp { width: 100%; border-collapse: collapse; margin: 0 0 22px; font-size: 14px; }
table.cmp th, table.cmp td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
table.cmp th { background: var(--panel); color: var(--accent); }
.view-gray .card { filter: grayscale(1); }
.view-deut .card { filter: url(#deut); }
.view-prot .card { filter: url(#prot); }
.meas { position: absolute; left: -9999px; top: 0; visibility: hidden; font-weight: 600; line-height: 1.13; font-family: "Avenir Next", "Helvetica Neue", Arial, system-ui, sans-serif; }
/* ---------- the game screen (solo Dig) ---------- */
body[data-mode=play] #app, body[data-mode=cards] #play { display: none; }
body[data-mode=play] { padding: 0; height: 100vh; height: 100dvh; overflow: hidden; position: fixed; inset: 0; width: 100%; }
#play { height: 100%; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#play .pbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; flex: none; }
#play .pbar h1 { margin: 0 auto 0 4px; font-size: 20px; }
#play .pbar .chip { padding: 6px 12px; font-size: 14px; }
#play .pbar .back { min-height: 44px; padding: 6px 12px 6px 8px; font-size: 14px; }
#play .pmain { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 0 10px 10px; }
#play .ptable { min-height: 0; display: flex; flex-direction: column; gap: 8px; position: relative; }
#play .drill { display: flex; gap: 10px; flex: none; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; }
#play .tracks { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
#play .trow { display: flex; align-items: center; gap: 8px; }
#play .tlab { width: 34px; height: 34px; flex: none; display: flex; align-items: center; justify-content: center; }
#play .tlab svg { width: 30px; height: 30px; }
#play .tbody { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; --col: calc((100% - 40px) / 11); }       /* Health has 11 spaces; Rerolls use the same column width, so 0, 3, 6 line up in all three rows */
#play .track { flex: none; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); width: calc(var(--col) * var(--n) + 3px * (var(--n) - 1) + 10px); gap: 3px; border-radius: 10px; padding: 2px; border: 3px solid transparent; min-width: 0; }
#play .track.live { border-color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(255,177,59,.35); } }
#play .tc { height: 34px; border-radius: 7px; background: #fffaf0; color: #1d1712; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--tc, #888); opacity: .55; }
#play .tc.lit { opacity: 1; background: color-mix(in srgb, var(--tc) 30%, #fffaf0); }
#play .tc.now { opacity: 1; background: var(--tc); color: #fff; font-size: 20px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
#play .ongoing { width: 250px; flex: none; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
#play .ongoing h4, #play .linehead { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#play .ongoing .list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; align-content: start; overflow-y: auto; max-height: 112px; overscroll-behavior: contain; }
#play .ongoing .piece { min-height: 46px; }
#play .ongoing .piece .h { min-height: 38px; font-size: 12px; overflow-wrap: normal; word-break: normal; }
#play .ongoing .list .note { grid-column: 1 / -1; }
#play .piece { position: relative; border-radius: 9px; border: 3px solid var(--c); background: #fffaf0; color: #1d1712; text-align: left; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; width: 100%; }
#play .piece .h { background: var(--c); color: var(--on); font-weight: 800; font-size: 13px; line-height: 1.1; padding: 3px 6px; display: flex; align-items: center; gap: 5px; }
#play .piece .h svg { width: 15px; height: 15px; flex: none; }
#play .piece .h .n { margin-left: auto; background: #fffaf0; color: #1d1712; border-radius: 99px; min-width: 22px; text-align: center; padding: 0 4px; font-size: 13px; }
#play .piece .t { display: block; font-size: 11.5px; font-weight: 600; line-height: 1.2; padding: 3px 6px 4px; }
#play .piece .ic { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -.2em; }
#play .piece.pick { outline: 4px solid var(--accent); animation: pulse 1.2s ease-in-out infinite; }
#play .piece.trig { box-shadow: 0 0 0 3px #fff, 0 0 12px 4px var(--accent); }
#play .piece.elig { box-shadow: 0 0 0 3px #fff, 0 0 12px 4px var(--accent); animation: pulse 1.2s ease-in-out infinite; }
#play .piece.done { opacity: .6; }
#play .piece .h .tg { margin-left: auto; font-size: 10px; font-weight: 800; background: #1d1712; color: #fff; border-radius: 6px; padding: 1px 5px; white-space: nowrap; }
#play .line { flex: 1; min-height: 120px; display: flex; flex-direction: column; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 6px 8px 8px; }
#play .linehead { display: flex; justify-content: space-between; padding: 0 2px 4px; flex: none; }
#play .lcols { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
#play .lcol .piece .h svg { display: none; }
#play .lcol .piece { flex: none; }
#play .lcol .piece .h { font-size: 11.5px; padding: 3px 4px; overflow-wrap: normal; word-break: normal; hyphens: none; }
#play .lcol { display: flex; flex-direction: column; gap: 3px; border-radius: 8px; padding: 2px; background: rgba(255,255,255,.04); min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
#play .lcol.on { background: rgba(255,177,59,.18); outline: 2px solid var(--accent); }
#play .lcol.off { opacity: .45; }
#play .lnum { font-weight: 900; font-size: 15px; text-align: center; color: var(--dim); order: 99; margin-top: auto; padding-top: 2px; }
#play .lcol.on .lnum { color: var(--accent); }
#play .mat { flex: none; height: var(--mat-h, 286px); display: grid; grid-template-columns: 124px minmax(0, 1fr) 124px; gap: 10px; }
#play .pile { border-radius: 14px; border: 3px dashed var(--line); background: rgba(255,255,255,.03); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; color: var(--dim); font-weight: 800; font-size: 13px; text-align: center; min-width: 0; }
#play .pile.bankp { border-color: #2b6f9c; }
#play .pile.live { border-color: var(--accent); border-style: solid; color: #fff; animation: pulse 1.4s ease-in-out infinite; }
#play .cardback { width: 76px; height: 106px; border-radius: 10px; background: repeating-linear-gradient(45deg, #5b3b22 0 8px, #6e4829 8px 16px); border: 3px solid #a6753f; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 34px; font-weight: 900; text-shadow: 0 2px 4px #000; box-shadow: 3px 3px 0 #2a1a0d, 6px 6px 0 #1c1410; }
#play .pile .cap2 { font-size: 12px; color: var(--dim); font-weight: 700; }
#play .known { display: flex; flex-direction: column; gap: 3px; width: 100%; }
#play .known .piece .h { font-size: 11px; padding: 2px 5px; }
#play .stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
#play .stack .pile { flex: 1; }
#play .gemline { display: flex; align-items: center; gap: 4px; font-size: 24px; color: #fff; }
#play .gemline svg { width: 26px; height: 26px; }
#play .dig { min-width: 0; border-radius: 14px; background: rgba(255,255,255,.03); border: 2px solid var(--line); display: flex; gap: 12px; padding: 8px 12px; align-items: center; justify-content: center; }
#play .dig.idle { color: var(--dim); font-size: 18px; text-align: center; line-height: 1.4; }
#play .mcard { display: block; border-radius: 12px; flex: none; position: relative; }
#play .mcard.live { outline: 4px solid var(--accent); outline-offset: 3px; animation: pulse 1.2s ease-in-out infinite; }
#play .rollp { display: flex; flex-direction: column; gap: 4px; align-items: stretch; min-width: 0; flex: 1; max-width: 250px; }
#play .die { width: calc(var(--mat-h, 286px) * .38); height: calc(var(--mat-h, 286px) * .38); margin: 0 auto; border-radius: 22px; background: #fffaf0; color: #1d1712; font-weight: 900; font-size: calc(var(--mat-h, 286px) * .22); display: flex; align-items: center; justify-content: center; border: 5px solid #1d1712; box-shadow: 0 4px 0 #000; }
#play .die.live { flex-direction: column; border-color: var(--accent); animation: pulse 1.2s ease-in-out infinite; font-size: calc(var(--mat-h, 286px) * .1); }
#play .die small { font-size: 15px; display: block; }
#play .calc { text-align: center; font-size: 15px; line-height: 1.35; color: var(--dim); }
#play .calc b { color: #fff; font-size: 34px; display: block; line-height: 1; }
#play .calcparts { display: block; font-size: 13px; margin-top: 2px; }
#play .hint { font-size: 13px; color: var(--accent); text-align: center; line-height: 1.3; font-weight: 700; }
#play .over { position: absolute; inset: 0; z-index: 5; background: #1c1410; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; }
#play .over h2 { font-size: 46px; margin: 0; }
#play .over .ic, #play .calc .ic, #play .hint .ic { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -.2em; }
#play .over.boom h2 { color: #ff5b4a; }
#play .over .big { font-size: 22px; line-height: 1.5; }
#play .over .row2 { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
#play .btn { min-height: 56px; padding: 12px 22px; border-radius: 14px; background: var(--accent); color: #1c1410; font-weight: 900; font-size: 18px; }
#play .btn.alt { background: var(--panel); color: var(--text); border: 2px solid var(--line); }
#play .zoom { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
#play .zoom .closehint { color: #fff; opacity: .75; font-size: 14px; }
#play .zoom .warn { color: #ffb4a8; font-size: 14px; max-width: 340px; text-align: center; }
#play .panel { position: fixed; inset: 0; z-index: 15; background: var(--bg); display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) 14px 10px; }
#play .panel.setup { position: static; flex: 1; min-height: 0; z-index: auto; padding: 0 14px 10px; }
#play .panel h2 { margin: 4px 0; font-size: 24px; }
#play .panel .scroll { flex: 1; overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 0 12px; }
#play .tabs { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; align-items: center; }
#play .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
#play .grid .piece { min-height: 70px; }
#play .piece.off { opacity: .45; }
#play .grid .piece.sel { outline: 4px solid var(--accent); background: #fff0c8; }
#play .grid .piece .t { font-size: 14px; }
#play .grid .piece .h { font-size: 15px; }
#play .stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--panel); border: 2px solid var(--line); border-radius: 99px; padding: 2px; }
#play .stepper button { width: 44px; height: 44px; border-radius: 99px; font-size: 22px; font-weight: 900; background: #3a2b20; }
#play .stepper span { min-width: 34px; text-align: center; font-weight: 800; }
#play .foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 8px; border-top: 1px solid var(--line); }
#play .note { font-size: 13px; color: var(--dim); line-height: 1.4; }
#play .helptxt { font-size: 15px; line-height: 1.5; max-width: 760px; }
#play .helptxt li { margin: 4px 0; }
#play .btn:disabled { opacity: .4; }
#play .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin: 10px 0; max-width: 900px; }
#play .bigopt { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
#play .bigopt .btn { min-height: 64px; font-size: 22px; }
#play .lb { flex: none; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 5px 8px 6px; }
#play .lbhead { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); padding: 0 2px 3px; flex-wrap: wrap; }
#play .lbcells { display: grid; gap: 3px; }
#play .lbc { min-height: 48px; border-radius: 8px; background: rgba(255,255,255,.06); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 2px 0; color: var(--dim); min-width: 0; }
#play .lbc.free { background: rgba(255,255,255,.1); }
#play .lbc.here { border-color: #fff; background: rgba(255,255,255,.2); color: #fff; }
#play .lbc .ln { font-weight: 800; font-size: 14px; }
#play .lbc .lm { display: flex; align-items: center; justify-content: center; gap: 3px; min-height: 22px; }
#play .mk { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; font-size: 10px; font-style: normal; font-weight: 900; color: #1d1712; }
#play .mk.best { background: var(--pc, var(--accent)); border: 2px solid rgba(0,0,0,.45); }
#play .mk.here { width: 0; height: 0; border-radius: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid #fff; }
#play .mk.pledge { border: 3px solid var(--pc, #fff); background: transparent; color: #fff; }
#play .ailine { font-size: 13px; color: var(--dim); padding: 3px 2px 0; }
#play .lbc .lm { flex-wrap: wrap; }
#play .crownmk { font-size: 22px; line-height: 1; color: #c9a227; font-weight: 400; }
#play .crownmk.mine { color: #ffd54a; text-shadow: 0 0 8px #ffb13b; }
#play .pstep { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; margin: 10px 0; max-width: 900px; }
#play .pstep.live { border-color: var(--accent); }
#play .pstep h3 { margin: 0 0 4px; font-size: 17px; }
#play .pstep p { margin: 4px 0; }
#play .ladder { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--dim); margin: 6px 0; }
#play .ladder .cur { color: var(--accent); font-weight: 800; }
#play table.cmp { max-width: 700px; }
@media (max-aspect-ratio: 1/1) {                       /* iPad held upright: the log goes under the table */
  #play .ongoing { width: 180px; }
}
#play .menu .btn.alt { }
#play .menu .confirm { background: #a8201f; color: #fff; }
@media (max-height: 780px) { #play .over { gap: 5px; padding: 6px 12px; overflow-y: auto; } #play .over h2 { font-size: 30px; } #play .over .big { font-size: 16px; line-height: 1.3; } #play .over .btn { min-height: 46px; padding: 8px 18px; font-size: 16px; } }
@media (max-height: 640px) { #play .tc { height: 28px; } #play .lbc { min-height: 42px; } #play .cardback { width: 64px; height: 90px; } }

/* ---------- the look: a lively cave, bright pieces, things that pop (nothing here ever waits for or delays a tap) ---------- */
body[data-mode=play] { background: radial-gradient(130% 75% at 50% -10%, #74401e 0%, #3a2211 36%, #1b120c 80%) fixed; }
#play .pbar h1 { display: flex; align-items: center; gap: 8px; font-size: 27px; font-weight: 900; letter-spacing: .01em; background: linear-gradient(180deg, #fff4bf 0%, #ffc23a 52%, #ec7a1c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 #6b2f05); }
#play .pbar h1 svg { width: 30px; height: 30px; flex: none; }
#play .drill, #play .line, #play .lb, #play .dig { position: relative; background: radial-gradient(90% 110% at 50% 0%, rgba(255,177,59,.13), rgba(255,255,255,.02) 70%); border-color: #5d4631; }

<script id="engine">
/* =====================================================================
   ENGINE — no DOM. Sheet text -> rows -> cards; card text -> tokens; fitting arithmetic.
   ===================================================================== */
const Engine = (() => {
  // RFC-4180 CSV: quoted fields, doubled quotes, newlines inside quotes. (\u0001 stands for a comma inside the design-time sample.)
  function parseCSV(text) {
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f.length || row.length) { row.push(f); rows.push(row); }
    return rows.filter(r => r.some(x => x !== ''));
  }
  // rows -> objects keyed by header, then -> cards
  function table(rows) {
    const head = rows[0].map(h => h.trim());
    return rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] === undefined ? '' : r[i]).replace(/\u0001/g, ',')])));
  }
  function cards(rows, cols) {
    return table(rows).filter(r => r[cols.id] && r[cols.name]).map(r => ({
      id: r[cols.id].trim(), name: r[cols.name].trim(), type: r[cols.type].trim(),
      number: r[cols.number] === '' || r[cols.number] === undefined ? null : Number(r[cols.number]),
      deck: r[cols.deck].trim(), count: Number(r[cols.count]) || 1, text: r[cols.text].trim(),
      trigger: (r[cols.trigger] || '').trim(), note: (r[cols.notes] || '').trim(), raw: r,
    }));
  }
  // "+1 {reroll}. When dug, +1 {heart}" -> [{t:'text',v:'+1 '},{t:'icon',v:'reroll'},...]
  function tokens(text, iconCodes) {
    const out = []; const re = /\{(\w+)\}/g; let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) out.push({ t: 'text', v: text.slice(last, m.index) });
      out.push(iconCodes[m[1]] ? { t: 'icon', v: m[1] } : { t: 'text', v: m[0] });
      last = m.index + m[0].length;
    }
    if (last < text.length) out.push({ t: 'text', v: text.slice(last) });
    return out;
  }
  // Largest value in [lo, hi] (steps of `step`) for which fits(v) is true. fits must be monotone: true for small values.
  function largestFitting(fits, lo, hi, step = 0.25) {
    let a = Math.round(lo / step), b = Math.round(hi / step);
    if (!fits(a * step)) return a * step;
    while (a < b) { const mid = Math.ceil((a + b) / 2); if (fits(mid * step)) a = mid; else b = mid - 1; }
    return a * step;
  }
  // "{damage} 1 → 3 → 5 → 7" -> [1, 3, 5, 7]   (null when the text is not a damage ladder)
  function damageSteps(text) {
    const m = /^\s*\{damage\}\s*([\d\s→>,\-]+)$/.exec(text);
    if (!m) return null;
    const nums = m[1].split(/[^\d]+/).filter(Boolean).map(Number);
    return nums.length ? nums : null;
  }
  // "1 {gem}" -> 1   (how many gems a Treasure card is worth)
  const gemWorth = text => { const m = /^\s*(\d+)\s*\{gem\}\s*$/.exec(text); return m ? Number(m[1]) : null; };
  const formatSize = u => (u / 100).toFixed(2) + ' in (' + (u * 0.01 * 72).toFixed(1) + ' pt)';
  return { parseCSV, table, cards, tokens, largestFitting, damageSteps, gemWorth, formatSize };
})();
</script>

<script id="dig">
/* =====================================================================
   DIG — the rules of one Dig (v2.7). No DOM. All numbers come from DDB.rules; card text is read through DDB.phrases.

   ===================================================================== */
const Dig = (() => {
  const R = DDB.rules, P = DDB.phrases, RL = R.rulings;

  function listItems(text) { const out = []; const re = /(Lose |\+)(\d+) \{(heart|reroll)\}/g; let m; while ((m = re.exec(text))) out.push({ lose: m[1] === 'Lose ', n: Number(m[2]), res: m[3] }); return out; }

    const h = match(PH.sentence, s); if (!h) return null; const m = h.m;
    switch (h.op) {
      case 'list': return { op: 'list', items: listItems(s) };
      case 'whenKept': { const k = match(PH.kept, s); return k ? { op: 'whenKept', kept: k.op } : null; }
      case 'gainHalf': case 'gainDmg': case 'block': case 'survive1': case 'halve': case 'defeat': case 'noDamage': case 'echo': case 'slide': case 'fill': case 'rewind': case 'shoo':
        return { op: h.op, n: m[1] ? Number(m[1]) : undefined };
      case 'gainPer': { const per = match(PH.per, m[3]); return per ? { op: 'gainPer', n: Number(m[1]), res: m[2], per: per.op } : null; }
      case 'ifNoOther': { const t = parseSentence(m[1]); return t ? { op: 'if', cond: { noOther: true }, then: t } : null; }
      case 'ifHeart': { const t = parseSentence(m[2]); return t ? { op: 'if', cond: { heartAtMost: Number(m[1]) }, then: t } : null; }
      case 'burnout': { const t = parseSentence(m[1]); return t ? { op: 'seq', list: [t, { op: 'burnout', n: Number(m[2]), max: Math.min(R.line.max, Number(m[3])) }] } : null; }
      case 'look': return { op: 'look', n: Number(m[1]) };
      case 'setHeart': return { op: 'setHeart', n: Number(m[1]) };
      case 'wishing': return { op: 'wishing', n: Number(m[1]) };

  }

  function parseEffects(text) {
    const w = match(PH.whole, text);

    const effects = [], dug = [], unsupported = [];

  }
  function parseOngoing(text) {
    const o = { watchers: [], mods: [], transforms: [], flags: {}, startDig: [], unsupported: [] };
    const w = match(PH.whole, text); if (w && w.op === 'clone') { o.flags.clone = true; return o; }
    const h = match(PH.ongoing, text); if (!h) { o.unsupported.push(text); return o; }
    const m = h.m, n = i => Number(m[i]);
    switch (h.op) {
      case 'whenever': {
        const ev = match(PH.events, m[1]), re = match(PH.reactions, m[2]);
        if (!ev || !re) { o.unsupported.push(text); break; }
        const min = ev.m[1] === undefined ? 1 : Number(ev.m[1]);
        if (re.op === 'gainMore') o.flags.amp_heart = Number(re.m[1]);
        else if (re.op === 'keepHigher') o.flags.twinDrill = true;
        else o.watchers.push({ ev: ev.op, min, react: { op: 'list', items: listItems(m[2]) } });

      case 'startDig': { const items = listItems(m[1]); if (!items.length) o.unsupported.push(text); else o.startDig.push({ op: 'list', items }); break; }
      case 'modPlain': o.mods.push({ plus: n(1) }); break;
      case 'modPer': o.mods.push({ plus: n(1), perSurvived: n(2) }); break;
      case 'modImm': o.mods.push({ plus: n(1), perImmediate: true, cap: n(2) }); break;
      case 'modVs': o.mods.push({ plus: n(1), vsDamage: n(2) }); break;
      case 'modLow': o.mods.push({ plus: n(2), heartAtMost: n(1) }); break;
      case 'modLethal': o.mods.push({ plus: n(1), lethal: true }); break;
      case 'becomes': o.transforms.push({ kind: 'becomes', from: n(1), to: n(2) }); break;
      case 'floor': o.transforms.push({ kind: 'floor', below: n(1), to: n(2) }); break;
      case 'sparkLow': o.flags.sparkLow = n(1); break;
      case 'double': o.transforms.push({ kind: 'double' }); break;
      case 'bounty': o.flags.bounty = n(1); break;
      case 'bumper': o.flags.bumper = n(1); break;
      case 'cowcatcher': o.flags.cowcatcher = true; break;
      case 'panic': o.flags.panic = true; break;

  }
  const supported = card => compile(card).unsupported.length === 0;

  // ---------------- a Dig ----------------
  let uid = 1;
  const copy = card => ({ ...card, uid: uid++ });
  const copies = card => Array.from({ length: card.count || 1 }, () => copy(card));
  // allCards: every card of the sheet. kit: Booster cards chosen for the Starter Kit. opts: { seed, start, dice }
  // opts: { seed, dice, start, extra: cards shuffled into the Mine (your acquired cards), board: { crown, final } for a run }
  function start(allCards, kit = [], opts = {}) {
    const seed = opts.seed === undefined || opts.seed === null ? null : opts.seed >>> 0;                  // no seed: the secure random source
    const st = { seed, rng: makeRng(seed), dice: opts.dice ? opts.dice.slice() : null, log: [], over: null, fight: null, pending: null, flags: {}, known: 0,
      mine: [], discard: [], monsterPile: [], line: [], ongoing: [], setCount: {}, beyond: 0,
      digs: 0, monstersDug: 0, survived: 0, defeated: 0, geodeGems: 0, monsterGems: 0, panicUsed: false,
      heart: 0, reroll: 0, rules: { ...R.start, ...(opts.start || {}) }, kit: [], board: opts.board || null, pledge: null };

    for (const c of starting) if (c.type === 'Ongoing') for (const k of copies(c)) st.ongoing.push(k);          // your other starting card: in play from the start, and not part of your Starter Kit (owner)

  const anyFlag = (st, name) => st.ongoing.some(o => compile(o).ongoing.flags[name] !== undefined);

    const before = st[res], cap = R.caps[res]; st[res] = Math.min(cap, before + want); const got = st[res] - before;

  }

      case 'immediateInDiscardThis': return st.discard.filter(c => c.type === 'Immediate').length + 1;

  }

/* =====================================================================

/* =====================================================================
   OPPONENT — the most basic AI, and the Match that runs you against it. The AI is another Run on the same Leaderboard, Booster Deck and Trash.
   It plays only from what a player can see: its own Dig and the Leaderboard. It digs at its own pace (you watch it climb the Leaderboard); once you
   are done, Fast forward speeds it up.
   ===================================================================== */
const AI = (() => {
  const R = DDB.rules, A = DDB.ai;
  // One action of the AI's Dig. Returns false when there is nothing to do.
  // It rerolls when it wants an effect (the Pet first) and did not get it, and does not bank
  // for the lead while it is confident it can go further.
  function act(run) {
    const st = run.dig; if (!st || st.over) return false;
    Run.refresh(run);
    const c = Dig.can(st), f = st.fight;
    if (c.choose) { Dig.chooseClone(st, st.line.find(e => !e.pet) || st.line[0]); return true; }
    if (f) {
      if (f.phase === 'before') { Dig.roll(st); return true; }
      const total = Dig.result(st).total, pet = st.line.find(e => e.pet);
      const wantsMore = (pet && pet.at > total) || (!Dig.eligible(st).length && st.line.length > 0);          // the Pet is out of reach, or no card on the line has triggered
      if (c.reroll && wantsMore && f.rolls < A.maxRolls) { Dig.reroll(st); return true; }
      Dig.autoFace(st); return true;
    }
    if (st.board.final && st.board.lead) return false;                       // in the final round the leader waits; everyone else has to keep digging
    const confident = st.heart >= A.confidentHealth;

    if (c.dig) { Dig.dig(st); return true; }

  function prep(run) {

    if (run.prep.step === 'keep') { for (const c of run.prep.offer.slice(0, Run.keepCount(run))) Run.toggleKeep(run, c.uid); Run.confirmKeep(run); }
    if (run.prep.step === 'kit' && !run.prep.kitPick.length) {
      const pool = Dig.shuffle({ rng: run.rng }, run.owned.slice());
      for (const c of pool.slice(0, run.prep.kitMax)) Run.toggleKit(run, c.uid);
    }
  }
  return { act, prep };
})();

const Match = (() => {
  const HUMAN = 'me', BOT = 'ai';
  const rollDie = m => (m.dice && m.dice.length ? m.dice.shift() : 1 + m.rng.int(R_.die));
  const R_ = DDB.rules;
  const human = m => m.runs[HUMAN], bot = m => m.runs[BOT];
  function start(all, opts = {}) {
    const seed = opts.seed === undefined || opts.seed === null ? null : opts.seed >>> 0, rng = Dig.makeRng(seed), colors = DDB.table.playerColors;
    const board = Board.create([{ id: HUMAN, name: 'You', color: colors[0] }, { id: BOT, name: 'AI', color: colors[1], ai: true }]);
    const shared = { board, deck: Run.makeDeck(all, rng), trash: [] };
    const m = { seed, rng, dice: opts.dice ? opts.dice.slice() : null, all, board, deck: shared.deck, trash: shared.trash, rounds: opts.rounds || DDB.run.rounds, runs: {}, result: null, aiDug: 0 };
    m.runs[HUMAN] = Run.start(all, { ...opts, seed, me: HUMAN, shared });
    m.runs[BOT] = Run.start(all, { ...opts, seed: seed === null ? null : seed + 1, me: BOT, shared });

  }
  // The AI digs one card (and plays out any Monster it finds). It does this on its own clock (see the game screen), not when you tap.
  function aiStep(m) {
    const ai = bot(m); if (!ai.dig || ai.dig.over || ai.phase !== 'dig') return false;
    const st = ai.dig, before = st.digs;

  function finalCheck(m) { return Run.finalCheck([human(m), bot(m)]); }

  function settle(m) {

    for (let n = 0; n < 600 && !ai.dig.over; n++) { if (!AI.act(ai)) { if (finalCheck(m)) continue; break; } Run.checkOver(ai); finalCheck(m); }
    if (!ai.dig.over) throw new Error('the AI could not finish its Dig');

  function rollEscape(m) {

  }

  function openPack(m) {

    if (!Run.beginDig(me)) return false;                         // yours first: before round 1 the card you chose leaves the deck, so the AI cannot take it
    AI.prep(ai);
    return Run.beginDig(ai);
  }
  // Tap "To Prep": the round is over for both. The Board has already changed; now the Preps (or the end of the run).
  function finishRound(m) {
    const me = human(m), ai = bot(m);
    settle(m);
    if (!Run.finishDig(me)) return false;
    Run.finishDig(ai);
    if (me.phase === 'done') {
      const w = Board.holder(m.board);
      m.result = { winner: w, human: w === HUMAN, rounds: me.history.map((h, i) => ({ round: h.round, me: h, ai: ai.history[i] })), bests: { me: me.best, ai: ai.best } };
      return true;
    }
    if (ai.prep && ai.prep.step === 'escape' && me.prep.step !== 'escape') rollEscape(m);     // you went BOOM, but the AI banked: someone still rolls
    return true;
  }
  function save(m) {
    const refOf = c => ({ id: c.id, uid: c.uid });
    return { v: 1, seed: m.seed, rng: m.rng.state(), dice: m.dice, rounds: m.rounds, escape: m.escape, aiDug: m.aiDug, result: m.result, board: m.board, deck: m.deck.map(refOf), trash: m.trash.map(refOf),
      runs: { [HUMAN]: Run.save(human(m)), [BOT]: Run.save(bot(m)) } };
  }
  function load(all, d) {
    if (d.v !== 1) throw new Error('an older save');
    const memo = new Map();
    const deref = r => { if (memo.has(r.uid)) return memo.get(r.uid); const base = all.find(x => x.id === r.id); if (!base) throw new Error('the sheet no longer has card ' + r.id); const c = { ...base, uid: r.uid }; memo.set(r.uid, c); return c; };
    const rng = Dig.makeRng(d.seed); rng.restore(d.rng);
    const shared = { board: d.board, deck: d.deck.map(deref), trash: d.trash.map(deref) };
    const m = { seed: d.seed, rng, dice: d.dice, all, board: shared.board, deck: shared.deck, trash: shared.trash, rounds: d.rounds, escape: d.escape, aiDug: d.aiDug, result: d.result, runs: {} };
    for (const k of memo.keys()) Run.reserve(k);
    m.runs[HUMAN] = Run.load(all, d.runs[HUMAN], shared); m.runs[BOT] = Run.load(all, d.runs[BOT], shared);

  }

})();
</script>

<script id="ui">

    return `<div style="position:relative;--u:${scale}px;width:${u(250)};height:${u(350)};overflow:hidden;border-radius:${u(12.5)};flex:none"><div style="position:absolute;left:${u(-12.5)};top:${u(-12.5)}">${card}</div></div>`;
  }
  // ---------------- the chosen design: Top Tab, Geode = stat 3, Monster = stat 1, standard art ----------------
  const statFor = c => c.type === 'Treasure' ? 3 : c.type === 'Monster' ? 1 : 0;
  // For the game screen: one card in the chosen design, as cut, at `scale` pixels per 0.01 in. Text size is the deck's uniform size.
  let twCache = { key: '', tw: 20 };
  function deckTextSize() {
    const key = state.all.length + state.source;
    if (twCache.key === key) return twCache.tw;
    const b = R2.textBox(); let tw = 44;
    for (const c of state.all) if (c.type !== 'Monster' && c.type !== 'Treasure' && Dig.supported(c)) tw = Math.min(tw, fitFont(textHTML(c.text), b.w, b.h));
    twCache = { key, tw }; return tw;
  }
  function playCard(c, scale, opts = {}) { return r2Card(c, deckTextSize(), 'compact', statFor(c), scale, opts.step, opts.gem); }
  Object.assign(window.DigDigBoomUI.api, { ic, textHTML, esc, playCard, gemAt, gemOf, gemSvg, monsterLook });
  function deckHTML(scale) {
    const pool = state.all.filter(c => c.type !== 'Monster' && c.type !== 'Treasure' && Dig.supported(c));
    const b = R2.textBox(); let tw = 44;
    for (const c of pool) tw = Math.min(tw, fitFont(textHTML(c.text), b.w, b.h));
    const order = Object.keys(D.types), list = state.all.filter(c => Dig.supported(c) && (state.filter === 'all' || c.type === state.filter)).sort((a, b2) => order.indexOf(a.type) - order.indexOf(b2.type));
    const cells = list.flatMap(c => c.type === 'Treasure' ? D.gems.map((g, i) => `<div class="cell">${r2Card(c, tw, 'compact', statFor(c), scale, undefined, i)}<span class="cap">${esc(c.id)} · ${esc(c.name)} · ${esc(g.name)} ×${Math.round(c.count / D.gems.length)}</span></div>`) : [`<div class="cell">${r2Card(c, tw, 'compact', statFor(c), scale)}<span class="cap">${esc(c.id)} · ${esc(c.name)}${c.count > 1 ? ' ×' + c.count : ''}</span></div>`]).join('');
    return `<section class="dir" id="deck" data-round="deck"><h2>The whole deck</h2>
      <p class="sub">Coloured border and header with the name, type and Power number; no art slot, so the rules text gets the whole card. A Geode is one giant count-and-gem on a brown card, and every Geode is a different gem (six colours and cuts, three of each), so a flip is a little surprise. Monsters: art, then the damage ladder in big tiles, with the gems a survived Monster is worth. Rules text is <b>${E.formatSize(tw)}</b> on every card. ${list.length} cards, live from your sheet.</p>
      <div class="row" id="deckRow">${cells}</div></section>`;
  }
  // ---------------- small helpers for the card drawing (all numbers are units of 0.01 in) ----------------
  const box = (x, y, w, h, cls, style, inner = '') => `<div class="abs ${cls}" style="left:${u(x)};top:${u(y)};width:${u(w)};height:${u(h)};${style}">${inner}</div>`;
  // Monsters have art (a placeholder until real art arrives): each Monster set is its own creature on its own colour of sunburst, so A and B are different at a glance.
  function monsterLook(c) {
    const looks = D.monsterLooks, mons = state.all.filter(x => x.type === 'Monster' && x.deck === D.rules.startingDeck), i = mons.findIndex(x => x.id === c.id);
    return i >= 0 ? looks[i % (looks.length - 1)] : looks[looks.length - 1];
  }
  function artBox(x, y, w, h, c) {
    const k = monsterLook(c), letter = (c.name.match(/\s([A-Z])$/) || [])[1];
    const style = `font-size:${u(11)};background:radial-gradient(circle at 50% 60%, ${k.hot} 0 20%, rgba(255,255,255,0) 48%), repeating-conic-gradient(from 0deg at 50% 60%, ${k.c1} 0 9deg, ${k.c2} 9deg 18deg);border-color:${k.border}`;
    const badge = letter ? `<span style="position:absolute;left:${u(8)};top:${u(6)};width:${u(30)};height:${u(30)};border-radius:50%;background:#fffaf0;border:${u(2.5)} solid ${k.border};color:${k.ink};font-weight:900;font-size:${u(20)};line-height:${u(25)};text-align:center;letter-spacing:0">${letter}</span>` : '';
    return box(x, y, w, h, 'art vivid', style, `<svg viewBox="0 0 24 24" style="color:${k.ink}"><use href="#${k.sym}"/></svg>${badge}`);
  }
  const powerBadge = (x, y, d, c) => c.number === null ? '' : box(x, y, d, d, 'num', `font-size:${u(d * 0.64)};border-width:${u(4)};border-color:#1d1712`, String(c.number));
  const typeColors = c => D.types[c.type];
  // ---------------- the page ----------------
  function statusLine() {
    if (state.status === 'loading') return '<span class="status">Reading your sheet…</span>';
    if (state.source === 'sheet') return `<span class="status"><b>Live from your sheet</b> · ${state.all.length} cards read just now</span>`;
    if (state.source === 'cache') return `<span class="status bad"><b>Could not reach the sheet</b> (${esc(state.error)}). Using the copy from ${new Date(state.cachedAt).toLocaleString()}. <button class="chip" data-act="reload">Try again</button></span>`;
    return `<span class="status bad"><b>Could not reach the sheet</b> (${esc(state.error)}). Showing a 6-card design sample only. <button class="chip" data-act="reload">Try again</button></span>`;
  }
  function render() {
    if (document.body.dataset.mode !== 'cards') return;
    const libLink = /^https?:$/.test(location.protocol) ? `<a class="back libback" href="${esc(D.library.href)}"><span>‹</span> ${esc(D.library.name)}</a>` : '';
    const scale = Math.min(innerWidth - 40, 1000) < 500 ? 0.78 : 1;
    let html = `<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">${libLink}${statusLine()}</div>
      <h1>${esc(D.title)} — the cards</h1>
      <div class="bar">
        <button class="chip" data-act="mode" data-v="play">▶ Play</button>
        <span class="note">Show</span> ${['all', ...Object.keys(D.types)].map(t => `<button class="chip ${state.filter === t ? 'on' : ''}" data-act="filter" data-v="${t}">${t === 'all' ? 'All' : t}</button>`).join('')}
        ${[['color', 'Colour'], ['gray', 'Greyscale'], ['deut', 'Red-green (deuteranopia)'], ['prot', 'Red-green (protanopia)']].map(([v, t]) => `<button class="chip ${state.view === v ? 'on' : ''}" data-act="view" data-v="${v}">${t}</button>`).join('')}
      </div>`;
    if (!state.all.length) { $app.innerHTML = html; return; }
    html += deckHTML(scale);
    html += `<details><summary>Icon key</summary><p class="sub">${Object.keys(D.iconCodes).map(k => `${ic(k, ' style="width:28px;height:28px;vertical-align:middle"')} {${k}}`).join(' &nbsp; ')}</p></details>`;
    html += `<p class="status" style="margin-top:24px">Version ${esc(BUILD)}</p>`;
    $app.className = 'view-' + state.view;
    $app.innerHTML = html;
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act;
    if (a === 'view') state.view = el.dataset.v;
    else if (a === 'filter') state.filter = el.dataset.v;
    else if (a === 'reload') { load(); return; }
    else if (a === 'mode') { setMode(el.dataset.v); return; }
    render();
  });
  let lastW = innerWidth;
  window.addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 2) return; lastW = innerWidth; clearTimeout(window.__rz); window.__rz = setTimeout(render, 150); });     // (width only: a tall screenshot changes the height)
  load();
})();
</script>
<script id="solo">
/* =====================================================================

(() => {
  'use strict';
  const D = DDB, R = D.rules, UI = window.DigDigBoomUI, A = UI.api, $ = document.getElementById('play');

  function recordBest(st) {
    const b = readBest(), prev = { ...b }, sc = Dig.score(st);
    if (sc.survived > b.survived) b.survived = sc.survived;
    if (st.over.kind === 'bank' && sc.total > b.gems) b.gems = sc.total;
    try { localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (e) { /* private window: fine */ }

  }
  // The game is saved in this browser after every tap, so a reload (iPad Safari does that) puts you back where you were.
  const SAVE_KEY = 'ddb.solo.save.v1';
  function persist() {

      const panel = S.panel === 'menu' || S.panel === 'more' ? S.back : S.panel;

      localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 2, panel, match: S.match ? Match.save(S.match) : null, run: S.run && !S.match ? Run.save(S.run) : null, st: !S.run && S.st ? Dig.save(S.st) : null, opp: S.opp, kit: S.kit, kitSize: S.kitSize, start: S.start, rounds: S.rounds}));
    } catch (e) { /* private window or full: fine, it just will not resume */ }
  }
  function restore() {
    if (S.restored || !cards().length || UI.state.source === 'sample') return;
    S.restored = true;
    try {
      const raw = localStorage.getItem(SAVE_KEY); if (!raw) return;
      const d = JSON.parse(raw); if (d.v !== 2) return;
      const match = d.match ? Match.load(cards(), d.match) : null, run = match ? Match.human(match) : d.run ? Run.load(cards(), d.run) : null, st = run ? run.dig : d.st ? Dig.load(cards(), d.st) : null;
      S.match = match; S.opp = d.opp !== false; S.run = run; S.st = st; S.fx = fxOf(st); S.kit = d.kit || []; S.kitSize = d.kitSize; S.start = d.start; S.rounds = d.rounds; S.back = d.panel;
      // Tapping the game on the shelf (a fresh visit) opens the main menu, where Continue waits; a reload (iPad Safari does that to a backgrounded tab) puts you straight back where you were.
      const nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};

    } catch (e) { try { localStorage.removeItem(SAVE_KEY); } catch (e2) { /* ignore */ } S.run = null; S.match = null; S.st = null; S.panel = 'menu'; }
  }
  const typeIcon = t => `<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#${D.types[t].icon}"/></svg>`;
  const ic = (c, st = '') => A.ic(c, st);
  const T = text => A.textHTML(text);

  // ----- a card as a table piece: coloured header (icon, name, number) and its effect text -----

  }
  function findCard(uid) {

    const pool = [...st.line.map(e => e.card), ...st.ongoing, ...st.discard, ...st.monsterPile, ...st.mine, st.last, st.fight && st.fight.monster, ...st.kit].filter(Boolean);

  function setupHTML() {

        <span class="note" style="margin-left:auto">Kit size ${stepper('size', S.kitSize)}</span>

      <details style="margin-top:12px"><summary>Testing options — where your tracks start</summary>
        <p class="note">By the rules a Dig starts at Health ${R.start.heart}, Rerolls ${R.start.reroll}. Change them here only to try things out.</p>
        <p>${ic('heart', ' style="width:26px;height:26px;vertical-align:middle"')} Health ${stepper('stat', S.start.heart).replace(/data-p="stat"/g, 'data-p="stat" data-r="heart"')}
        &nbsp; ${ic('reroll', ' style="width:26px;height:26px;vertical-align:middle"')} Rerolls ${stepper('stat', S.start.reroll).replace(/data-p="stat"/g, 'data-p="stat" data-r="reroll"')}</p>
        <p class="note">Seed (a number; leave empty for a random Dig; the same seed gives the same Mine and dice): <input id="seedIn" inputmode="numeric" pattern="[0-9]*" value="${S.seed === undefined ? '' : S.seed}" style="width:130px;min-height:40px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--text);padding:0 10px;font-size:16px"></p>

  }


  // ----- the menu, the Leaderboard, Prep and the end of a run -----
  // ----- the main menu: the front of the box -----
  const BOMB = `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M20 8c2-3 5-3 7-6" fill="none" stroke="#c79a5a" stroke-width="2.4" stroke-linecap="round"/><circle cx="14" cy="19" r="10" fill="#2a2530" stroke="#0c0a10" stroke-width="2"/><ellipse cx="10.5" cy="15" rx="3" ry="2" fill="#fff" opacity=".35" transform="rotate(-35 10.5 15)"/><path d="M27 1l1.3 2.6 2.7.4-2 1.9.5 2.7L27 7.1l-2.5 1.3.5-2.7-2-1.9 2.7-.4z" fill="#ffd54a" stroke="#e8731a" stroke-width=".8"/></svg>`;
  // The picture: the real cards. Six Geodes in their six gems flip over one at a time with a burst of shards (never more than two face up at once), a Monster looms behind them.

    return `<div class="home">${libLink}<div class="homegrid">${heroHTML()}

    return `<div class="panel setup"><div class="scroll">

      <li><b>Beyond the Mine</b>: when the Mine runs out, Bonus Monsters keep coming: ${R.beyond.firstDamage}, ${R.beyond.firstDamage + 1}, … damage, worth ${R.beyond.gems} gems.</li></ul>
      <p><b>A run</b> (Play a run): ${D.run.roundChoices.join(' or ')} rounds, each a Dig then a Prep. <b>Before round 1</b> you open a ${D.run.firstPack} Pack (draw 3, keep 1) and choose your Starter Kit from the cards you own; any place you leave empty is filled with a gem. <b>After a Dig</b>: if you banked, tap the die for your Escape Bonus; your gems (Geodes + Monsters survived + the die) pick a Booster Pack from the reward ladder (BOOM: a ${D.run.boomPack} Pack): open it, keep some of the cards; then choose a Starter Kit from your cards (1, 2, 2, 3 by round). Your cards go on top of your Mine, face up, so you see them coming: the Starter Kit first, in the order you chose, then the rest; the Starting cards are shuffled below, unknown. Monsters you are done with go in the Monster pile at the top (each set's ladder shows how many you have met).</p>
      <p><b>Leaderboard</b>: positions are Monsters survived. The Crown tracker starts at ${D.run.crownStart}. Before the Crown you dig or bank freely. There is no pledging in this version: your marker on the Leaderboard moves by itself the moment you encounter a Monster (before you have faced it), so you always see where you stand. Bank above the tracker and you take the Crown Jewel and move the tracker. A BOOM locks in nothing, but your best stays. The <b>final round</b> is a race: nobody banks. Whoever is in the lead (past the tracker, and ahead of everyone else's best and live number) may wait; everyone else has to keep digging, and rolling tens is how you catch up. If someone passes the leader, the old leader has to dig again. The round ends when everyone but the leader has gone BOOM, and the leader takes the Crown Jewel. Hold the Crown Jewel at the end and you win. On the Leaderboard: the ring is where you are in this Dig, the dot is your best locked-in Dig, the crown is the Crown tracker.</p>
      <p><b>Your two starting cards</b> are in play at the start of every Dig and do not count against your Starter Kit: your Pet (a Power card at 10: defeat the Monster) and the starting Ongoing card beside it (when the Monster's damage is equal to or greater than your Health, +1 to your roll).</p>
      <p><b>The AI</b> digs on its own clock while you dig, and preps at the same time as you (it opens its Booster Pack when you open yours). When you are done and it is not, tap Fast forward. It spends Rerolls to get useful cards going, and keeps digging rather than banking while its Health is high.</p>
      <p><b>Calls made where the rules are unclear</b> (all in QUESTIONS.md, one line each to change):</p>
      <ul><li>The die is a d${R.die}; Health starts at ${R.start.heart}, Rerolls ${R.start.reroll}.</li>
      <li>Cards that trigger resolve highest number first, then damage is halved before Block is taken off.</li>
      <li>"Whenever you gain" only counts when the track actually moves.</li>
      <li>Result changes apply in order: bonuses, then double, then "becomes", then "less than".</li>
      <li>You may bank between any two cards (there is no pledging).</li></ul>
      <p><a href="#" data-p="cards">Card designs</a></p></div></div><div class="foot"><button class="btn" data-p="closehelp">${S.panel === 'menu' || S.panel === 'more' ? 'Back' : 'Back to the table'}</button></div></div>`;
  }
  function render() {
    if (document.body.dataset.mode !== 'play') return;
    const keep = $.querySelector('#setupScroll'), ks = keep ? keep.scrollTop : 0;
    const bar = `<div class="pbar"><h1><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M20 8c2-3 5-3 7-6" fill="none" stroke="#c79a5a" stroke-width="2.4" stroke-linecap="round"/><circle cx="14" cy="19" r="10" fill="#2a2530" stroke="#0c0a10" stroke-width="2"/><ellipse cx="10.5" cy="15" rx="3" ry="2" fill="#fff" opacity=".35" transform="rotate(-35 10.5 15)"/><path d="M27 1l1.3 2.6 2.7.4-2 1.9.5 2.7L27 7.1l-2.5 1.3.5-2.7-2-1.9 2.7-.4z" fill="#ffd54a" stroke="#e8731a" stroke-width=".8"/></svg>Dig Dig BOOM!</h1><button class="chip" data-p="gmenu">Menu</button></div>`;
    let body;
    if (S.panel === 'menu') body = homeHTML();
    else if (S.panel === 'more') body = moreHTML();
    else if (S.panel === 'prep' && S.run) body = prepHTML();
    else if (S.panel === 'done' && S.run) body = doneHTML();
    else if (S.panel === 'setup' || !S.st) body = setupHTML();
    else body = `<div class="pmain"><div class="ptable">${tableHTML()}</div></div>`;
    const z = S.zoom ? `<div class="zoom" data-p="unzoom">${A.playCard(S.zoom, Math.min(1.35, (innerHeight - 70) / 350))}${Dig.supported(S.zoom) ? '' : '<div class="warn">This card\'s effect is not built yet.</div>'}<div class="closehint">tap anywhere to close</div></div>` : '';
    $.innerHTML = (S.panel === 'menu' ? '' : bar) + body + (S.gmenu ? gmenuHTML() : '') + (S.help ? helpHTML() : '') + z;
    const sc = $.querySelector('#setupScroll'); if (sc) sc.scrollTop = ks;
    fitHero(); playDice();
    scheduleAI();
  }

  // ----- the AI's clock -----
  // The AI digs on its own, one card per D.ai.paceMs, whether or not you tap. Once you are done, Fast forward makes it D.ai.fastMs.
  // While you are still playing only the Leaderboard is redrawn, so a tick never swallows a tap on the table.
  let aiTimer = null;
  const aiDigging = () => { const ai = S.match && S.run && S.run.phase === 'dig' ? Match.bot(S.match) : null; return !!(ai && ai.dig && !ai.dig.over); };
  const pace = () => S.ff ? D.ai.fastMs : (window.DDB_AI_PACE || D.ai.paceMs);
  function scheduleAI() { if (!aiDigging()) { S.ff = false; return; } if (!aiTimer) aiTimer = setTimeout(aiTick, pace()); }
  function aiTick() {
    clearTimeout(aiTimer); aiTimer = null;
    if (!aiDigging()) return;
    Match.aiStep(S.match); if (S.run.dig && !S.run.dig.over) Run.refresh(S.run); persist();
    const lb = $.querySelector('section.lb');
    if (S.panel === 'dig' && !S.help && !S.zoom && lb && aiDigging()) { lb.outerHTML = lbHTML(S.run, S.st); scheduleAI(); }
    else if (S.panel === 'dig' && !S.help && !S.zoom) render();
    else scheduleAI();
  }

  // ----- taps -----
  function newDig() {
    const by = id => cards().find(c => c.id === id);
    const inp = $.querySelector('#seedIn'); if (inp) S.seed = inp.value.trim() === '' ? undefined : Number(inp.value) >>> 0;
    S.st = Dig.start(cards(), S.kit.map(by).filter(Boolean), { start: S.start, seed: S.seed }); S.panel = 'dig'; S.zoom = null;
  }
  function act(a, el) {
    const st = S.st, f = st && st.fight, ds = el.dataset; 
    if (a !== 'startrun' && a !== 'practice') S.confirmNew = null;
    switch (a) {
      case 'menu': if (S.panel !== 'menu' && S.panel !== 'more') S.back = S.panel; S.panel = 'menu'; S.help = false; S.gmenu = false; break;
      case 'more': S.panel = 'more'; break;
      case 'gmenu': S.gmenu = true; break;
      case 'gmenuclose': S.gmenu = false; break;
      case 'mainmenu': if (S.panel !== 'menu' && S.panel !== 'more') S.back = S.panel; S.panel = 'menu'; S.gmenu = false; S.help = false; break;
      case 'resume': S.panel = S.back || 'menu'; break;
      case 'practice': if (resumable() && S.confirmNew !== 'practice') { S.confirmNew = 'practice'; break; } S.confirmNew = null; S.run = null; S.match = null; S.st = null; S.panel = 'setup'; S.back = null; break;
      case 'rounds': S.rounds = Number(ds.v); break;
      case 'startrun': { if (resumable() && S.confirmNew !== 'startrun') { S.confirmNew = 'startrun'; break; } S.confirmNew = null; if (S.opp) { S.match = Match.start(cards(), { rounds: S.rounds }); S.run = Match.human(S.match); } else { S.match = null; S.run = Run.start(cards(), { rounds: S.rounds }); } S.st = null; S.panel = 'prep'; S.back = null; S.zoom = null; break; }
      case 'escape': if (S.match) Match.rollEscape(S.match); else Run.rollEscape(S.run); break;
      case 'openpack': if (S.match) Match.openPack(S.match); else Run.openPack(S.run); break;
      case 'pick': Run.toggleKeep(S.run, Number(ds.uid)); break;
      case 'keepgo': Run.confirmKeep(S.run); break;
      case 'kitpick': Run.toggleKit(S.run, Number(ds.uid)); break;
      case 'startround': if (S.match ? Match.beginRound(S.match) : Run.beginDig(S.run)) { S.st = S.run.dig; S.panel = 'dig'; S.ff = false; } break;
      case 'ff': S.ff = true; if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; } break;
      case 'prep': if (S.match) Match.finishRound(S.match); else Run.finishDig(S.run); S.panel = S.run.phase === 'done' ? 'done' : 'prep'; break;
            case 'tab': S.tab = ds.v; break;
      case 'kit': { const c = cards().find(x => x.id === ds.id); if (!c || !Dig.supported(c)) break; const i = S.kit.indexOf(c.id); if (i >= 0) S.kit.splice(i, 1); else if (S.kit.length < S.kitSize) S.kit.push(c.id); break; }
      case 'size': S.kitSize = Math.max(0, Math.min(8, S.kitSize + Number(ds.d))); S.kit = S.kit.slice(0, S.kitSize); break;
      case 'stat': { const r = ds.r, v = S.start[r] + Number(ds.d); S.start[r] = Math.max(r === 'heart' ? 1 : 0, Math.min(R.caps[r], v)); break; }
      case 'random': { const pool = boosters().filter(Dig.supported); S.kit = []; const rr = Dig.makeRng(); while (S.kit.length < Math.min(S.kitSize, pool.length)) { const c = pool[Math.floor(rr() * pool.length)]; if (!S.kit.includes(c.id)) S.kit.push(c.id); } break; }
      case 'clear': S.kit = []; break;
      case 'go': S.run = null; S.match = null; newDig(); break;
      case 'again': S.seed = undefined; newDig(); break;
      case 'setup': S.run = null; S.match = null; S.panel = 'setup'; S.help = false; break;
      case 'help': S.help = true; S.gmenu = false; break;
      case 'closehelp': S.help = false; break;
      case 'cards': S.help = false; UI.setMode('cards'); return;
      case 'unzoom': S.zoom = null; break;
      case 'zoom': S.zoom = findCard(ds.uid); break;
      case 'card': { const c = findCard(ds.uid), e = st && st.line.find(x => x.card === c); if (st && st.pending && e) Dig.chooseClone(st, e); else if (e && f && f.phase === 'after' && Dig.eligible(st).includes(e)) Dig.trigger(st, e); else S.zoom = c; break; }
      case 'triggerall': if (st) Dig.triggerAll(st); break;
      case 'dig': if (st) Dig.dig(st); break;
      case 'roll': Dig.roll(st); break;
      case 'reroll': if (f && f.phase === 'after') Dig.reroll(st); break;
      case 'face': Dig.face(st); break;
      case 'bank': if (S.run) Run.bank(S.run); else Dig.bank(st); break;
      case 'heart': break;
    }
    if (S.run) { Run.checkOver(S.run); if (S.run.phase === 'dig') Run.refresh(S.run); if (S.match) Match.finalCheck(S.match); else Run.finalCheck([S.run]); }
    if (S.st && S.st.over && !S.st.best && !S.run) recordBest(S.st);
    persist(); render();
  }
  $.addEventListener('click', e => { const el = e.target.closest('[data-p]'); if (!el || el.disabled) return; e.preventDefault(); act(el.dataset.p, el); });
  document.addEventListener('ddb-cards', () => { restore(); render(); }); document.addEventListener('ddb-mode', render);
  window.addEventListener('resize', () => { if (document.body.dataset.mode === 'play') fitHero(); });
  window.DigDigBoomPlay = { S, render, act: (a, d) => act(a, { dataset: d || {} }), tick: aiTick };
  render();
})();
</script>
</body>
</html>
