3.0%20112.3%20L69.9%20110.1%20L67.1%20107.4%20L64.7%20104.2%20L62.7%20100.8%20L61.2%2097.1%20L60.2%2093.1%20L59.7%2089.0%20L59.8%2084.9%20L60.4%2080.7%20L61.7%2076.7%20L63.5%2072.8%20L65.8%2069.1%20L68.7%2065.8%20L72.0%2062.8%20L75.7%2060.4%20L79.7%2058.4%20L84.1%2057.0%20L88.6%2056.1%20L93.2%2055.9%20L97.9%2056.4%20L102.5%2057.4%20L107.0%2059.2%20L111.2%2061.5%20L115.1%2064.4%20L118.6%2067.8%20L121.6%2071.8%20L124.1%2076.1%20L126.0%2080.8%20L127.2%2085.7%20L127.8%2090.8%20L127.7%2096.0%20L126.8%20101.1%20L125.3%20106.1%20L123.0%20111.0%20L120.1%20115.4%20L116.6%20119.5%20L112.5%20123.1%20L108.0%20126.2%20L103.0%20128.6%20L97.7%20130.3%20L92.2%20131.3%20L86.5%20131.6%20L80.8%20131.0%20L75.2%20129.7%20L69.8%20127.6%20L64.7%20124.8%22%20fill=%22none%22%20stroke=%22%234a2e1c%22%20stroke-width=%229%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
:root { --bg: #1b130e; --panel: #271a12; --line: #4a3524; --text: #f1e6d2; --dim: #a8957a; --accent: #f5a524; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Segoe UI, Roboto, sans-serif; }
body { background: radial-gradient(ellipse at 50% -10%, #3a2616, var(--bg) 65%) fixed; padding: max(22px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
main { max-width: 980px; margin: 0 auto; }
header { text-align: center; margin: 14px 0 26px; }
h1 { margin: 0; font-size: clamp(34px, 7vw, 54px); letter-spacing: .5px; }
.tag { margin: 6px 0 0; color: var(--dim); font-size: clamp(15px, 2.4vw, 18px); }
/* the shelf: each game is a board-game box — its own cover art, a thick edge, and an info band (players, time) */
.shelf { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 330px)); justify-content: center; gap: 34px 28px; list-style: none; margin: 0; padding: 0 0 12px; }
.box { display: block; position: relative; border-radius: 14px; text-decoration: none; color: inherit; overflow: hidden; background: #120b07;
  border: 3px solid rgba(255,255,255,.16); box-shadow: 0 9px 0 #0a0604, 0 9px 0 3px rgba(255,255,255,.07), 0 20px 30px rgba(0,0,0,.55);
  transform: rotate(var(--tilt, 0deg)); transition: transform .14s ease, box-shadow .14s ease; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.box:active { transform: translateY(6px) rotate(var(--tilt, 0deg)); box-shadow: 0 3px 0 #0a0604, 0 8px 14px rgba(0,0,0,.5); }
.art svg { display: block; width: 100%; height: auto; }
.strip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 9px 12px 10px; background: linear-gradient(180deg, #2a1a10, #1a100a); border-top: 2px solid rgba(255,255,255,.12); }
.strip .pill { font-size: 15px; font-weight: 800; padding: 4px 11px; border-radius: 99px; background: #3a281b; color: var(--text); white-space: nowrap; }
.strip .played { margin-left: auto; font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; background: var(--accent-c); color: #1b130e; border-radius: 99px; padding: 4px 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
footer { margin-top: 34px; text-align: center; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<main id="app"></main>

<!-- =====================================================================
     DATA BLOCK — the catalogue.  To add a game: put it in games/<id>/index.html and add an entry here.
     `listed: false` keeps a game off the shelf (open the library with ?unlisted to see it).
     An entry with `url` instead of `path` links out to a separate site (e.g. the flagship).
     ===================================================================== -->
<script id="data">
const LIBRARY = {
  name: 'Tabletop Library',
  tagline: 'Games designed by Patrick Blim-Hockberger',   // all games in the library share one designer, so it is said once, at the top
  games: [
    {
      id: 'fossil-frenzy',
      title: 'Fossil Frenzy',
      tagline: 'A fast memory game: peek, flip, match and bank fossils — pass and play, or take on five opponents in the campaign.',
      players: '1–4 players',
      minutes: '15–20 min',
      icon: '🦖',
      art: 'fossil-frenzy',        // which cover art to draw (see ART below)
      accent: '#d9953a',
      path: 'games/fossil-frenzy/index.html',
      listed: true,
    },
    {
      id: 'dig-dig-boom',
      title: 'Dig Dig Boom',
      tagline: 'The flagship — its own site. Put its web address in `url` and set `listed: true` to put it on the shelf.',
      players: '',
      minutes: '',
      icon: '💣',
      art: 'dig-dig-boom',
      accent: '#c4553b',
      url: null,
      listed: false,
    },
  ],
};
</script>

<script id="ui">
(() => {
  'use strict';
  const L = LIBRARY;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const PLAYED = id => 'tabletop-library-played-' + id;
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable: fine */ } },
  };
  const BUILD = (() => { const m = document.querySelector('meta[name=build]'); const v = m ? m.content : ''; return !v || v.startsWith('__') ? 'local file' : v; })();
  const showUnlisted = /[?&]unlisted\b/.test(location.search);
  const href = g => g.path || g.url || '';

  // ---- the cover art: one picture per game, drawn as a toy-like scene (never text-heavy: the name, and what you get to play with) ----
  const hex = (cx, cy, r) => Array.from({ length: 6 }, (_, i) => { const a = Math.PI / 180 * (60 * i - 30); return (cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1); }).join(' ');
  const ART = {
    // Fossil Frenzy: the real board of 31 fossil tiles — most face down (umber, with an ammonite spiral), a few turned up in the players' colours
    'fossil-frenzy': () => {
      const S = 18, W = Math.sqrt(3) * S, cx = 150, cy = 221, up = { 5: ['7', '#4f8cff'], 6: ['7', '#4f8cff'], 13: ['💎', '#ff5a5f'], 20: ['3', '#ff5a5f'], 25: ['10', '#3ecf8e'] };
      const corners = new Set(['3,0', '-3,0', '0,3', '0,-3', '3,-3', '-3,3']);
      let k = 0, tiles = '';
      for (let r = -3; r <= 3; r++) for (let q = -3; q <= 3; q++) {
        if (Math.abs(q + r) > 3 || corners.has(q + ',' + r)) continue;
        const x = cx + W * (q + r / 2), y = cy + 1.5 * S * r, u = up[k++];
        tiles += `<polygon points="${hex(x, y, S)}" fill="#2a1d14" stroke="#3d2b1d" stroke-width="1.5"/>` + (u
          ? `<polygon points="${hex(x, y, S * 0.8)}" fill="#efe0b8" stroke="#c9ae6a" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y + 1).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${u[0].length > 1 && u[0] !== '💎' ? 13 : 16}" font-weight="800" fill="#2b1b10">${u[0]}</text><polygon points="${hex(x, y, S * 0.92)}" fill="none" stroke="${u[1]}" stroke-width="3"/>`
          : `<polygon points="${hex(x, y, S * 0.8)}" fill="#6b4426" stroke="#3a2414" stroke-width="2"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(S * 0.3).toFixed(1)}" fill="none" stroke="#8a5c37" stroke-width="1.4"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(S * 0.13).toFixed(1)}" fill="none" stroke="#8a5c37" stroke-width="1.4"/>`);
      }
      const title = (t, y) => `<text x="150" y="${y}" text-anchor="middle" font-size="56" font-weight="900" letter-spacing="-1" fill="url(#ffT)" stroke="#24140a" stroke-width="9" stroke-linejoin="round" paint-order="stroke">${t}</text>`;
      return `<svg viewBox="0 0 300 360" role="img" aria-label="Fossil Frenzy"><defs>
        <radialGradient id="ffB" cx="50%" cy="62%" r="75%"><stop offset="0" stop-color="#7a4620"/><stop offset=".55" stop-color="#3a2110"/><stop offset="1" stop-color="#1c0f08"/></radialGradient>
        <radialGradient id="ffG" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f5a524" stop-opacity=".5"/><stop offset="1" stop-color="#f5a524" stop-opacity="0"/></radialGradient>
        <linearGradient id="ffT" x1="0" y1="0" x2="0" y2="1"><stop offset=".1" stop-color="#ffe3a0"/><stop offset=".55" stop-color="#f5a524"/><stop offset="1" stop-color="#c8650f"/></linearGradient></defs>
        <rect width="300" height="360" fill="url(#ffB)"/><circle cx="150" cy="221" r="140" fill="url(#ffG)"/>
        ${tiles}${title('FOSSIL', 60)}${title('FRENZY', 112)}
        <rect x="52" y="331" width="196" height="24" rx="12" fill="#1c0f08" fill-opacity=".85" stroke="#f5a524" stroke-opacity=".6"/>
        <text x="150" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="800" letter-spacing="2" fill="#ffe3a0">PEEK · FLIP · MATCH · BANK</text></svg>`;
    },
    // Dig Dig Boom (placeholder cover until its own site is listed): a fizzing bomb in the dirt
    'dig-dig-boom': () => `<svg viewBox="0 0 300 360" role="img" aria-label="Dig Dig Boom"><defs>
        <linearGradient id="dbB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a2f1a"/><stop offset="1" stop-color="#2a0f0a"/></linearGradient>
        <radialGradient id="dbG" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd24a" stop-opacity=".7"/><stop offset="1" stop-color="#ffd24a" stop-opacity="0"/></radialGradient></defs>
        <rect width="300" height="360" fill="url(#dbB)"/>
        <path d="M0 270 Q60 250 120 272 T240 268 T300 262 V360 H0Z" fill="#6b4426"/><path d="M0 305 Q70 288 130 308 T260 302 T300 300 V360 H0Z" fill="#4a2e18"/><path d="M0 338 Q80 326 150 340 T300 334 V360 H0Z" fill="#33200f"/>
        <circle cx="208" cy="132" r="70" fill="url(#dbG)"/><circle cx="140" cy="212" r="68" fill="#17171c"/><ellipse cx="116" cy="186" rx="22" ry="14" fill="#fff" fill-opacity=".16" transform="rotate(-30 116 186)"/>
        <rect x="126" y="134" width="28" height="18" rx="4" fill="#3a3a44"/><path d="M142 134 Q150 100 190 106 T208 132" fill="none" stroke="#c9a46a" stroke-width="6" stroke-linecap="round"/>
        <polygon points="208,108 214,124 230,126 217,136 221,152 208,143 195,152 199,136 186,126 202,124" fill="#ffd24a" stroke="#ff8a1d" stroke-width="3"/>
        <text x="150" y="62" text-anchor="middle" font-size="46" font-weight="900" fill="#ffd24a" stroke="#2a0f0a" stroke-width="8" stroke-linejoin="round" paint-order="stroke">DIG DIG</text>
        <text x="150" y="304" text-anchor="middle" font-size="56" font-weight="900" fill="#ff8a1d" stroke="#2a0f0a" stroke-width="9" stroke-linejoin="round" paint-order="stroke">BOOM!</text></svg>`,
  };
  const art = g => (ART[g.art] ? ART[g.art]() : `<svg viewBox="0 0 300 360" role="img" aria-label="${esc(g.title)}"><rect width="300" height="360" fill="${esc(g.accent || '#d9953a')}"/><text x="150" y="190" text-anchor="middle" font-size="64">${esc(g.icon || '🎲')}</text></svg>`);

  const shown = L.games.filter(g => (g.listed || showUnlisted) && href(g));
  const tilt = i => ['-.7deg', '.6deg', '-.4deg', '.8deg'][i % 4];            // boxes sit a little askew on the shelf
  document.getElementById('app').innerHTML = `
    <header><h1>🎲 ${esc(L.name)}</h1><p class="tag">${esc(L.tagline)}</p></header>
    <ul class="shelf">${shown.map((g, i) => `
      <li><a class="box" data-id="${esc(g.id)}" href="${esc(href(g))}" style="--accent-c:${esc(g.accent || '#d9953a')};--tilt:${tilt(i)}" aria-label="${esc(g.title)}. ${esc(g.tagline || '')}">
        <div class="art">${art(g)}</div>
        <div class="strip">${[g.players, g.minutes].filter(Boolean).map(x => `<span class="pill">${esc(x)}</span>`).join('')}${store.get(PLAYED(g.id)) ? '<span class="played">Played</span>' : ''}</div>
        <h2 class="sr">${esc(g.title)}</h2>
      </a></li>`).join('')}</ul>
    <footer>Version ${esc(BUILD)}</footer>`;

  // remember which boxes have been opened (shown as a quiet "Played" tag next time)
  document.getElementById('app').addEventListener('click', e => {
    const a = e.target.closest('a.box');
    if (a) store.set(PLAYED(a.dataset.id), String(Date.now()));
  });
})();
</script>
</body>
</html>
