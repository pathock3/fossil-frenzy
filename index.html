<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tabletop Library">
<meta name="theme-color" content="#1b130e">
<meta name="build" content="__BUILD__">
<title>Tabletop Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<style>
:root { --bg: #1b130e; --panel: #271a12; --line: #4a3524; --text: #f1e6d2; --dim: #a8957a; --accent: #f5a524; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Segoe UI, Roboto, sans-serif; }
body { background: radial-gradient(ellipse at 50% -10%, #3a2616, var(--bg) 65%) fixed; padding: max(22px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
main { max-width: 980px; margin: 0 auto; }
header { text-align: center; margin: 14px 0 26px; }
h1 { margin: 0; font-size: clamp(34px, 7vw, 54px); letter-spacing: .5px; }
.tag { margin: 6px 0 0; color: var(--dim); font-size: clamp(15px, 2.4vw, 18px); }
/* the shelf: each game is a box you pick up and open */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; list-style: none; margin: 0; padding: 0; }
.box { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 230px; padding: 0 0 16px; border-radius: 16px; text-decoration: none; color: inherit; background: var(--panel);
  border: 2px solid var(--line); box-shadow: 0 6px 0 rgba(0,0,0,.35), 0 10px 22px rgba(0,0,0,.35); overflow: hidden; transition: transform .12s ease, box-shadow .12s ease; touch-action: manipulation; }
.box:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.35); }
.lid { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; background: var(--accent-c); color: #1b130e; }
.lid .icon { font-size: 54px; line-height: 1; }
.lid .played { font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; background: rgba(0,0,0,.22); color: #fff; border-radius: 99px; padding: 3px 10px; }
.box h2 { margin: 6px 18px 0; font-size: 24px; }
.box p { margin: 0 18px; color: var(--dim); font-size: 15px; line-height: 1.4; }
.box .meta { margin: auto 18px 0; display: flex; gap: 8px; flex-wrap: wrap; }
.box .meta span { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: #32231a; color: var(--text); }
footer { margin-top: 34px; text-align: center; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<main id="app"></main>

<!-- =====================================================================
     DATA BLOCK — the catalogue.  To add a game: put it in games/<id>/index.html and add an entry here.
     `listed: false` keeps a game off the shelf (open the library with ?unlisted to see it).
     An entry with `url` instead of `path` links out to a separate site (e.g. the flagship).
     ===================================================================== -->
<script id="data">
const LIBRARY = {
  name: 'Tabletop Library',
  tagline: 'Games designed by Patrick Blim-Hockberger',   // all games in the library share one designer, so it is said once, at the top
  games: [
    {
      id: 'fossil-frenzy',
      title: 'Fossil Frenzy',
      tagline: 'A fast memory game: peek, flip, match and bank fossils — pass and play, or take on five opponents in the campaign.',
      players: '1–4 players',
      minutes: '15–20 min',
      icon: '🦖',
      accent: '#d9953a',
      path: 'games/fossil-frenzy/index.html',
      listed: true,
    },
    {
      id: 'dig-dig-boom',
      title: 'Dig Dig Boom',
      tagline: 'The flagship — its own site. Put its web address in `url` and set `listed: true` to put it on the shelf.',
      players: '',
      minutes: '',
      icon: '💣',
      accent: '#c4553b',
      url: null,
      listed: false,
    },
  ],
};
</script>

<script id="ui">
(() => {
  'use strict';
  const L = LIBRARY;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const PLAYED = id => 'tabletop-library-played-' + id;
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable: fine */ } },
  };
  const BUILD = (() => { const m = document.querySelector('meta[name=build]'); const v = m ? m.content : ''; return !v || v.startsWith('__') ? 'local file' : v; })();
  const showUnlisted = /[?&]unlisted\b/.test(location.search);
  const href = g => g.path || g.url || '';

  const shown = L.games.filter(g => (g.listed || showUnlisted) && href(g));
  document.getElementById('app').innerHTML = `
    <header><h1>🎲 ${esc(L.name)}</h1><p class="tag">${esc(L.tagline)}</p></header>
    <ul class="shelf">${shown.map(g => `
      <li><a class="box" data-id="${esc(g.id)}" href="${esc(href(g))}" style="--accent-c:${esc(g.accent || '#d9953a')}">
        <div class="lid"><span class="icon">${esc(g.icon || '🎲')}</span>${store.get(PLAYED(g.id)) ? '<span class="played">Played</span>' : ''}</div>
        <h2>${esc(g.title)}</h2>
        <p>${esc(g.tagline || '')}</p>
        <div class="meta">${[g.players, g.minutes].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('')}</div>
      </a></li>`).join('')}</ul>
    <footer>Version ${esc(BUILD)}</footer>`;

  // remember which boxes have been opened (shown as a quiet "Played" tag next time)
  document.getElementById('app').addEventListener('click', e => {
    const a = e.target.closest('a.box');
    if (a) store.set(PLAYED(a.dataset.id), String(Date.now()));
  });
})();
</script>
</body>
</html>
